openapi: '3.1.1'
info:
  title: Civitai Orchestration - wdTagging Recipe
  description: OpenAPI specification for the wdTagging built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/wdTagging:
    post:
      tags:
        - Recipes
      summary: WDTagging
      description: 'Performs Waifu Diffusion tagging on media content to identify characteristics, objects, and themes.'
      operationId: InvokeWDTaggingStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WDTaggingInput'
          text/json:
            schema:
              $ref: '#/components/schemas/WDTaggingInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/WDTaggingInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WDTaggingOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
    WDTaggingInput:
      required:
        - mediaUrl
      type: object
      properties:
        model:
          type:
            - 'null'
            - string
          description: 'The model to use for tagging (e.g., "wd14-vit.v1").'
        mediaUrl:
          type: string
          description: The URL of the media to tag (image or video).
          format: uri
        threshold:
          type:
            - 'null'
            - number
          description: Optional threshold for tag confidence filtering. Tags below this threshold will be excluded.
          format: double
        prompt:
          type:
            - 'null'
            - string
          description: Optional prompt to guide the tagging process.
      additionalProperties: false
      description: Represents the input information needed for the WDTagging workflow step.
    WDTaggingOutput:
      required:
        - tags
      type: object
      properties:
        tags:
          type: object
          additionalProperties:
            type: number
            format: double
          description: The detected tags with their confidence scores.
        rating:
          type:
            - 'null'
            - object
          additionalProperties:
            type: number
            format: double
          description: 'The content rating scores (general, sensitive, questionable, explicit).'
      additionalProperties: false
      description: Represents the output information returned from the WDTagging workflow step.
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes