openapi: '3.1.1'
info:
  title: Civitai Orchestration - modelHash Recipe
  description: OpenAPI specification for the modelHash built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/modelHash:
    post:
      tags:
        - Recipes
      summary: ModelHash
      description: 'Computes Civitai content hashes (SHA256, AutoV1/2/3, Blake3, CRC32) of a model file.'
      operationId: InvokeModelHashStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelHashInput'
          text/json:
            schema:
              $ref: '#/components/schemas/ModelHashInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ModelHashInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelHashOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ModelHashInput:
      required:
        - model
      type: object
      properties:
        model:
          pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
          type: string
          description: The AIR of the model file to hash.
      additionalProperties: false
      description: Represents the input information needed for the ModelHash workflow step.
    ModelHashOutput:
      type: object
      properties:
        sha256:
          type:
            - 'null'
            - string
          description: SHA256 hash of the full file.
        autoV1:
          type:
            - 'null'
            - string
          description: AutoV1 short hash (8 chars of SHA256 over a 64 KB block starting at 1 MB).
        autoV2:
          type:
            - 'null'
            - string
          description: AutoV2 short hash (first 10 chars of SHA256).
        autoV3:
          type:
            - 'null'
            - string
          description: AutoV3 hash (SHA256 of the file with safetensors header metadata stripped).
        blake3:
          type:
            - 'null'
            - string
          description: Blake3 hash of the full file.
        crc32:
          type:
            - 'null'
            - string
          description: CRC32 of the full file.
      additionalProperties: false
      description: Represents the output information returned from the ModelHash workflow step.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes