openapi: '3.1.1'
info:
  title: Civitai Orchestration - videoGen Recipe
  description: OpenAPI specification for the videoGen built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/videoGen:
    post:
      tags:
        - Recipes
      summary: Video generation
      description: Generate videos through text/image inputs using any of our supported engines
      operationId: InvokeVideoGenStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenInput'
          text/json:
            schema:
              $ref: '#/components/schemas/VideoGenInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VideoGenInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoGenOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AudioBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            duration:
              type:
                - 'null'
                - number
              description: Duration of the audio in seconds
              format: float
            type:
              enum:
                - audio
              type: string
          additionalProperties: false
    Blob:
      required:
        - available
        - id
        - type
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          description: Gets the id of the blob that contains this image.
        available:
          type: boolean
          description: Gets a value indicating whether the blob is available.
        url:
          type:
            - 'null'
            - string
          description: Gets a url that can be used to preview the blob.
          format: uri
        urlExpiresAt:
          type:
            - 'null'
            - string
          description: Get when the url is set to expire
          format: date-time
        jobId:
          type:
            - 'null'
            - string
          description: Get the id of the job that is associated with this blob.
        nsfwLevel:
          $ref: '#/components/schemas/NSFWLevel'
        blockedReason:
          type:
            - 'null'
            - string
          description: Get an optional reason for why the blob was blocked. This is only set if the blob was blocked.
        tier:
          type:
            - 'null'
            - string
          description: "Get the storage tier holding this blob, when it is not the default one. Null means the default\ntier, which is what every blob produced before the managed tier existed deserializes as.\nCarried so a downstream step or consumer resolves the right grain directly rather than\nprobing each tier for the key."
      additionalProperties: false
      description: Represents a blob that gets produced as part of a specific job
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageBlob'
          video: '#/components/schemas/VideoBlob'
          audio: '#/components/schemas/AudioBlob'
          model3d: '#/components/schemas/Model3DBlob'
    ComfyLtx23AudioToVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyLtx23VideoGenInput'
        - required:
            - engine
            - operation
            - sourceAudio
          type: object
          properties:
            referenceImage:
              type:
                - 'null'
                - string
              description: 'Optional reference image (e.g. talking-head subject). When provided, the video is anchored to this image.'
            sourceAudio:
              type: string
              format: uri
            imageGuideStrength:
              maximum: 1
              minimum: 0
              type: number
              description: "Strength of the image guide conditioning (0.0 to 1.0). Only used when ReferenceImage is provided.\nStage 1 strength; stage 2 is fixed at 0.5."
              format: float
              default: 0.7
            audioToVideoAttentionScale:
              maximum: 10
              minimum: 0
              type: number
              description: "Audio-to-video cross-attention boost applied via LTX2AttentionTunerPatch.\nHigher values make audio drive the video more strongly."
              format: float
              default: 2
            operation:
              enum:
                - audioToVideo
              type: string
            engine:
              enum:
                - ltx2.3
              type: string
          additionalProperties: false
      description: 'Generate video driven by a reference audio track, optionally anchored to a reference image (ComfyUI backend)'
    ComfyLtx23CreateVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyLtx23VideoGenInput'
        - required:
            - engine
            - operation
          type: object
          properties:
            images:
              maxItems: 1
              type: array
              items:
                type: string
                description: 'Either A URL, A DataURL or a Base64 string'
              description: Optional source image for image-to-video generation
            operation:
              enum:
                - createVideo
              type: string
            engine:
              enum:
                - ltx2.3
              type: string
          additionalProperties: false
      description: 'Create video from text prompt, optionally with a source image (ComfyUI backend)'
    ComfyLtx23EditVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyLtx23VideoGenInput'
        - required:
            - engine
            - operation
            - sourceVideo
          type: object
          properties:
            sourceVideo:
              type: string
              format: uri
            cannyLowThreshold:
              maximum: 1
              minimum: 0
              type: number
              format: float
              default: 0.4
            cannyHighThreshold:
              maximum: 1
              minimum: 0
              type: number
              format: float
              default: 0.8
            guideStrength:
              maximum: 1
              minimum: 0
              type: number
              format: float
              default: 1
            operation:
              enum:
                - editVideo
              type: string
            engine:
              enum:
                - ltx2.3
              type: string
          additionalProperties: false
      description: Edit/transform an existing video using Canny edge control (ComfyUI backend)
    ComfyLtx23ExtendVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyLtx23VideoGenInput'
        - required:
            - engine
            - operation
            - sourceVideo
          type: object
          properties:
            sourceVideo:
              type: string
              format: uri
            numFrames:
              maximum: 481
              minimum: 9
              type: integer
              format: int32
              default: 121
            operation:
              enum:
                - extendVideo
              type: string
            engine:
              enum:
                - ltx2.3
              type: string
          additionalProperties: false
      description: Extend an existing video with new content (ComfyUI backend)
    ComfyLtx23FirstLastFrameToVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyLtx23VideoGenInput'
        - required:
            - engine
            - operation
          type: object
          properties:
            firstFrame:
              type:
                - 'null'
                - string
              description: First frame guide image. At least one of FirstFrame or LastFrame must be provided.
            lastFrame:
              type:
                - 'null'
                - string
              description: Last frame guide image. At least one of FirstFrame or LastFrame must be provided.
            frameGuideStrength:
              maximum: 1
              minimum: 0
              type: number
              description: Strength of the frame guide conditioning (0.0 to 1.0).
              format: float
              default: 0.7
            operation:
              enum:
                - firstLastFrameToVideo
              type: string
            engine:
              enum:
                - ltx2.3
              type: string
          additionalProperties: false
      description: Generate video guided by first and/or last frame images using LTXVAddGuide conditioning (ComfyUI backend)
    ComfyLtx23VideoGenInput:
      allOf:
        - $ref: '#/components/schemas/VideoGenInput'
        - required:
            - engine
            - operation
          type: object
          properties:
            operation:
              type:
                - 'null'
                - string
              default: createVideo
            negativePrompt:
              type:
                - 'null'
                - string
            seed:
              type:
                - 'null'
                - integer
              format: int32
            duration:
              maximum: 20
              minimum: 3
              type: integer
              description: Duration in seconds (3 through 20)
              format: int32
              default: 5
            width:
              type: integer
              format: int32
              default: 1280
            height:
              type: integer
              format: int32
              default: 720
            fps:
              maximum: 60
              minimum: 1
              type: number
              format: float
              default: 24
            generateAudio:
              type: boolean
              default: true
            guidanceScale:
              maximum: 10
              minimum: 1
              type: number
              format: float
              default: 4
            steps:
              maximum: 50
              minimum: 8
              type: integer
              format: int32
              default: 20
            model:
              enum:
                - 22b-dev
                - 22b-distilled
              type: string
              default: 22b-dev
            loras:
              type: object
              additionalProperties:
                type: number
                format: double
            diffusionModel:
              pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
              type:
                - 'null'
                - string
              description: "Optional override for the LTX 2.3 diffusion-model checkpoint. When set, replaces the\ntransformer file selected by Civitai.Orchestration.Grains.Workflows.Steps.VideoGen.ComfyLtx23VideoGenInput.Model while leaving the CLIPs, VAEs, and\nupscale-LoRA behavior unchanged. Use to point at a community fine-tune (e.g. SulphurAI/Sulphur-2-base)."
            quantity:
              maximum: 10
              minimum: 1
              type: integer
              description: "Number of videos to generate in this single job. Each video uses a distinct seed\n(Seed + slotIndex) and is produced by re-running the Comfy workflow."
              format: int32
              default: 1
            engine:
              enum:
                - ltx2.3
              type: string
          additionalProperties: false
          discriminator:
            propertyName: operation
            mapping:
              createVideo: '#/components/schemas/ComfyLtx23CreateVideoInput'
              extendVideo: '#/components/schemas/ComfyLtx23ExtendVideoInput'
              editVideo: '#/components/schemas/ComfyLtx23EditVideoInput'
              firstLastFrameToVideo: '#/components/schemas/ComfyLtx23FirstLastFrameToVideoInput'
              videoToVideo: '#/components/schemas/ComfyLtx23VideoToVideoInput'
              audioToVideo: '#/components/schemas/ComfyLtx23AudioToVideoInput'
      description: LTX Video v2.3 generation via ComfyUI backend
    ComfyLtx23VideoToVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyLtx23VideoGenInput'
        - required:
            - engine
            - operation
            - sourceVideo
          type: object
          properties:
            sourceVideo:
              type: string
              format: uri
            guideStrength:
              maximum: 1
              minimum: 0
              type: number
              format: float
              default: 0.2
            operation:
              enum:
                - videoToVideo
              type: string
            engine:
              enum:
                - ltx2.3
              type: string
          additionalProperties: false
      description: Style-transfer an existing video using prompt guidance (ComfyUI backend)
    ComfyLtx25AudioToVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyLtx25VideoGenInput'
        - required:
            - engine
            - operation
