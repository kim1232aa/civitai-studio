    ComfyMiniMaxH3ReferenceToVideoInput:
      allOf:
        - $ref: '#/components/schemas/ComfyMiniMaxH3VideoGenInput'
        - required:
            - engine
            - images
            - operation
          type: object
          properties:
            images:
              maxItems: 9
              minItems: 1
              type: array
