openapi: '3.1.1'
info:
  title: Civitai Orchestration - composeMedia Recipe
  description: OpenAPI specification for the composeMedia built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/composeMedia:
    post:
      tags:
        - Recipes
      summary: Compose Media
      description: "Composes multiple audio and/or video elements onto a single timeline and canvas: overlay and\n/// stack videos, scale and pad them to an output canvas, mix and place audio, and apply per-element\n/// transformers (fades, volume). Each element is placed at its own absolute or implicitly-sequenced\n/// start time. Produces a video blob when any element is video, otherwise an audio blob. Pair with\n/// text-to-speech, music, and video-generation steps to assemble narrated clips, multi-speaker\n/// scenes with cross-talk, or picture-in-picture compositions."
      operationId: InvokeComposeMediaStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComposeMediaInput'
          text/json:
            schema:
              $ref: '#/components/schemas/ComposeMediaInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ComposeMediaInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComposeMediaOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AudioBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            duration:
              type:
                - 'null'
                - number
              description: Duration of the audio in seconds
              format: float
            type:
              enum:
                - audio
              type: string
          additionalProperties: false
    AudioComposeMediaOutput:
      allOf:
        - $ref: '#/components/schemas/ComposeMediaOutput'
        - required:
            - audioBlob
            - type
          type: object
          properties:
            audioBlob:
              $ref: '#/components/schemas/AudioBlob'
            type:
              enum:
                - audio
              type: string
          additionalProperties: false
      description: An audio mixdown produced when the composition has no video.
    BackgroundRemovalTransformer:
      allOf:
        - $ref: '#/components/schemas/MediaTransformer'
        - required:
            - type
          type: object
          properties:
            shadowRemoval:
              $ref: '#/components/schemas/ShadowRemoval'
            fromCenter:
              type: boolean
              description: "Also seed the fill from the frame centre, for artwork with an enclosed background-coloured\nhole (e.g. avatar frames)."
              default: false
            type:
              enum:
                - backgroundRemoval
              type: string
          additionalProperties: false
      description: "Removes the element's background per frame via a deterministic edge-connected flood fill\n(unlike the AI-matting `imageBackgroundRemoval` step): the background colour is estimated\nfrom the frame border and every border-connected pixel within tolerance becomes transparent,\nso background-coloured pixels enclosed inside the artwork are kept. Video elements only. Pair\nwith an alpha-capable output container (webp) and a transparent canvas background to carry the\ntransparency into the output."
    Blob:
      required:
        - available
        - id
        - type
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          description: Gets the id of the blob that contains this image.
        available:
          type: boolean
          description: Gets a value indicating whether the blob is available.
        url:
          type:
            - 'null'
            - string
          description: Gets a url that can be used to preview the blob.
          format: uri
        urlExpiresAt:
          type:
            - 'null'
            - string
          description: Get when the url is set to expire
          format: date-time
        jobId:
          type:
            - 'null'
            - string
          description: Get the id of the job that is associated with this blob.
        nsfwLevel:
          $ref: '#/components/schemas/NSFWLevel'
        blockedReason:
          type:
            - 'null'
            - string
          description: Get an optional reason for why the blob was blocked. This is only set if the blob was blocked.
        tier:
          type:
            - 'null'
            - string
          description: "Get the storage tier holding this blob, when it is not the default one. Null means the default\ntier, which is what every blob produced before the managed tier existed deserializes as.\nCarried so a downstream step or consumer resolves the right grain directly rather than\nprobing each tier for the key."
      additionalProperties: false
      description: Represents a blob that gets produced as part of a specific job
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageBlob'
          video: '#/components/schemas/VideoBlob'
          audio: '#/components/schemas/AudioBlob'
          model3d: '#/components/schemas/Model3DBlob'
    ComposeMediaElementInput:
      type: object
      properties:
        url:
          type:
            - 'null'
            - string
          description: "The source media URL. Either a direct `\"https://...\"` URL or a `$ref` to a prior\nstep's `Output.AudioBlob.Url` or `Output.VideoBlob.Url`."
          format: uri
        at:
          type:
            - 'null'
            - number
          description: "Absolute start time on the output timeline, in seconds. When set, this element is anchored\nat this position and excluded from the implicit sequencing chain — useful for a music bed,\nor for placing an audio track at a known time over a video. When unset, the element starts\nafter the previous non-anchored element ends, nudged by Civitai.Orchestration.Grains.Workflows.Steps.ComposeMedia.ComposeMediaElementInput.Offset."
          format: float
        offset:
          type: number
          description: "Seconds to nudge this element relative to its implicit \"after-previous\" position. Negative\nvalues produce overlap/interruption; positive values produce a gap. Ignored when\nCivitai.Orchestration.Grains.Workflows.Steps.ComposeMedia.ComposeMediaElementInput.At is set."
          format: float
          default: 0
        layout:
          $ref: '#/components/schemas/MediaLayout'
        transformers:
          type: array
          items:
            $ref: '#/components/schemas/MediaTransformer'
          description: 'Ordered per-element transformers (fades, volume, ...) applied in array order.'
      additionalProperties: false
      description: A single audio or video element participating in a composition.
    ComposeMediaInput:
      required:
        - elements
      type: object
      properties:
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ComposeMediaElementInput'
          description: "The elements to compose, in implicit sequencing order. Overlapping audio intervals are\nmixed; overlapping video is layered by canvas `zOrder` then array order. To stitch\nvideos end-to-end, list them in order with no `at`/`offset`."
        canvas:
          $ref: '#/components/schemas/MediaCanvas'
        output:
          $ref: '#/components/schemas/ComposeMediaOutputSpec'
        normalize:
          type: boolean
          description: "If true, divide the audio mix by the number of overlapping elements to avoid clipping.\nDefaults to false to preserve per-element volume levels."
          default: false
      additionalProperties: false
      description: Input for the ComposeMedia workflow step.
    ComposeMediaOutput:
      required:
        - elements
        - type
      type: object
      properties:
        type:
          type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/ComposeMediaResolvedElement'
          description: "Per-element resolved timing in input order — useful for rendering subtitles, speaker\nhighlights, or chapter markers without re-probing every source clip."
      additionalProperties: false
      description: "Output from the ComposeMedia workflow step. Discriminated on `type`: an\nCivitai.Orchestration.Grains.Workflows.Steps.ComposeMedia.AudioComposeMediaOutput (`\"audio\"`) for an audio mixdown, or a\nCivitai.Orchestration.Grains.Workflows.Steps.ComposeMedia.VideoComposeMediaOutput (`\"video\"`) for a video composition."
      discriminator:
        propertyName: type
        mapping:
          audio: '#/components/schemas/AudioComposeMediaOutput'
          video: '#/components/schemas/VideoComposeMediaOutput'
    ComposeMediaOutputSpec:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MediaOutputType'
        container:
          $ref: '#/components/schemas/MediaContainer'
      additionalProperties: false
      description: "Describes the desired output of a composition. Both fields are optional — leave\nCivitai.Orchestration.Grains.Workflows.Steps.ComposeMedia.ComposeMediaOutputSpec.Type unset to derive the kind from the elements."
    ComposeMediaResolvedElement:
      required:
        - duration
        - startSeconds
      type: object
      properties:
        startSeconds:
          type: number
          description: 'Where this element starts on the output timeline, in seconds.'
          format: float
        duration:
          type: number
          description: 'Probed duration of the source clip, in seconds.'
          format: float
      additionalProperties: false
      description: Resolved timing for a single element in the composed output.
    FadeInTransformer:
      allOf:
        - $ref: '#/components/schemas/MediaTransformer'
        - required:
            - durationMs
            - type
          type: object
          properties:
            durationMs:
              type: integer
              description: Fade-in duration in milliseconds.
              format: int32
            type:
              enum:
                - fadeIn
              type: string
          additionalProperties: false
      description: Linear fade from silence (audio) and/or black (video) at the head of the element.
    FadeOutTransformer:
      allOf:
        - $ref: '#/components/schemas/MediaTransformer'
        - required:
            - durationMs
            - type
          type: object
          properties:
            durationMs:
              type: integer
              description: Fade-out duration in milliseconds.
              format: int32
            type:
              enum:
                - fadeOut
              type: string
          additionalProperties: false
      description: Linear fade to silence (audio) and/or black (video) at the tail of the element.
    ImageBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            previewUrl:
              type:
                - 'null'
                - string
              description: Gets a url that can be used to preview a resized version of the image.
              format: uri
            previewUrlExpiresAt:
              type:
                - 'null'
                - string
              description: Gets when the preview url is set to expire.
              format: date-time
            type:
              enum:
                - image
              type: string
          additionalProperties: false
    MediaCanvas:
      required:
        - height
        - width
      type: object
      properties:
        width:
          type: integer
          description: Output width in pixels.
          format: int32
        height:
          type: integer
          description: Output height in pixels.
          format: int32
        fps:
          type: integer
          description: Output frame rate.
          format: int32
          default: 30
        background:
          type: string
          description: "Hex background colour (e.g. `\"#000000\"`) painted where no element covers the canvas.\nAn 8-digit `\"#RRGGBBAA\"` value sets the background alpha; anything below fully opaque\nrequires an alpha-capable output container (webp)."
          default: '#000000'
      additionalProperties: false
      description: "Output canvas geometry. Set this to produce a video composition; leave it null for an\nall-audio mixdown."
    MediaContainer:
      enum:
        - auto
        - mp4
        - webm
        - ogg
        - mp3
        - webp
      type: string
      description: Output container for a composition.
    MediaFit:
      enum:
        - contain
        - cover
        - stretch
      type: string
      description: How a video element is fitted into the output canvas when its aspect ratio differs.
    MediaLayout:
      type: object
      properties:
        zOrder:
          type: integer
          description: Stacking order. Higher values draw on top; ties are broken by element index.
          format: int32
          default: 0
        x:
          type: integer
          description: 'X offset, in pixels, of the element''s top-left corner on the canvas.'
          format: int32
          default: 0
        y:
          type: integer
          description: 'Y offset, in pixels, of the element''s top-left corner on the canvas.'
          format: int32
          default: 0
        scale:
          type: number
          description: Uniform scale applied to the element before placement. `1.0` keeps the fitted size.
          format: float
          default: 1
        fit:
          $ref: '#/components/schemas/MediaFit'
      additionalProperties: false
      description: "Spatial placement of a video element on the output canvas. Ignored for audio elements and\nfor all-audio compositions. Exactly one layout per element."
    MediaOutputType:
      enum:
        - audio
        - video
      type: string
      description: "The kind of output a composition produces. When left unspecified on the input, it is derived\nfrom the elements: video if any element is video (or a canvas is supplied), otherwise audio."
    MediaTransformer:
      required:
        - type
      type: object
      properties:
        type:
          type: string
      additionalProperties: false
      description: "Base class for per-element transformers applied to a single media element before it is\ncomposited onto the output timeline. Transformers are applied in array order. Extensible:\nadd a derived record plus a `[JsonDerivedType]` entry here."
      discriminator:
        propertyName: type
        mapping:
          fadeIn: '#/components/schemas/FadeInTransformer'
          fadeOut: '#/components/schemas/FadeOutTransformer'
          volume: '#/components/schemas/VolumeTransformer'
          backgroundRemoval: '#/components/schemas/BackgroundRemovalTransformer'
    Model3DBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - format
            - type
          type: object
          properties:
            format:
              type: string
              description: 'File format of the 3D model (e.g. "glb", "fbx", "obj", "usdz").'
            type:
              enum:
                - model3d
              type: string
          additionalProperties: false
    NSFWLevel:
      enum:
        - pg
        - pg13
        - r
        - x
        - xxx
        - na
      type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
    ShadowRemoval:
      enum:
        - off
        - gentle
        - aggressive
      type: string
      description: How aggressively background removal also strips soft drop shadows the strict color match misses.
    VideoBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            type:
              enum:
                - video
              type: string
          additionalProperties: false
    VideoComposeMediaOutput:
      allOf:
        - $ref: '#/components/schemas/ComposeMediaOutput'
        - required:
            - type
            - videoBlob
          type: object
          properties:
            videoBlob:
              $ref: '#/components/schemas/VideoBlob'
            type:
              enum:
                - video
              type: string
          additionalProperties: false
      description: 'A video composition produced when any element is video, or video output was requested.'
    VolumeTransformer:
      allOf:
        - $ref: '#/components/schemas/MediaTransformer'
        - required:
            - db
            - type
          type: object
          properties:
            db:
              type: number
              description: Gain adjustment in dB.
              format: float
            type:
              enum:
                - volume
              type: string
          additionalProperties: false
      description: "Adjusts the element's audio gain in decibels. `0` is unity gain; negative values\nattenuate. No-op for elements with no audio stream."
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes