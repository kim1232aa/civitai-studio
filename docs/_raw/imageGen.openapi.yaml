openapi: '3.1.1'
info:
  title: Civitai Orchestration - imageGen Recipe
  description: OpenAPI specification for the imageGen built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/imageGen:
    post:
      tags:
        - Recipes
      summary: Image Generation
      description: Generate images through text/image inputs using any of our supported engines
      operationId: InvokeImageGenStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenInput'
          text/json:
            schema:
              $ref: '#/components/schemas/ImageGenInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ImageGenInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AnimaCreateImageGenInput:
      allOf:
        - $ref: '#/components/schemas/AnimaImageGenInput'
        - required:
            - ecosystem
            - engine
            - operation
          type: object
          properties:
            width:
              maximum: 2048
              minimum: 64
              type: integer
              format: int32
              default: 1024
            height:
              maximum: 2048
              minimum: 64
              type: integer
              format: int32
              default: 1024
            operation:
              enum:
                - createImage
              type: string
            ecosystem:
              enum:
                - anima
              type: string
            engine:
              enum:
                - sdcpp
              type: string
          additionalProperties: false
    AnimaImageGenInput:
      allOf:
        - $ref: '#/components/schemas/SdCppImageGenInput'
        - required:
            - ecosystem
            - engine
            - operation
            - prompt
          type: object
          properties:
            operation:
              type: string
            prompt:
              maxLength: 10000
              minLength: 0
              type: string
            negativePrompt:
              maxLength: 10000
              minLength: 0
              type:
                - 'null'
                - string
            sampleMethod:
              $ref: '#/components/schemas/SdCppSampleMethod'
            schedule:
              $ref: '#/components/schemas/SdCppSchedule'
            steps:
              maximum: 150
              minimum: 1
              type: integer
              format: int32
              default: 30
            cfgScale:
              maximum: 30
              minimum: 0
              type: number
              format: double
              default: 4
            seed:
              type:
                - 'null'
                - integer
              format: int64
            quantity:
              maximum: 12
              minimum: 1
              type: integer
              format: int32
              default: 1
            loras:
              type: object
              additionalProperties:
                type: number
                format: double
            diffuserModel:
              pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
              type: string
            ecosystem:
              enum:
                - anima
              type: string
            engine:
              enum:
                - sdcpp
              type: string
          additionalProperties: false
          discriminator:
            propertyName: operation
            mapping:
              createImage: '#/components/schemas/AnimaCreateImageGenInput'
              createVariant: '#/components/schemas/AnimaVariantImageGenInput'
    AnimaVariantImageGenInput:
      allOf:
        - $ref: '#/components/schemas/AnimaImageGenInput'
        - required:
            - ecosystem
            - engine
            - image
            - operation
          type: object
          properties:
            width:
              maximum: 2048
              minimum: 64
              type: integer
              format: int32
              default: 1024
            height:
              maximum: 2048
              minimum: 64
              type: integer
              format: int32
              default: 1024
            image:
              type: string
              description: 'Either A URL, A DataURL or a Base64 string'
            strength:
              maximum: 1
              minimum: 0
              type: number
              format: double
              default: 0.7
            operation:
              enum:
                - createVariant
              type: string
            ecosystem:
              enum:
                - anima
              type: string
            engine:
              enum:
                - sdcpp
              type: string
          additionalProperties: false
    AudioBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            duration:
              type:
                - 'null'
                - number
              description: Duration of the audio in seconds
              format: float
            type:
              enum:
                - audio
              type: string
          additionalProperties: false
    Blob:
      required:
        - available
        - id
        - type
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          description: Gets the id of the blob that contains this image.
        available:
          type: boolean
          description: Gets a value indicating whether the blob is available.
        url:
          type:
            - 'null'
            - string
          description: Gets a url that can be used to preview the blob.
          format: uri
        urlExpiresAt:
          type:
            - 'null'
            - string
          description: Get when the url is set to expire
          format: date-time
        jobId:
          type:
            - 'null'
            - string
          description: Get the id of the job that is associated with this blob.
        nsfwLevel:
          $ref: '#/components/schemas/NSFWLevel'
        blockedReason:
          type:
            - 'null'
            - string
          description: Get an optional reason for why the blob was blocked. This is only set if the blob was blocked.
        tier:
          type:
            - 'null'
            - string
          description: "Get the storage tier holding this blob, when it is not the default one. Null means the default\ntier, which is what every blob produced before the managed tier existed deserializes as.\nCarried so a downstream step or consumer resolves the right grain directly rather than\nprobing each tier for the key."
      additionalProperties: false
      description: Represents a blob that gets produced as part of a specific job
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageBlob'
          video: '#/components/schemas/VideoBlob'
          audio: '#/components/schemas/AudioBlob'
          model3d: '#/components/schemas/Model3DBlob'
