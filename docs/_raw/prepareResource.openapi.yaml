openapi: '3.1.1'
info:
  title: Civitai Orchestration - prepareResource Recipe
  description: OpenAPI specification for the prepareResource built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/prepareResource:
    post:
      tags:
        - Recipes
      summary: Prepare Resource
      description: Loads a resource into a provider so later work needing it does not pay the cold-start download. Succeeds immediately when the resource is already available on the fleet.
      operationId: InvokePrepareResourceStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepareResourceInput'
          text/json:
            schema:
              $ref: '#/components/schemas/PrepareResourceInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PrepareResourceInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepareResourceOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    PrepareResourceInput:
      required:
        - resource
      type: object
      properties:
        resource:
          pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
          type: string
          description: The AIR of the resource to make available.
      additionalProperties: false
      description: Represents the input information needed for the PrepareResource workflow step.
    PrepareResourceOutput:
      type: object
      properties:
        resource:
          pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
          type:
            - 'null'
            - string
          description: The resource that was prepared.
        preparedAt:
          type:
            - 'null'
            - string
          description: When the resource became available. Null while the step has not completed.
          format: date-time
        provider:
          type:
            - 'null'
            - string
          description: The provider the resource was prepared on.
      additionalProperties: false
      description: The result of a PrepareResource workflow step.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes