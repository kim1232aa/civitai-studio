openapi: '3.1.1'
info:
  title: Civitai Orchestration - videoFrameExtraction Recipe
  description: OpenAPI specification for the videoFrameExtraction built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/videoFrameExtraction:
    post:
      tags:
        - Recipes
      summary: Video Frame Extraction
      description: 'Extracts unique frames from a video at a specified rate, filtering near-duplicates by perceptual hash.'
      operationId: InvokeVideoFrameExtractionStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoFrameExtractionInput'
          text/json:
            schema:
              $ref: '#/components/schemas/VideoFrameExtractionInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VideoFrameExtractionInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoFrameExtractionOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AudioBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            duration:
              type:
                - 'null'
                - number
              description: Duration of the audio in seconds
              format: float
            type:
              enum:
                - audio
              type: string
          additionalProperties: false
    Blob:
      required:
        - available
        - id
        - type
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          description: Gets the id of the blob that contains this image.
        available:
          type: boolean
          description: Gets a value indicating whether the blob is available.
        url:
          type:
            - 'null'
            - string
          description: Gets a url that can be used to preview the blob.
          format: uri
        urlExpiresAt:
          type:
            - 'null'
            - string
          description: Get when the url is set to expire
          format: date-time
        jobId:
          type:
            - 'null'
            - string
          description: Get the id of the job that is associated with this blob.
        nsfwLevel:
          $ref: '#/components/schemas/NSFWLevel'
        blockedReason:
          type:
            - 'null'
            - string
          description: Get an optional reason for why the blob was blocked. This is only set if the blob was blocked.
        tier:
          type:
            - 'null'
            - string
          description: "Get the storage tier holding this blob, when it is not the default one. Null means the default\ntier, which is what every blob produced before the managed tier existed deserializes as.\nCarried so a downstream step or consumer resolves the right grain directly rather than\nprobing each tier for the key."
      additionalProperties: false
      description: Represents a blob that gets produced as part of a specific job
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageBlob'
          video: '#/components/schemas/VideoBlob'
          audio: '#/components/schemas/AudioBlob'
          model3d: '#/components/schemas/Model3DBlob'
    ImageBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            previewUrl:
              type:
                - 'null'
                - string
              description: Gets a url that can be used to preview a resized version of the image.
              format: uri
            previewUrlExpiresAt:
              type:
                - 'null'
                - string
              description: Gets when the preview url is set to expire.
              format: date-time
            type:
              enum:
                - image
              type: string
          additionalProperties: false
    Model3DBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - format
            - type
          type: object
          properties:
            format:
              type: string
              description: 'File format of the 3D model (e.g. "glb", "fbx", "obj", "usdz").'
            type:
              enum:
                - model3d
              type: string
          additionalProperties: false
    NSFWLevel:
      enum:
        - pg
        - pg13
        - r
        - x
        - xxx
        - na
      type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
    VideoBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            type:
              enum:
                - video
              type: string
          additionalProperties: false
    VideoFrameExtractionInput:
      required:
        - videoUrl
      type: object
      properties:
        videoUrl:
          type: string
          description: The URL of the video to extract frames from.
          format: uri
        frameRate:
          type: number
          description: "The rate at which to extract frames (frames per second).\nDefault is 1.0 (one frame per second)."
          format: double
          default: 1
        uniqueThreshold:
          type: number
          description: "The similarity threshold for determining unique frames (0.0 to 1.0).\nFrames with similarity above this threshold are considered duplicates and filtered out.\nDefault is 0.9 (90% similarity)."
          format: double
          default: 0.9
        maxFrames:
          type:
            - 'null'
            - integer
          description: "Optional maximum number of unique frames to extract.\nIf null, all unique frames will be extracted."
          format: int32
        startTime:
          type: number
          description: "Time in seconds to seek to before extracting frames.\nDefault is 0 (start of video)."
          format: double
          default: 0
        public:
          type:
            - 'null'
            - boolean
          description: "Serves the frames at stable unsigned urls. Privileged callers only: nothing gates a read of\none, so a block decided after the fact cannot take it back."
      additionalProperties: false
      description: Represents the input information needed for the VideoFrameExtraction workflow step.
    VideoFrameExtractionOutput:
      required:
        - frames
        - totalFramesExtracted
      type: object
      properties:
        frames:
          type: array
          items:
            $ref: '#/components/schemas/ImageBlob'
          description: A collection of extracted unique video frames as image blobs.
        totalFramesExtracted:
          type: integer
          description: The total number of unique frames extracted from the video.
          format: int32
      additionalProperties: false
      description: Represents the output from the VideoFrameExtraction workflow step.
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes