openapi: '3.1.1'
info:
  title: Civitai Orchestration - polyGen Recipe
  description: OpenAPI specification for the polyGen built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/polyGen:
    post:
      tags:
        - Recipes
      summary: 3D model generation
      description: Generate 3D models through text or image inputs using any of our supported engines.
      operationId: InvokePolyGenStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolyGenInput'
          text/json:
            schema:
              $ref: '#/components/schemas/PolyGenInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PolyGenInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolyGenOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AudioBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            duration:
              type:
                - 'null'
                - number
              description: Duration of the audio in seconds
              format: float
            type:
              enum:
                - audio
              type: string
          additionalProperties: false
    BasicAnimationsBlobs:
      type: object
      properties:
        walkingModel:
          $ref: '#/components/schemas/Model3DBlob'
        walkingFbxModel:
          $ref: '#/components/schemas/Model3DBlob'
        walkingArmatureModel:
          $ref: '#/components/schemas/Model3DBlob'
        runningModel:
          $ref: '#/components/schemas/Model3DBlob'
        runningFbxModel:
          $ref: '#/components/schemas/Model3DBlob'
        runningArmatureModel:
          $ref: '#/components/schemas/Model3DBlob'
      additionalProperties: false
    Blob:
      required:
        - available
        - id
        - type
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          description: Gets the id of the blob that contains this image.
        available:
          type: boolean
          description: Gets a value indicating whether the blob is available.
        url:
          type:
            - 'null'
            - string
          description: Gets a url that can be used to preview the blob.
          format: uri
        urlExpiresAt:
          type:
            - 'null'
            - string
          description: Get when the url is set to expire
          format: date-time
        jobId:
          type:
            - 'null'
            - string
          description: Get the id of the job that is associated with this blob.
        nsfwLevel:
          $ref: '#/components/schemas/NSFWLevel'
        blockedReason:
          type:
            - 'null'
            - string
          description: Get an optional reason for why the blob was blocked. This is only set if the blob was blocked.
        tier:
          type:
            - 'null'
            - string
          description: "Get the storage tier holding this blob, when it is not the default one. Null means the default\ntier, which is what every blob produced before the managed tier existed deserializes as.\nCarried so a downstream step or consumer resolves the right grain directly rather than\nprobing each tier for the key."
      additionalProperties: false
      description: Represents a blob that gets produced as part of a specific job
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageBlob'
          video: '#/components/schemas/VideoBlob'
          audio: '#/components/schemas/AudioBlob'
          model3d: '#/components/schemas/Model3DBlob'
    ComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/PolyGenInput'
        - required:
            - engine
            - model
          type: object
          properties:
            model:
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
          discriminator:
            propertyName: model
            mapping:
              hunyuan3D: '#/components/schemas/Hunyuan3DComfyPolyGenInput'
              trellis2: '#/components/schemas/Trellis2ComfyPolyGenInput'
    FalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/PolyGenInput'
        - required:
            - engine
            - model
          type: object
          properties:
            model:
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
          discriminator:
            propertyName: model
            mapping:
              meshy: '#/components/schemas/MeshyFalPolyGenInput'
              tripo: '#/components/schemas/TripoFalPolyGenInput'
    Hunyuan3DComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/ComfyPolyGenInput'
        - required:
            - engine
            - model
            - operation
          type: object
          properties:
            operation:
              type:
                - 'null'
                - string
              default: imageTo3D
            modelVersion:
              enum:
                - v2
                - v2.1
                - v2-mini
              type: string
              default: v2
            modelAir:
              pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
              type:
                - 'null'
                - string
            steps:
              maximum: 150
              minimum: 1
              type:
                - 'null'
                - integer
              format: int32
            cfgScale:
              maximum: 30
              minimum: 0
              type:
                - 'null'
                - number
              format: double
            sampler:
              enum:
                - euler
                - euler_ancestral
                - heun
                - heunpp2
                - dpm_2
                - dpm_2_ancestral
                - lms
                - dpm_fast
                - dpm_adaptive
                - dpmpp_2s_ancestral
                - dpmpp_sde
                - dpmpp_2m
                - dpmpp_2m_sde
                - dpmpp_3m_sde
                - ddpm
                - lcm
                - uni_pc
                - uni_pc_bh2
              type: string
              default: euler
            scheduler:
              enum:
                - normal
                - karras
                - exponential
                - sgm_uniform
                - simple
                - ddim_uniform
                - beta
              type: string
              default: normal
            resolution:
              maximum: 8192
              minimum: 1
              type:
                - 'null'
                - integer
              format: int32
            vaeNumChunks:
              maximum: 500000
              minimum: 1000
              type: integer
              format: int32
              default: 8000
            octreeResolution:
              maximum: 512
              minimum: 16
              type: integer
              format: int32
              default: 256
            meshThreshold:
              maximum: 1
              minimum: 0
              type: number
              format: double
              default: 0.6
            seed:
              type:
                - 'null'
                - integer
              format: int64
            shift:
              type: number
              format: double
              default: 1
            model:
              enum:
                - hunyuan3D
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
          discriminator:
            propertyName: operation
            mapping:
              imageTo3D: '#/components/schemas/Hunyuan3DImageTo3DComfyPolyGenInput'
              shapeGen: '#/components/schemas/Hunyuan3DShapeGenComfyPolyGenInput'
              texGen: '#/components/schemas/Hunyuan3DTexGenComfyPolyGenInput'
    Hunyuan3DImageTo3DComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/Hunyuan3DComfyPolyGenInput'
        - required:
            - engine
            - imageUrl
            - model
            - operation
          type: object
          properties:
            imageUrl:
              type: string
              format: uri
            prompt:
              maxLength: 600
              type:
                - 'null'
                - string
            shouldTexture:
              type: boolean
              default: true
            shouldRemesh:
              type: boolean
              default: false
            enablePbr:
              type: boolean
              default: true
            operation:
              enum:
                - imageTo3D
              type: string
            model:
              enum:
                - hunyuan3D
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
    Hunyuan3DShapeGenComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/Hunyuan3DComfyPolyGenInput'
        - required:
            - engine
            - imageUrl
            - model
            - operation
          type: object
          properties:
            imageUrl:
              type: string
              format: uri
            prompt:
              maxLength: 600
              type:
                - 'null'
                - string
            operation:
              enum:
                - shapeGen
              type: string
            model:
              enum:
                - hunyuan3D
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
    Hunyuan3DTexGenComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/Hunyuan3DComfyPolyGenInput'
        - required:
            - engine
            - imageUrl
            - mesh
            - model
            - operation
          type: object
          properties:
            imageUrl:
              type: string
              format: uri
            mesh:
              pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
              type: string
            shouldRemesh:
              type: boolean
              default: false
            enablePbr:
              type: boolean
              default: true
            operation:
              enum:
                - texGen
              type: string
            model:
              enum:
                - hunyuan3D
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
    ImageBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            previewUrl:
              type:
                - 'null'
                - string
              description: Gets a url that can be used to preview a resized version of the image.
              format: uri
            previewUrlExpiresAt:
              type:
                - 'null'
                - string
              description: Gets when the preview url is set to expire.
              format: date-time
            type:
              enum:
                - image
              type: string
          additionalProperties: false
    MeshyFalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/FalPolyGenInput'
        - required:
            - engine
            - model
            - version
          type: object
          properties:
            version:
              type:
                - 'null'
                - string
              default: v6
            targetPolycount:
              maximum: 300000
              minimum: 100
              type: integer
              format: int32
              default: 30000
            topology:
              enum:
                - quad
                - triangle
              type: string
              default: triangle
            symmetryMode:
              enum:
                - off
                - auto
                - on
              type: string
              default: auto
            shouldRemesh:
              type: boolean
              default: true
            enablePbr:
              type: boolean
              default: false
            texturePrompt:
              maxLength: 600
              type:
                - 'null'
                - string
            enableRigging:
              type: boolean
              default: false
            enableAnimation:
              type: boolean
              default: false
            model:
              enum:
                - meshy
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
          discriminator:
            propertyName: version
            mapping:
              v6: '#/components/schemas/MeshyV6FalPolyGenInput'
              v7: '#/components/schemas/MeshyV7FalPolyGenInput'
      description: "Model-level base for Meshy 3D generation (via FAL).\nThe version derived type carries the operation-level discriminator.\nPayloads without a version deserialize as v6."
    MeshyImageTo3DFalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/MeshyV6FalPolyGenInput'
        - required:
            - engine
            - imageUrl
            - model
            - operation
            - version
          type: object
          properties:
            imageUrl:
              minLength: 1
              type: string
            shouldTexture:
              type: boolean
              default: true
            operation:
              enum:
                - imageTo3D
              type: string
            version:
              enum:
                - v6
              type: string
            model:
              enum:
                - meshy
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
    MeshyTextTo3DFalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/MeshyV6FalPolyGenInput'
        - required:
            - engine
            - model
            - operation
            - prompt
            - version
          type: object
          properties:
            prompt:
              maxLength: 600
              minLength: 1
              type: string
            mode:
              enum:
                - preview
                - full
              type: string
              default: full
            enablePromptExpansion:
              type: boolean
              default: false
            operation:
              enum:
                - textTo3D
              type: string
            version:
              enum:
                - v6
              type: string
            model:
              enum:
                - meshy
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
    MeshyV6FalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/MeshyFalPolyGenInput'
        - required:
            - engine
            - model
            - operation
            - version
          type: object
          properties:
            operation:
              type: string
            seed:
              type:
                - 'null'
                - integer
              format: int32
            version:
              enum:
                - v6
              type: string
            model:
              enum:
                - meshy
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
          discriminator:
            propertyName: operation
            mapping:
              textTo3D: '#/components/schemas/MeshyTextTo3DFalPolyGenInput'
              imageTo3D: '#/components/schemas/MeshyImageTo3DFalPolyGenInput'
      description: "Version-level base for Meshy v6.\nDiscriminator: operation (textTo3D, imageTo3D)\nFAL Endpoints: fal-ai/meshy/v6/{text-to-3d,image-to-3d}"
    MeshyV7FalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/MeshyFalPolyGenInput'
        - required:
            - engine
            - model
            - operation
            - version
          type: object
          properties:
            operation:
              type: string
            shouldTexture:
              type: boolean
              default: true
            poseMode:
              enum:
                - none
                - a-pose
                - t-pose
              type: string
              description: Pose to generate the character in. "none" lets Meshy pick.
              default: none
            textureImageUrl:
              type:
                - 'null'
                - string
              description: 2D image guiding the texturing process.
            riggingHeightMeters:
              maximum: 100
              minimum: 0.01
              type: number
              description: Approximate character height in meters. Only used when enableRigging is set.
              format: double
              default: 1.7
            animationActionId:
              maximum: 696
              minimum: 0
              type: integer
              description: "Animation preset from Meshy's library (0 is \"Idle\"); see https://docs.meshy.ai/en/api/animation-library.\nOnly used when Civitai.Orchestration.Grains.Workflows.Steps.PolyGen.Fal.MeshyFalPolyGenInput.EnableAnimation is set."
              format: int32
              default: 92
            version:
              enum:
                - v7
              type: string
            model:
              enum:
                - meshy
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
          discriminator:
            propertyName: operation
            mapping:
              imageTo3D: '#/components/schemas/MeshyV7ImageTo3DFalPolyGenInput'
              multiImageTo3D: '#/components/schemas/MeshyV7MultiImageTo3DFalPolyGenInput'
      description: "Version-level base for Meshy v7.\nDiscriminator: operation (imageTo3D, multiImageTo3D)\nFAL Endpoints: meshy/v7/{image-to-3d,multi-image-to-3d}"
    MeshyV7ImageTo3DFalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/MeshyV7FalPolyGenInput'
        - required:
            - engine
            - imageUrl
            - model
            - operation
            - version
          type: object
          properties:
            imageUrl:
              minLength: 1
              type: string
            ultraMode:
              type: boolean
              description: Higher-fidelity geometry with finer surface detail.
              default: false
            modelType:
              enum:
                - standard
                - lowpoly
              type: string
              description: '"lowpoly" makes Meshy ignore the remesh controls (topology, targetPolycount, shouldRemesh).'
              default: standard
            operation:
              enum:
                - imageTo3D
              type: string
            version:
              enum:
                - v7
              type: string
            model:
              enum:
                - meshy
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
    MeshyV7MultiImageTo3DFalPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/MeshyV7FalPolyGenInput'
        - required:
            - engine
            - imageUrls
            - model
            - operation
            - version
          type: object
          properties:
            imageUrls:
              maxItems: 4
              minItems: 1
              type: array
              items:
                type: string
              description: 1–4 views of the same object. Meshy has no ultra or lowpoly mode on this operation.
            operation:
              enum:
                - multiImageTo3D
              type: string
            version:
              enum:
                - v7
              type: string
            model:
              enum:
                - meshy
              type: string
            engine:
              enum:
                - fal
              type: string
          additionalProperties: false
    Model3DBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - format
            - type
          type: object
          properties:
            format:
              type: string
              description: 'File format of the 3D model (e.g. "glb", "fbx", "obj", "usdz").'
            type:
              enum:
                - model3d
              type: string
          additionalProperties: false
    NSFWLevel:
      enum:
        - pg
        - pg13
        - r
        - x
        - xxx
        - na
      type: string
    PolyGenInput:
      required:
        - engine
      type: object
      properties:
        engine:
          type: string
      additionalProperties: false
      discriminator:
        propertyName: engine
        mapping:
          comfy: '#/components/schemas/ComfyPolyGenInput'
          fal: '#/components/schemas/FalPolyGenInput'
    PolyGenOutput:
      required:
        - model
      type: object
      properties:
        model:
          $ref: '#/components/schemas/Model3DBlob'
        fbxModel:
          $ref: '#/components/schemas/Model3DBlob'
        thumbnail:
          $ref: '#/components/schemas/ImageBlob'
        riggedModel:
          $ref: '#/components/schemas/Model3DBlob'
        riggedFbxModel:
          $ref: '#/components/schemas/Model3DBlob'
        animatedModel:
          $ref: '#/components/schemas/Model3DBlob'
        animatedFbxModel:
          $ref: '#/components/schemas/Model3DBlob'
        basicAnimations:
          $ref: '#/components/schemas/BasicAnimationsBlobs'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
    Trellis2ComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/ComfyPolyGenInput'
        - required:
            - engine
            - model
            - operation
          type: object
          properties:
            operation:
              type:
                - 'null'
                - string
              default: imageTo3D
            modelVersion:
              enum:
                - pixal3D
                - trellis2
              type: string
              default: pixal3D
            modelAir:
              pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
              type:
                - 'null'
                - string
            structureSteps:
              maximum: 100
              minimum: 1
              type: integer
              format: int32
              default: 12
            shapeSteps:
              maximum: 100
              minimum: 1
              type: integer
              format: int32
              default: 20
            upsampleSteps:
              maximum: 100
              minimum: 1
              type: integer
              format: int32
              default: 12
            textureSteps:
              maximum: 100
              minimum: 1
              type: integer
              format: int32
              default: 12
            structureCfg:
              maximum: 30
              minimum: 0
              type: number
              format: double
              default: 7.5
            shapeCfg:
              maximum: 30
              minimum: 0
              type: number
              format: double
              default: 7.5
            textureCfg:
              maximum: 30
              minimum: 0
              type: number
              format: double
              default: 1
            targetResolution:
              maximum: 2048
              minimum: 1024
              enum:
                - 1024
                - 1152
                - 1280
                - 1408
                - 1536
                - 1664
                - 1792
                - 1920
                - 2048
              type: integer
              format: int32
              default: 1536
            shouldRemesh:
              type: boolean
              default: true
            remeshResolution:
              maximum: 2048
              minimum: 32
              type: integer
              format: int32
              default: 768
            targetFaceCount:
              maximum: 50000000
              minimum: 1000
              type: integer
              format: int32
              default: 700000
            textureResolution:
              maximum: 8192
              minimum: 64
              type: integer
              format: int32
              default: 2048
            seed:
              type:
                - 'null'
                - integer
              format: int64
            model:
              enum:
                - trellis2
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
          discriminator:
            propertyName: operation
            mapping:
              imageTo3D: '#/components/schemas/Trellis2ImageTo3DComfyPolyGenInput'
              shapeGen: '#/components/schemas/Trellis2ShapeGenComfyPolyGenInput'
              texGen: '#/components/schemas/Trellis2TexGenComfyPolyGenInput'
    Trellis2ImageTo3DComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/Trellis2ComfyPolyGenInput'
        - required:
            - engine
            - imageUrl
            - model
            - operation
          type: object
          properties:
            imageUrl:
              type: string
              format: uri
            shouldTexture:
              type: boolean
              default: true
            enablePbr:
              type: boolean
              default: true
            operation:
              enum:
                - imageTo3D
              type: string
            model:
              enum:
                - trellis2
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
    Trellis2ShapeGenComfyPolyGenInput:
      allOf:
        - $ref: '#/components/schemas/Trellis2ComfyPolyGenInput'
        - required:
            - engine
            - imageUrl
            - model
            - operation
          type: object
          properties:
            imageUrl:
              type: string
              format: uri
            operation:
              enum:
                - shapeGen
              type: string
            model:
              enum:
                - trellis2
              type: string
            engine:
              enum:
                - comfy
              type: string
          additionalProperties: false
    Trellis2TexGenComfyPolyGenInput:
