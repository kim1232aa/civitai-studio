openapi: '3.1.1'
info:
  title: Civitai Orchestration - model3DPreview Recipe
  description: OpenAPI specification for the model3DPreview built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/model3DPreview:
    post:
      tags:
        - Recipes
      summary: 3D model preview
      description: Renders screenshots of a 3D model from predefined or supplied camera poses.
      operationId: InvokeModel3DPreviewStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Model3DPreviewInput'
          text/json:
            schema:
              $ref: '#/components/schemas/Model3DPreviewInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Model3DPreviewInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model3DPreviewOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    AudioBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            duration:
              type:
                - 'null'
                - number
              description: Duration of the audio in seconds
              format: float
            type:
              enum:
                - audio
              type: string
          additionalProperties: false
    Blob:
      required:
        - available
        - id
        - type
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          description: Gets the id of the blob that contains this image.
        available:
          type: boolean
          description: Gets a value indicating whether the blob is available.
        url:
          type:
            - 'null'
            - string
          description: Gets a url that can be used to preview the blob.
          format: uri
        urlExpiresAt:
          type:
            - 'null'
            - string
          description: Get when the url is set to expire
          format: date-time
        jobId:
          type:
            - 'null'
            - string
          description: Get the id of the job that is associated with this blob.
        nsfwLevel:
          $ref: '#/components/schemas/NSFWLevel'
        blockedReason:
          type:
            - 'null'
            - string
          description: Get an optional reason for why the blob was blocked. This is only set if the blob was blocked.
        tier:
          type:
            - 'null'
            - string
          description: "Get the storage tier holding this blob, when it is not the default one. Null means the default\ntier, which is what every blob produced before the managed tier existed deserializes as.\nCarried so a downstream step or consumer resolves the right grain directly rather than\nprobing each tier for the key."
      additionalProperties: false
      description: Represents a blob that gets produced as part of a specific job
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/ImageBlob'
          video: '#/components/schemas/VideoBlob'
          audio: '#/components/schemas/AudioBlob'
          model3d: '#/components/schemas/Model3DBlob'
    ImageBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            previewUrl:
              type:
                - 'null'
                - string
              description: Gets a url that can be used to preview a resized version of the image.
              format: uri
            previewUrlExpiresAt:
              type:
                - 'null'
                - string
              description: Gets when the preview url is set to expire.
              format: date-time
            type:
              enum:
                - image
              type: string
          additionalProperties: false
    ImageGenOutputFormat:
      enum:
        - jpeg
        - png
        - webP
      type: string
    Model3DBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - format
            - type
          type: object
          properties:
            format:
              type: string
              description: 'File format of the 3D model (e.g. "glb", "fbx", "obj", "usdz").'
            type:
              enum:
                - model3d
              type: string
          additionalProperties: false
    Model3DPreviewCameraPose:
      type: object
      properties:
        name:
          type:
            - 'null'
            - string
        yaw:
          type: number
          format: double
          default: 0
        pitch:
          type: number
          format: double
          default: 0
        distance:
          type: number
          format: double
          default: 2.8
        fov:
          type: number
          format: double
          default: 45
      additionalProperties: false
    Model3DPreviewInput:
      required:
        - cameraPoses
        - model
      type: object
      properties:
        model:
          pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
          type: string
        width:
          maximum: 4096
          minimum: 256
          type: integer
          format: int32
          default: 1024
        height:
          maximum: 4096
          minimum: 256
          type: integer
          format: int32
          default: 1024
        outputFormat:
          $ref: '#/components/schemas/ImageGenOutputFormat'
        cameraPoses:
          type: array
          items:
            $ref: '#/components/schemas/Model3DPreviewCameraPose'
        format:
          type:
            - 'null'
            - string
        background:
          pattern: '^#[0-9a-fA-F]{6}$'
          type: string
          default: '#D9D9D9'
      additionalProperties: false
    Model3DPreviewOutput:
      required:
        - images
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageBlob'
      additionalProperties: false
    NSFWLevel:
      enum:
        - pg
        - pg13
        - r
        - x
        - xxx
        - na
      type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
    VideoBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            type:
              enum:
                - video
              type: string
          additionalProperties: false
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes