    TrainingOutput:
      required:
        - epochs
        - moderationStatus
      type: object
      properties:
        moderationStatus:
          $ref: '#/components/schemas/TrainingModerationStatus'
        epochs:
          type: array
          items:
            $ref: '#/components/schemas/TrainingOutputEpochResult'
          description: The trained model artifacts for each epoch
      additionalProperties: false
      description: Output from a training step.
    TrainingOutputEpochResult:
      required:
        - epochNumber
        - model
        - samples
      type: object
      properties:
        epochNumber:
          type: integer
          description: The epoch number (1-based)
          format: int32
        model:
          $ref: '#/components/schemas/Blob'
        samples:
          type: array
          items:
            $ref: '#/components/schemas/Blob'
          description: Sample outputs (images/videos/audio) generated with this epoch's model
      additionalProperties: false
      description: Represents the output of a single training epoch
    VideoBlob:
      allOf:
        - $ref: '#/components/schemas/Blob'
        - required:
            - type
          type: object
          properties:
            width:
              type:
                - 'null'
                - integer
              format: int32
            height:
              type:
                - 'null'
                - integer
              format: int32
            type:
              enum:
                - video
              type: string
          additionalProperties: false
    ZImageBaseAIToolkitTrainingInput:
      allOf:
        - $ref: '#/components/schemas/AIToolkitTrainingInput'
        - required:
            - ecosystem
            - engine
            - maxBatchSize
          type: object
          properties:
            maxBatchSize:
              type: integer
              format: int32
              readOnly: true
            ecosystem:
              enum:
                - zimagebase
              type: string
            engine:
              enum:
                - ai-toolkit
              type: string
            batchSize:
              maximum: 2
              minimum: 1
              type:
                - 'null'
                - integer
              description: Training batch size. Defaults to 1; raise it up to 2 for this ecosystem to train faster at the cost of more GPU memory.
              default: 1
          additionalProperties: false
      description: AI Toolkit training for Z Image Turbo models
    ZImageTurboAIToolkitTrainingInput:
      allOf:
        - $ref: '#/components/schemas/AIToolkitTrainingInput'
        - required:
            - ecosystem
            - engine
            - maxBatchSize
          type: object
          properties:
            maxBatchSize:
              type: integer
              format: int32
              readOnly: true
            ecosystem:
              enum:
                - zimageturbo
              type: string
            engine:
              enum:
                - ai-toolkit
              type: string
            batchSize:
              maximum: 2
              minimum: 1
              type:
                - 'null'
                - integer
              description: Training batch size. Defaults to 1; raise it up to 2 for this ecosystem to train faster at the cost of more GPU memory.
              default: 1
          additionalProperties: false
      description: AI Toolkit training for Z Image Turbo models
    ZipTrainingData:
      allOf:
        - $ref: '#/components/schemas/TrainingData'
        - required:
            - count
            - sourceUrl
            - type
          type: object
          properties:
            sourceUrl:
              pattern: '^(?:urn:)?(?:air:)?(?:(?<ecosystem>[a-zA-Z0-9_\-\/]+):)?(?:(?<type>[a-zA-Z0-9_\-\/]+):)?(?<source>[a-zA-Z0-9_\-\/]+):(?<id>[a-zA-Z0-9_\-\/\.]+)(?:@(?<version>[a-zA-Z0-9_\-\/.=,%+:]+))?(?:\.(?<format>[a-zA-Z0-9_\-]+))?$'
              type: string
              description: AIR pointing to the zip file containing training data
            count:
              type: integer
              description: The number of images/frames/items in this training data
              format: int32
            type:
              enum:
                - zip
              type: string
          additionalProperties: false
      description: Training data packaged as a zip file
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes