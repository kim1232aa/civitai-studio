openapi: '3.1.1'
info:
  title: Civitai Orchestration - mediaHash Recipe
  description: OpenAPI specification for the mediaHash built-in recipe endpoint.
  version: v2
paths:
  /v2/consumer/recipes/mediaHash:
    post:
      tags:
        - Recipes
      summary: MediaHash
      description: Generates perceptual hashes for media content to enable similarity detection and duplicate identification.
      operationId: InvokeMediaHashStepTemplate
      parameters:
        - name: experimental
          in: query
          schema:
            type: boolean
        - name: allowMatureContent
          in: query
          schema:
            type: boolean
        - name: whatif
          in: query
          schema:
            type: boolean
        - name: ephemeral
          in: query
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaHashInput'
          text/json:
            schema:
              $ref: '#/components/schemas/MediaHashInput'
          application/*+json:
            schema:
              $ref: '#/components/schemas/MediaHashInput'
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaHashOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    MediaHashInput:
      required:
        - hashTypes
        - mediaUrl
      type: object
      properties:
        mediaUrl:
          type: string
          description: The URL of the media to hash (image or video).
          format: uri
        hashTypes:
          type: array
          items:
            $ref: '#/components/schemas/MediaHashType'
          description: The types of hashes to generate.
      additionalProperties: false
      description: Represents the input information needed for the MediaHash workflow step.
    MediaHashOutput:
      required:
        - hashes
      type: object
      properties:
        hashes:
          type: object
          additionalProperties:
            type: string
          description: 'The generated hashes, keyed by hash type (e.g., "perceptual" -> "12345678").'
      additionalProperties: false
      description: Represents the output information returned from the MediaHash workflow step.
    MediaHashType:
      enum:
        - perceptual
        - perceptualDct
        - perceptualDct256
      type: string
      description: Represents the type of hash algorithm to use for media content.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
            - 'null'
            - string
        title:
          type:
            - 'null'
            - string
        status:
          type:
            - 'null'
            - integer
          format: int32
        detail:
          type:
            - 'null'
            - string
        instance:
          type:
            - 'null'
            - string
      additionalProperties: { }
  securitySchemes:
    ApiKey:
      type: http
      description: Copy valid authorization token into field
      scheme: bearer
      bearerFormat: JWT
security:
  - { }
tags:
  - name: Recipes