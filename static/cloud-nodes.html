<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Cloud Nodes POC · Night Lab · v0783-preview-lightbox</title>
<style>
  :root {
    --bg:#0e1016; --panel:#161922; --line:#2a2f3a; --text:#e8eaef; --muted:#8b93a7;
    --coral:#e85d4c; --ok:#3dd68c; --bad:#ff5c5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 "PingFang SC","Noto Sans SC",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  header a{color:var(--muted);text-decoration:none}
  header strong{font-size:14px}
  .wrap{flex:1;display:flex;min-height:0}
  .rail{width:280px;background:var(--panel);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .rail h2{margin:0;font-size:14px}
  .chip{display:flex;gap:8px;flex-wrap:wrap}
  .chip span{background:#1e2430;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--muted)}
  .chip span.on{border-color:var(--coral);color:#fff}
  .canvas{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 1px 1px, #1a1f2b 1px, transparent 0) 0 0/20px 20px}
  .node{position:absolute;width:232px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;user-select:none;overflow:visible}
  .node.sel{border-color:var(--coral);box-shadow:0 0 0 1px var(--coral),0 12px 36px rgba(232,93,76,.18)}
  .node .bar{height:3px;border-radius:12px 12px 0 0;background:var(--op)}
  .node{--op:var(--coral)}
  .node.op-prompt{--op:#e85d4c}
  .node.op-seed{--op:#f0c36a}
  .node.op-image,.node.img{--op:#3dd68c}
  .node.op-t2i{--op:#e85d4c}
  .node.op-i2i{--op:#3db9e8}
  .node.op-i2v{--op:#c45be8}
  .node.op-lora,.node.lora{--op:#7c6cff}
  .node.op-up,.node.up{--op:#3db9e8}
  .node .hd{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
  .node .type{display:inline-flex;align-items:center;gap:6px;min-width:0;flex:1}
  .node .ico{flex:0 0 auto;width:22px;height:22px;border-radius:7px;background:color-mix(in srgb, var(--op) 22%, #1e2430);color:var(--op);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
  .node .ttl{font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node .more{color:var(--muted);font-size:14px;padding:0 2px;opacity:.7}
  .node .bd{padding:0 12px 12px;display:flex;flex-direction:column;gap:5px}
  .node .sum{display:flex;align-items:baseline;gap:8px;font-size:11px;line-height:1.35;min-width:0}
  .node .sum .k{flex:0 0 auto;color:#6b7388;min-width:2.2em}
  .node .sum .v{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .sum .v.em{color:var(--text)}
  .node .pill{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:10px;font-weight:600;padding:2px 8px;border-radius:999px;background:#1e2430;border:1px solid var(--line);color:var(--muted)}
  .node .pill.ok{color:var(--ok);border-color:color-mix(in srgb, var(--ok) 40%, var(--line))}
  .node .pill.bad{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 45%, var(--line));background:color-mix(in srgb, var(--bad) 12%, #1e2430)}
  .node .pill.warn{color:#f0c36a;border-color:color-mix(in srgb, #f0c36a 40%, var(--line))}
  .node .prev{margin-top:2px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0c0e14;aspect-ratio:16/10;position:relative}
  .node .prev.has-media{cursor:zoom-in}
  .node .prev.has-media.vid{cursor:pointer}
  .node .prev img,.node .prev video{display:block;width:100%;height:100%;object-fit:cover;background:#0c0e14;pointer-events:none}
  .node .prev .ph{position:absolute;inset:0;display:grid;place-items:center;color:#5a6278;font-size:10px;font-weight:600;letter-spacing:.02em;background:repeating-linear-gradient(-45deg,#12151d,#12151d 6px,#0e1016 6px,#0e1016 12px)}
  .node .prev .badge{position:absolute;left:6px;bottom:6px;font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px;background:rgba(14,16,22,.82);border:1px solid var(--line);color:var(--muted);backdrop-filter:blur(4px);pointer-events:none}
  .node .prev .badge.vid{color:#c45be8;border-color:color-mix(in srgb,#c45be8 40%,var(--line))}
  .node .prev .badge.img{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
  .node .prev .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .node .prev .play span{width:36px;height:36px;border-radius:50%;background:rgba(14,16,22,.72);border:1px solid color-mix(in srgb,#c45be8 50%,var(--line));color:#fff;display:grid;place-items:center;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .lb{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(6,8,12,.82);backdrop-filter:blur(6px)}
  .lb.open{display:flex}
  .lb .lb-card{position:relative;max-width:min(960px,94vw);max-height:min(88vh,900px);background:#12151d;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
  .lb .lb-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}
  .lb .lb-hd strong{color:var(--text);font-size:13px}
  .lb .lb-x{margin-left:auto;border:0;background:#1e2430;color:var(--text);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;line-height:1}
  .lb .lb-body{padding:12px;display:flex;align-items:center;justify-content:center;min-height:200px;background:#0c0e14}
  .lb .lb-body img{max-width:min(920px,90vw);max-height:min(72vh,780px);object-fit:contain;border-radius:8px}
  .lb .lb-body video{max-width:min(920px,90vw);max-height:min(72vh,780px);border-radius:8px;background:#000;outline:none}
  .lb .lb-note{padding:0 14px 12px;color:var(--muted);font-size:11px}
  .port{position:absolute;width:10px;height:10px;border-radius:50%;background:#4a5163;border:2px solid var(--panel);top:42px}
  .port.in{left:-6px}.port.out{right:-6px}
  .port.live{background:var(--coral)}
  .port.bad{background:var(--bad)}
  svg.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto}
  .dock{padding:10px 16px;background:rgba(14,16,22,.96);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:999px;padding:8px 16px;background:var(--coral);color:#fff;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#1e2430;color:var(--text);border:1px solid var(--line)}
  .warn{color:var(--bad);font-size:12px}
  .ok{color:var(--ok);font-size:12px}
  .muted{color:var(--muted);font-size:12px}
  .info{color:#f0c36a;font-size:12px}
  pre{background:#12151d;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:10px;max-height:180px;overflow:auto;margin:0}
  .demo-badge{margin-left:auto;font:600 12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;color:#0e1016;background:#f0c36a;border:1px solid #d4a84a;border-radius:8px;padding:6px 12px;letter-spacing:.02em;max-width:min(520px,55vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .demo-badge.chain{background:#f0c36a;color:#0e1016}
  .demo-badge.single{background:#3dd68c;color:#0e1016}
</style>
</head>
<body>
  <header>
    <strong>Cloud Nodes POC</strong>
    <span class="muted">分支 feat/cloud-nodes-poc · 真边可链 · 多步见 ?demo=chain · <b id="stampVer">v0783-preview-lightbox</b></span>
    <span class="demo-badge" id="demoBadge" title="active demo (from URL + boot)">demo=… · nodes: …</span>
    <a href="/">← 回主台</a>
  </header>
  <div class="wrap">
    <aside class="rail">
      <h2>配方检视</h2>
      <div class="chip" id="chips"></div>
      <p class="muted" id="railHint">点节点查看；校验走 compile，未连口禁止偷残留。</p>
      <label class="muted">backend
        <select id="backend" style="width:100%;margin-top:4px;background:#1e2430;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px">
          <option value="nano-gpt">nano-gpt</option>
          <option value="fal">fal</option>
          <option value="civitai">civitai</option>
          <option value="modelscope-ai">modelscope-ai</option>
          <option value="huggingface">huggingface (i2v=none)</option>
        </select>
      </label>
      <label class="muted">serviceId
        <input id="serviceId" value="vidu-q2-pro" style="width:100%;margin-top:4px;background:#1e2430;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px"/>
      </label>
      <h2 style="margin-top:12px">连线</h2>
      <div id="edgeList" class="muted" style="display:flex;flex-direction:column;gap:6px"></div>
      <p class="muted" style="margin:0">点「断开」拆边；或点画布上的线断开。</p>
      <pre id="outBox">compile 结果会显示在这里</pre>
    </aside>
    <main class="canvas" id="canvas">
      <svg class="wires" id="wires"></svg>
    </main>
  </div>
  <div class="dock">
    <button class="btn ghost" type="button" id="btnDemoSingle" title="单步 image→i2v · ?demo=i2v">单步 demo</button>
    <button class="btn ghost" type="button" id="btnDemoChain" title="多步 t2i→i2v · ?demo=chain">链式 demo</button>
    <button class="btn ghost" type="button" id="btnValidate">校验图</button>
    <button class="btn ghost" type="button" id="btnBreakImage" title="拆掉 image→i2v 边">断 image 边</button>
    <button class="btn ghost" type="button" id="btnBreakPrompt" title="拆掉 prompt→i2v 边">断 prompt 边</button>
    <button class="btn" type="button" id="btnGen">生成</button>
    <span class="muted" id="dockMsg">主路径 image→i2v；多步链请开 链式 demo 或 /cloud-nodes.html?demo=chain</span>
  </div>
<div class="lb" id="mediaLightbox" hidden aria-modal="true" role="dialog">
  <div class="lb-card" role="document">
    <div class="lb-hd"><strong id="lbTitle">预览</strong><span id="lbKind"></span><button type="button" class="lb-x" id="lbClose" title="关闭">×</button></div>
    <div class="lb-body" id="lbBody"></div>
    <div class="lb-note" id="lbNote"></div>
  </div>
</div>
<script>
/** Demos mirror scripts/demo_graph_chain.py (real image edges → multiStep/staged). */
const DEMO_I2V = {
  id: 'i2v',
  label: '单步 image→i2v',
  backend: 'nano-gpt',
  serviceId: 'vidu-q2-pro',
  selected: 'v',
  hint: '单步 demo · /cloud-nodes.html?demo=i2v · 校验应绿 · 生成可点',
  nodes: [
    { id:'img', op:'image', title:'首帧图', cls:'img', x:40, y:120, bd:'image 源 · 必连 i2v', params:{ url:'/out/fal_fal-ai_flux_schnell_01a05e2c-f6ec-7e02-a359-e31953848a8d_0.jpg' } },
    { id:'p', op:'prompt', title:'提示词', cls:'', x:40, y:280, bd:'可选连入 i2v', params:{ text:'camera slowly pans left, cinematic' } },
    { id:'s', op:'seed', title:'种子', cls:'seed', x:40, y:420, bd:'只认连线', params:{ value: 4924112 } },
    { id:'v', op:'i2v', title:'图生视频', cls:'', x:390, y:180, bd:'', params:{ serviceId:'vidu-q2-pro', duration:5, resolution:'1280x720', previewUrl:'/out/fal_fal-ai_flux_schnell_01a05e2c-f6ec-7e02-a359-e31953848a8d_0.jpg', previewKind:'video' } },
  ],
  edges: [
    { from:'img', fromPort:'image', to:'v', toPort:'image' },
    { from:'p', fromPort:'prompt', to:'v', toPort:'prompt' },
    { from:'s', fromPort:'seed', to:'v', toPort:'seed' },
  ],
};
/** t2i→i2v from demo_graph_chain.py — compile → multiStep + execute=staged */
const DEMO_CHAIN = {
  id: 'chain',
  label: '链式 t2i→i2v',
  backend: 'nano-gpt',
  serviceId: 'vidu-q2-pro',
  selected: 'v',
  hint: '链式 demo · /cloud-nodes.html?demo=chain · 校验琥珀(多步) · 生成保持灰',
  nodes: [
    { id:'p', op:'prompt', title:'提示词', cls:'', x:40, y:200, bd:'→ t2i', params:{ text:'cinematic portrait, soft light' } },
    { id:'g', op:'t2i', title:'文生图', cls:'', x:300, y:180, bd:'image → i2v', params:{ serviceId:'flux', resolution:'1024x1024', previewUrl:'/out/fal_fal-ai_flux_schnell_01a05e2c-f6ec-7e02-a359-e31953848a8d_0.jpg', previewKind:'image' } },
    { id:'v', op:'i2v', title:'图生视频', cls:'', x:560, y:180, bd:'', params:{ serviceId:'vidu-q2-pro', duration:5, resolution:'1280x720', previewUrl:'/out/modelscope-ai_0dc2e62f-3a9d-4535-bc5f-9ee7cac702cf_0.png', previewKind:'video' } },
  ],
  edges: [
    { from:'p', fromPort:'prompt', to:'g', toPort:'prompt' },
    { from:'g', fromPort:'image', to:'v', toPort:'image' },
  ],
};
/** Longer chain also in demo_graph_chain.py */
const DEMO_CHAIN3 = {
  id: 'chain3',
  label: '链式 t2i→i2i→i2v',
  backend: 'nano-gpt',
  serviceId: 'vidu-q2-pro',
  selected: 'v',
  hint: '链式 demo · /cloud-nodes.html?demo=chain3 · 校验琥珀(多步) · 生成保持灰',
  nodes: [
    { id:'p', op:'prompt', title:'提示词', cls:'', x:20, y:120, bd:'→ t2i', params:{ text:'cinematic portrait, soft light' } },
    { id:'p2', op:'prompt', title:'精修词', cls:'', x:20, y:280, bd:'→ i2i', params:{ text:'refine details, film grain' } },
    { id:'g', op:'t2i', title:'文生图', cls:'', x:240, y:100, bd:'image → i2i', params:{ serviceId:'flux', resolution:'1024x1024', previewUrl:'/out/fal_fal-ai_flux_schnell_01a05e2c-f6ec-7e02-a359-e31953848a8d_0.jpg', previewKind:'image' } },
    { id:'g2', op:'i2i', title:'图生图', cls:'', x:460, y:180, bd:'image → i2v', params:{ serviceId:'flux-i2i', previewUrl:'/out/modelscope-ai_0dc2e62f-3a9d-4535-bc5f-9ee7cac702cf_0.png', previewKind:'image' } },
    { id:'v', op:'i2v', title:'图生视频', cls:'', x:680, y:180, bd:'', params:{ serviceId:'vidu-q2-pro', duration:5, resolution:'1280x720', previewUrl:'/out/fal_fal-ai_flux_schnell_01a05e2c-f6ec-7e02-a359-e31953848a8d_0.jpg', previewKind:'video' } },
  ],
  edges: [
    { from:'p', fromPort:'prompt', to:'g', toPort:'prompt' },
    { from:'p2', fromPort:'prompt', to:'g2', toPort:'prompt' },
    { from:'g', fromPort:'image', to:'g2', toPort:'image' },
    { from:'g2', fromPort:'image', to:'v', toPort:'image' },
  ],
};
const DEMOS = { i2v: DEMO_I2V, single: DEMO_I2V, chain: DEMO_CHAIN, chain3: DEMO_CHAIN3 };
function demoFromQuery(){
  try {
    const q = new URLSearchParams(location.search).get('demo');
    if (q && DEMOS[q]) return q;
  } catch (_) {}
  return 'i2v';
}
let activeDemoId = demoFromQuery();
let nodes = [];
let edges = [];
const EDGE_STORE_KEY = 'cloud-nodes-poc-edges-v2';
const DISCONNECT_MSG = '已断开一条边 · 校验红 · 生成灰';
function cloneEdges(list){
  return (list || []).map(e => ({ from:e.from, fromPort:e.fromPort, to:e.to, toPort:e.toPort }));
}
function cloneNodes(list){
  return (list || []).map(n => Object.assign({}, n, { params: Object.assign({}, n.params || {}) }));
}
function loadEdgesForDemo(demo){
  try {
    const raw = sessionStorage.getItem(EDGE_STORE_KEY);
    if (!raw) return cloneEdges(demo.edges);
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.demo !== demo.id || !Array.isArray(parsed.edges)) return cloneEdges(demo.edges);
    return parsed.edges.filter(e => e && e.from && e.to && e.fromPort && e.toPort).map(e => ({
      from: e.from, fromPort: e.fromPort, to: e.to, toPort: e.toPort
    }));
  } catch (_) {
    return cloneEdges(demo.edges);
  }
}
function saveEdges(){
  try { sessionStorage.setItem(EDGE_STORE_KEY, JSON.stringify({ demo: activeDemoId, edges })); } catch (_) {}
}
let selected = 'v';
let lastCompile = null;
/** Bumped on any graph change that invalidates compile (edge disconnect, backend/serviceId). */
let graphEpoch = 0;
/** Monotonic id of the latest validate/compile request; stale responses must not apply. */
let compileSeq = 0;
/** graphEpoch value that lastCompile was produced for (must match to enable Generate). */
let lastCompileEpoch = -1;

function $(id){ return document.getElementById(id); }

/** Clear compile cache + UI: gen grey, dock red/blocked, outBox wiped. Bumps graphEpoch so in-flight ok:true cannot revive. */
function invalidateCompile(reason){
  graphEpoch += 1;
  lastCompile = null;
  lastCompileEpoch = -1;
  $('btnGen').disabled = true;
  const box = $('outBox');
  if (box) box.textContent = '';
  $('dockMsg').textContent = reason || '图已变更 · 请重新校验';
  $('dockMsg').className = 'warn';
}

function isStagedCompile(j){
  return !!(j && (j.multiStep || j.execute === 'staged'));
}

/** Generate only for single-step ok compiles. Staged/multiStep stay disabled (compile ok ≠ green light). */
function syncGenEnabled(){
  const ready = !!(lastCompile && lastCompile.ok && lastCompileEpoch === graphEpoch && !isStagedCompile(lastCompile));
  $('btnGen').disabled = !ready;
}

function buildGraph(){
  const sid = $('serviceId').value.trim();
  const ns = nodes.map(n => {
    const params = Object.assign({}, n.params);
    if (n.op === 'i2v') {
      // Rail drives the sink i2v serviceId
      params.serviceId = sid || params.serviceId;
    } else if (n.op === 't2i' || n.op === 'i2i') {
      // Multi-step: keep node-local serviceId (do not overwrite t2i with vidu)
      if (!params.serviceId) params.serviceId = sid;
    }
    return { id:n.id, op:n.op, params };
  });
  return { backend: $('backend').value, nodes: ns, edges: edges.map(e => Object.assign({}, e)) };
}

function renderChips(){
  const n = nodes.find(x => x.id === selected);
  const box = $('chips');
  box.innerHTML = '';
  if (!n) return;
  const bits = [];
  if (n.op === 'i2v') {
    bits.push(['model', $('serviceId').value || n.params.serviceId || '—']);
    bits.push(['dur', n.params.duration != null ? String(n.params.duration) : '—']);
    const imgEdge = edges.find(e => e.to === n.id && e.toPort === 'image');
    bits.push(['image', imgEdge ? '已连' : '未连·阻断']);
    const seedEdge = edges.find(e => e.to === n.id && e.toPort === 'seed');
    bits.push(['seed', seedEdge ? String(nodes.find(x=>x.id===seedEdge.from)?.params?.value ?? '…') : '未连']);
    if (lastCompile && lastCompile.ok && lastCompile.wiring && lastCompile.wiring.out) {
      bits.push(['map', Object.keys(lastCompile.wiring.out).join(',') || '—']);
    }
  } else if (n.op === 't2i' || n.op === 'i2i') {
    bits.push(['model', n.params.serviceId || '—']);
    bits.push(['res', n.params.resolution || '—']);
    const imgEdge = edges.find(e => e.to === n.id && e.toPort === 'image');
    if (n.op === 'i2i') bits.push(['image', imgEdge ? '已连' : '未连·阻断']);
  } else {
    bits.push([n.op, n.title]);
  }
  bits.forEach(([k,v]) => {
    const s = document.createElement('span');
    s.className = 'on';
    s.textContent = v;
    s.title = k;
    box.appendChild(s);
  });
  $('railHint').textContent = `选中「${n.title}」· 芯片须与节点一致`;
}

function portPos(nodeId, which){
  const n = nodes.find(x => x.id === nodeId);
  const el = document.querySelector(`[data-id="${nodeId}"]`);
  if (!n || !el) return {x:0,y:0};
  const r = el.getBoundingClientRect();
  const c = $('canvas').getBoundingClientRect();
  return {
    x: (which === 'in' ? r.left : r.right) - c.left,
    y: r.top - c.top + 42
  };
}

function removeEdge(i){
  if (i < 0 || i >= edges.length) return;
  edges.splice(i, 1);
  // 断边后须清 lastCompile、清 outBox、校验红、生成灰 — bump graphEpoch so in-flight compile cannot race back ok:true
  invalidateCompile(DISCONNECT_MSG);
  saveEdges();
  render();
}

function renderEdgeList(){
  const box = $('edgeList');
  if (!box) return;
  box.innerHTML = '';
  if (!edges.length) {
    box.textContent = '（无连线）';
    return;
  }
  edges.forEach((e, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:8px;justify-content:space-between';
    const lab = document.createElement('span');
    lab.textContent = `${e.from}.${e.fromPort} → ${e.to}.${e.toPort}`;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn ghost';
    btn.style.padding = '4px 10px';
    btn.style.fontSize = '11px';
    btn.textContent = '断开';
    btn.onclick = (ev) => { ev.stopPropagation(); removeEdge(i); };
    row.appendChild(lab);
    row.appendChild(btn);
    box.appendChild(row);
  });
}

function drawWires(badKeys){
  const svg = $('wires');
  const cr = $('canvas').getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${cr.width} ${cr.height}`);
  svg.innerHTML = '';
  edges.forEach((e, i) => {
    const a = portPos(e.from, 'out');
    const b = portPos(e.to, 'in');
    const mid = (a.x + b.x) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const bad = badKeys && badKeys.has(i);
    path.setAttribute('d', `M ${a.x} ${a.y} C ${mid} ${a.y}, ${mid} ${b.y}, ${b.x} ${b.y}`);
    path.setAttribute('stroke', bad ? '#ff5c5c' : '#e85d4c');
    path.setAttribute('stroke-width', '3');
    path.setAttribute('fill', 'none');
    path.style.cursor = 'pointer';
    path.setAttribute('data-edge', String(i));
    if (bad) path.setAttribute('stroke-dasharray', '4 4');
    path.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (confirm('断开这条连线？\n' + e.from + '.' + e.fromPort + ' → ' + e.to + '.' + e.toPort)) removeEdge(i);
    });
    svg.appendChild(path);
  });
}

const OP_ICON = {
  prompt: '✎', seed: '#', image: '▣', t2i: '✦', i2i: '⇄', i2v: '▶',
  lora: 'λ', lora_apply: 'λ', negative: '⊖', upscale: '↗'
};
const OP_CLS = {
  prompt: 'op-prompt', seed: 'op-seed', image: 'op-image',
  t2i: 'op-t2i', i2i: 'op-i2i', i2v: 'op-i2v',
  lora: 'op-lora', lora_apply: 'op-lora', upscale: 'op-up', negative: 'op-prompt'
};
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shortText(s, n){
  s = String(s == null ? '' : s).replace(/\s+/g,' ').trim();
  if (!s) return '—';
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}
function sumRow(k, v, em){
  return `<div class="sum"><span class="k">${esc(k)}</span><span class="v${em?' em':''}">${esc(v)}</span></div>`;
}
function isVideoFile(url){
  return !!(url && /\.(mp4|webm|mov)(\?|$)/i.test(url));
}
function mediaPreviewOf(n){
  const p = n.params || {};
  // Prefer explicit result/preview; image source uses url
  let url = n.previewUrl || p.previewUrl || p.resultUrl || '';
  let videoUrl = n.videoUrl || p.videoUrl || '';
  let kind = n.previewKind || p.previewKind || '';
  if (!url && n.op === 'image' && p.url) { url = p.url; kind = kind || 'image'; }
  if (!videoUrl && isVideoFile(url)) videoUrl = url;
  if (!kind) {
    if (n.op === 'i2v' || videoUrl) kind = 'video';
    else if (isVideoFile(url)) kind = 'video';
    else kind = 'image';
  }
  const showSlot = (n.op === 'image' || n.op === 't2i' || n.op === 'i2i' || n.op === 'i2v' || n.op === 'upscale');
  const poster = (!isVideoFile(url) && url) ? url : (p.posterUrl || '');
  return { showSlot, url, videoUrl, poster, kind };
}
function previewHtml(n){
  const { showSlot, url, videoUrl, poster, kind } = mediaPreviewOf(n);
  if (!showSlot) return '';
  const badge = kind === 'video' ? '<span class="badge vid">视频</span>' : '<span class="badge img">图片</span>';
  if (url || videoUrl) {
    const play = (kind === 'video') ? '<div class="play" aria-hidden="true"><span>▶</span></div>' : '';
    const cls = 'prev has-media' + (kind === 'video' ? ' vid' : '');
    // Card always shows a still/poster when possible; real <video> only if file is video (muted thumb).
    if (isVideoFile(url) && !poster) {
      return `<div class="${cls}" data-media-kind="${esc(kind)}" data-media-url="${esc(url)}" data-media-video="${esc(videoUrl||url)}" data-media-title="${esc(n.title||n.op)}"><video src="${esc(url)}" muted playsinline preload="metadata"></video>${play}${badge}</div>`;
    }
    const still = poster || url || '';
    return `<div class="${cls}" data-media-kind="${esc(kind)}" data-media-url="${esc(still)}" data-media-video="${esc(videoUrl||'')}" data-media-title="${esc(n.title||n.op)}"><img src="${esc(still)}" alt="" loading="lazy" referrerpolicy="no-referrer"/>${play}${badge}</div>`;
  }
  return `<div class="prev"><div class="ph">${kind === 'video' ? '待成片 · 视频' : '待成片 · 图片'}</div></div>`;
}
function closeLightbox(){
  const lb = $('mediaLightbox');
  if (!lb) return;
  const vid = lb.querySelector('video');
  if (vid) { try { vid.pause(); } catch(_){} }
  lb.classList.remove('open');
  lb.hidden = true;
  $('lbBody').innerHTML = '';
  $('lbNote').textContent = '';
}
function openLightbox({ kind, url, videoUrl, title }){
  const lb = $('mediaLightbox');
  if (!lb || (!url && !videoUrl)) return;
  $('lbTitle').textContent = title || '预览';
  $('lbKind').textContent = kind === 'video' ? '视频' : '图片';
  const body = $('lbBody');
  body.innerHTML = '';
  const note = $('lbNote');
  const playUrl = videoUrl || (isVideoFile(url) ? url : '');
  if (kind === 'video' && playUrl && isVideoFile(playUrl)) {
    const v = document.createElement('video');
    v.src = playUrl;
    v.controls = true;
    v.autoplay = true;
    v.playsInline = true;
    v.setAttribute('controlsList', 'nodownload');
    body.appendChild(v);
    note.textContent = '空格/控件可暂停 · Esc 关闭';
  } else if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = title || '';
    body.appendChild(img);
    if (kind === 'video') {
      note.textContent = '当前为预览帧；成片 .mp4/.webm 写入后可在此播放';
    } else {
      note.textContent = '点击空白或 Esc 关闭';
    }
  } else {
    note.textContent = '无可预览媒体';
  }
  lb.hidden = false;
  lb.classList.add('open');
}
function bindLightboxChrome(){
  const lb = $('mediaLightbox');
  if (!lb || lb.dataset.bound) return;
  lb.dataset.bound = '1';
  $('lbClose').onclick = (ev) => { ev.stopPropagation(); closeLightbox(); };
  lb.addEventListener('click', (ev) => { if (ev.target === lb) closeLightbox(); });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && lb.classList.contains('open')) closeLightbox();
  });
}
function nodeBodyHtml(n, imgMissing){
  const p = n.params || {};
  const rows = [];
  if (n.op === 'prompt' || n.op === 'negative') {
    rows.push(sumRow('文案', shortText(p.text, 42), true));
  } else if (n.op === 'seed') {
    rows.push(sumRow('值', String(p.value ?? '—'), true));
    rows.push('<span class="pill">只认连线</span>');
  } else if (n.op === 'image') {
    const u = p.url || '';
    const leaf = u.split('/').pop() || u || '—';
    rows.push(sumRow('资源', shortText(leaf, 28), true));
    rows.push('<span class="pill ok">image 源</span>');
  } else if (n.op === 't2i') {
    rows.push(sumRow('模型', p.serviceId || '?', true));
    rows.push(sumRow('尺寸', p.resolution || '—'));
    rows.push('<span class="pill">seed / LoRA 来自连线</span>');
  } else if (n.op === 'i2i') {
    rows.push(sumRow('模型', p.serviceId || '?', true));
    rows.push(imgMissing
      ? '<span class="pill bad">缺 image · 阻断</span>'
      : '<span class="pill ok">image 已连</span>');
  } else if (n.op === 'i2v') {
    const sid = $('serviceId').value || p.serviceId || '?';
    rows.push(sumRow('模型', sid, true));
    rows.push(sumRow('规格', `${p.duration != null ? p.duration + 's' : '?'} · ${p.resolution || '—'}`));
    rows.push(imgMissing
      ? '<span class="pill bad">缺 image · 阻断</span>'
      : '<span class="pill ok">image 已连</span>');
    // wiring map stays in rail outBox — not dumped on the card
  } else if (n.op === 'lora' || n.op === 'lora_apply') {
    rows.push(sumRow('名称', p.name || p.serviceId || '—', true));
    if (p.weight != null) rows.push(sumRow('权重', String(p.weight)));
  } else {
    rows.push(sumRow('op', n.op || '?', true));
  }
  return rows.join('');
}
function renderNodes(){
  const canvas = $('canvas');
  [...canvas.querySelectorAll('.node')].forEach(n => n.remove());
  nodes.forEach(n => {
    const imgMissing = (n.op === 'i2v' || n.op === 'i2i') && !edges.some(e => e.to === n.id && e.toPort === 'image');
    const d = document.createElement('div');
    const opCls = OP_CLS[n.op] || '';
    d.className = ('node ' + opCls + ' ' + (n.cls||'') + (n.id===selected?' sel':'')).replace(/\s+/g,' ').trim();
    d.dataset.id = n.id;
    d.style.left = n.x + 'px';
    d.style.top = n.y + 'px';
    const inBad = (n.op === 'i2v' || n.op === 'i2i') && imgMissing;
    const ico = OP_ICON[n.op] || '·';
    d.innerHTML = `<div class="bar"></div>
      <div class="hd"><span class="type"><span class="ico" aria-hidden="true">${ico}</span><span class="ttl">${esc(n.title||n.op)}</span></span><span class="more">···</span></div>
      <div class="bd">${nodeBodyHtml(n, imgMissing)}${previewHtml(n)}</div>
      ${OP_HAS_IN[n.op]?`<i class="port in ${inBad?'bad':'live'}"></i>`:''}
      ${OP_HAS_OUT[n.op]?'<i class="port out live"></i>':''}`;
    d.onclick = () => { selected = n.id; render(); };
    const prev = d.querySelector('.prev.has-media');
    if (prev) {
      prev.title = prev.classList.contains('vid') ? '点击播放 / 放大' : '点击放大';
      prev.addEventListener('click', (ev) => {
        ev.stopPropagation();
        openLightbox({
          kind: prev.dataset.mediaKind || 'image',
          url: prev.dataset.mediaUrl || '',
          videoUrl: prev.dataset.mediaVideo || '',
          title: prev.dataset.mediaTitle || n.title || n.op
        });
      });
    }
    canvas.appendChild(d);
  });
  bindLightboxChrome();
}

const OP_HAS_IN = { t2i:1, i2i:1, i2v:1, lora_apply:1 };
const OP_HAS_OUT = { prompt:1, seed:1, negative:1, image:1, lora_apply:1, t2i:1, i2i:1, i2v:1 };

function render(badKeys){
  renderNodes();
  renderChips();
  renderEdgeList();
  updateDemoBadge();
  requestAnimationFrame(() => drawWires(badKeys));
}

async function validate(){
  const graph = buildGraph();
  const epochAtStart = graphEpoch;
  const seq = ++compileSeq;
  $('dockMsg').textContent = '校验中…';
  $('dockMsg').className = 'muted';
  const res = await fetch('/api/graph/compile', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ graph })
  });
  const j = await res.json();
  // Race guard: ignore stale in-flight response after disconnect / newer validate.
  // Never overwrite post-disconnect blocked state with an old ok:true.
  if (epochAtStart !== graphEpoch || seq !== compileSeq) {
    return { ok:false, stale:true, blocked:true, error:'stale compile ignored' };
  }
  lastCompile = j;
  lastCompileEpoch = epochAtStart;
  $('outBox').textContent = JSON.stringify(j, null, 2);
  if (j.ok) {
    const map = j.wiring && j.wiring.out ? ' · map ' + JSON.stringify(j.wiring.out) : '';
    // Client-side chain shape: treat as staged even if API omits multiStep (never green Gen for chain).
    const chainShape = nodes.some(n => n.op === 't2i' || n.op === 'i2i') && nodes.some(n => n.op === 'i2v');
    const staged = isStagedCompile(j) || chainShape;
    if (staged) {
      // Force staged flags on cached compile so syncGenEnabled / generate stay blocked.
      if (!isStagedCompile(j)) {
        j = Object.assign({}, j, { multiStep: true, execute: j.execute || 'staged' });
        lastCompile = j;
        console.warn('[cloud-nodes] compile ok but missing multiStep; treating as staged (chain shape)');
      }
      const n = (j.stages || []).length;
      // Compile ok for staged ≠ runnable: warn/info (amber), never green fake-run check
      $('dockMsg').textContent = '编译通过 · 多步链 ' + n + ' stages · 需 step runner 按序物化（尚未接入）· 生成保持禁用' + map;
      $('dockMsg').className = 'info';
      syncGenEnabled();
    } else {
      $('dockMsg').textContent = '校验通过 · i2v payload 已编译' + map;
      $('dockMsg').className = 'ok';
      syncGenEnabled();
    }
    render();
  } else {
    $('dockMsg').textContent = (j.error || '校验失败') + (j.blocked ? ' · 已阻断' : '');
    $('dockMsg').className = 'warn';
    $('btnGen').disabled = true;
    render();
  }
  return j;
}

async function generate(){
  let j = lastCompile;
  // Generate only from a fresh compile that matches current graphEpoch.
  if (!j || !j.ok || lastCompileEpoch !== graphEpoch) j = await validate();
  if (!j || !j.ok || j.stale || lastCompileEpoch !== graphEpoch) return;
  if (isStagedCompile(j)) {
    $('dockMsg').textContent = (j.note || '多步链请按 stages 顺序物化；step runner 尚未接入 · 禁止一次假跑通');
    $('dockMsg').className = 'info';
    syncGenEnabled();
    return;
  }
  const epochAtStart = graphEpoch;
  $('dockMsg').textContent = '提交生成…';
  $('dockMsg').className = 'muted';
  $('btnGen').disabled = true;
  const res = await fetch('/api/generate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(j.payload)
  });
  const body = await res.json().catch(() => ({}));
  if (epochAtStart !== graphEpoch) {
    // Edge disconnected mid-generate: keep blocked UI; do not restore gen or outBox ok state.
    return;
  }
  $('outBox').textContent = JSON.stringify({ compile: j, generate: { status: res.status, body } }, null, 2);
  if (res.ok) {
    $('dockMsg').textContent = '已提交 · 看主台画廊 / out/';
    $('dockMsg').className = 'ok';
    // Hang first saved media on the sink node card (preview only; does not touch latch).
    try {
      const saved = (body && body.saved) || (body && body.files) || [];
      const first = Array.isArray(saved) && saved.length ? saved[0] : null;
      const url = first && (first.url || first.path || first.file);
      if (url) {
        const abs = String(url).startsWith('/') || String(url).startsWith('http') ? String(url) : ('/out/' + String(url).replace(/^.*\//, ''));
        const sink = nodes.find(x => x.id === selected) || nodes.find(x => x.op === 'i2v' || x.op === 't2i' || x.op === 'i2i');
        if (sink) {
          sink.params = sink.params || {};
          const isVid = (first.kind === 'video' || /\.(mp4|webm|mov)(\?|$)/i.test(abs) || sink.op === 'i2v');
          sink.params.previewKind = isVid ? 'video' : 'image';
          if (isVid && /\.(mp4|webm|mov)(\?|$)/i.test(abs)) {
            sink.params.videoUrl = abs;
            // keep existing poster if any; else still show file (browser may poster-frame)
            if (!sink.params.previewUrl) sink.params.previewUrl = abs;
          } else {
            sink.params.previewUrl = abs;
          }
          render();
        }
      }
    } catch (_) {}
  } else {
    $('dockMsg').textContent = '生成失败: ' + (body.error || res.status);
    $('dockMsg').className = 'warn';
  }
  syncGenEnabled();
}

$('btnValidate').onclick = () => validate();
$('btnGen').onclick = () => generate();
$('btnBreakImage').onclick = () => {

    $('dockMsg').textContent = DISCONNECT_MSG;

    return;
  }

};

const DEFAULT_SID = {
  'nano-gpt': 'vidu-q2-pro',
  'fal': 'fal-ai/kling-video/v2.5-turbo/standard/image-to-video',
  'civitai': 'video/minimax-h3-comfy/imageToVideo',
  'modelscope-ai': 'Wan-AI/Wan2.1-I2V-14B-480P',
  'huggingface': 'tencent/HunyuanVideo',
};

$('btnGen').disabled = true;

function setDemoUrl(id){
  try {
    const u = new URL(location.href);
    u.searchParams.set('demo', id);
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  } catch (_) {}
}

function updateDemoBadge(){
  const el = $('demoBadge');
  if (!el) return;
  const ops = nodes.map(n => n.op).join(',');
  const n = nodes.length;
  el.textContent = 'demo=' + activeDemoId + ' · nodes(' + n + '): ' + (ops || '—');
  el.title = 'activeDemoId=' + activeDemoId + ' · ops=[' + ops + '] · edges=' + edges.length;
  const isChain = (activeDemoId === 'chain' || activeDemoId === 'chain3');
  el.className = 'demo-badge ' + (isChain ? 'chain' : 'single');
}

/** Chain demos must include a t2i or i2i generator (not single-sink i2v alone). */
function assertChainNodes(reason){
  const isChain = (activeDemoId === 'chain' || activeDemoId === 'chain3');
  if (!isChain) return true;
  const ops = nodes.map(n => n.op);
  const ok = ops.includes('t2i') || ops.includes('i2i');
  if (!ok) {
    console.error('[cloud-nodes] chain boot assert failed:', reason, {
      activeDemoId, ops, edgeCount: edges.length, url: location.href
    });
  }
  return ok;
}

function applyDemo(id, opts){
  const demo = DEMOS[id] || DEMO_I2V;
  activeDemoId = demo.id;
  nodes = cloneNodes(demo.nodes);
  const forceEdges = !!(opts && opts.resetEdges);
  edges = forceEdges ? cloneEdges(demo.edges) : loadEdgesForDemo(demo);
  selected = demo.selected || (nodes[0] && nodes[0].id) || 'v';
  $('backend').value = demo.backend;
  $('serviceId').value = demo.serviceId || DEFAULT_SID[demo.backend] || '';
  saveEdges();
  setDemoUrl(demo.id);
  invalidateCompile(demo.hint);
  $('dockMsg').textContent = demo.hint;
  $('dockMsg').className = 'muted';
  updateDemoBadge();
  render();
}

$('btnDemoSingle').onclick = () => applyDemo('i2v', { resetEdges: true });
$('btnDemoChain').onclick = () => applyDemo('chain', { resetEdges: true });

$('backend').onchange = () => {
  const b = $('backend').value;
  if (DEFAULT_SID[b]) $('serviceId').value = DEFAULT_SID[b];
  invalidateCompile('backend 已变更 · 请重新校验');
  render();
};
$('serviceId').oninput = () => { invalidateCompile('serviceId 已变更 · 请重新校验'); render(); };
window.addEventListener('resize', () => drawWires());
// Boot: ?demo=chain|chain3|i2v (default i2v).
// Hard-refresh with ?demo=chain|chain3 always resets to the full multi-step graph (ignore stale disconnects).
// Single-step i2v keeps session edges across live-reload for disconnect-race QA.
// If chain nodes somehow lack t2i/i2i after apply, re-apply with resetEdges and console.error.
(function bootDemo(){
  let q = null;
  try { q = new URLSearchParams(location.search).get('demo'); } catch (_) {}
  // Prefer live URL over closed-over activeDemoId (defensive if query parsed oddly).
  if (q && DEMOS[q]) activeDemoId = DEMOS[q].id;
  const force = (activeDemoId === 'chain' || activeDemoId === 'chain3' || q === 'chain' || q === 'chain3');
  applyDemo(activeDemoId, { resetEdges: force });
  if (force && !assertChainNodes('after first applyDemo')) {
    applyDemo(activeDemoId, { resetEdges: true });
    if (!assertChainNodes('after re-applyDemo')) {
      console.error('[cloud-nodes] FATAL: chain demo still missing t2i/i2i after re-apply');
    }
  }
  updateDemoBadge();
})();
