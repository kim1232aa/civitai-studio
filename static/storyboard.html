<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>画布 · Night Lab · v0799-composer-skill</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#121214; --elev:#19191d; --line:#2a2a30;
    --text:#ececec; --muted:#8b8b94; --teal:#5ee0c5; --coral:#e85d4c;
    --ok:#3dd68c; --buzz:#f0c36a; --card:#16161a;
    --wire:#e8e8f0; --port:#a8a8b4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.45 "PingFang SC","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  button,select,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{display:flex;flex-direction:column;height:100%}
  header{height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;
    border-bottom:1px solid #1c1c20;background:#0e0e10;flex-shrink:0;z-index:20}
  .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#5ee0c5,#3aa0ff)}
  .title{font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
  .tabs{display:flex;gap:6px;background:#16161a;border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 auto}
  .tabs a,.tabs span{color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;font-size:12px}
  .tabs .on{background:#222228;color:#fff}
  .tabs .off{opacity:.45;cursor:not-allowed}
  .mode-mini{display:flex;gap:8px;align-items:center;margin-left:auto}
  .mode-mini a{color:var(--muted);text-decoration:none;font-size:12px}
  .mode-mini a:hover{color:#fff}
  .stamp{font:600 11px ui-monospace,Menlo,monospace;color:var(--buzz)}
  .stage{flex:1;position:relative;min-height:0;background:
    radial-gradient(1200px 600px at 10% -10%, rgba(94,224,197,.04), transparent 50%),
    #0b0b0d}
  .tools{position:absolute;left:14px;top:18px;z-index:12;display:flex;flex-direction:column;gap:8px}
  .tool{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);
    background:#141416;color:#fff;display:grid;place-items:center;font-size:18px}
  .tool:hover{border-color:#4a4a52}
  .viewport{position:absolute;inset:0;overflow:hidden;cursor:grab}
  .viewport.grabbing{cursor:grabbing}
  .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .grid{position:absolute;inset:-4000px;background-image:radial-gradient(circle, #2a2a32 1px, transparent 1.2px);
    background-size:28px 28px;pointer-events:none;opacity:.55}
  svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:2}
  svg.wires path.edge{fill:none;stroke:var(--wire);stroke-width:2.2;opacity:.88;pointer-events:stroke;cursor:pointer}
  svg.wires path.edge:hover{stroke:#fff;opacity:1;stroke-width:2.6}
  svg.wires path.live{fill:none;stroke:#fff;stroke-width:2.2;opacity:.95;pointer-events:none}
  svg.wires path.snap{fill:none;stroke:var(--teal);stroke-width:2.4;opacity:1;pointer-events:none}
  .card{position:absolute;border:1px solid #2a2a30;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:3}
  .asset{width:132px;border-radius:10px;overflow:visible}
  .asset .thumb{height:176px;background:#0f0f12;display:block;object-fit:cover;width:100%;border-radius:10px 10px 0 0}
  .asset .ph{height:176px;display:grid;place-items:center;color:#5a5a64;font-size:22px;background:#141418;border-radius:10px 10px 0 0}
  .asset .name{padding:7px 8px;font-size:11px;color:#d0d0d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:var(--card);border-radius:0 0 10px 10px;border:1px solid #2a2a30;border-top:0;margin-top:-1px}
  .shot{width:640px;height:360px;border-radius:16px;background:#121214;overflow:visible}
  .shot .label{position:absolute;top:-22px;left:0;font-size:11px;color:#9a9aa3;display:flex;align-items:center;gap:5px}
  .shot .face{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6a6a74;gap:8px;
    border-radius:15px;overflow:hidden}
  .shot .face img,.shot .face video{width:100%;height:100%;object-fit:cover;border-radius:15px}
  .shot .hint{font-size:11px}
  .shot.sel{border-color:#fff;box-shadow:0 0 0 1px #fff, 0 16px 40px rgba(0,0,0,.4)}
  .asset.sel{border-color:#5ee0c5}
  .badge{position:absolute;top:8px;left:8px;z-index:4;font-size:10px;line-height:1;padding:4px 7px;border-radius:6px;
    background:rgba(12,12,16,.78);border:1px solid rgba(255,255,255,.12);color:#e8e8ec;backdrop-filter:blur(6px);pointer-events:none}
  .badge.vid{border-color:rgba(94,224,197,.35);color:#b8f5e6}
  .port{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--port);
    background:transparent;padding:0;z-index:5;box-shadow:0 0 0 3px rgba(11,11,13,.55)}
  .port::before{content:"";position:absolute;inset:-12px;border-radius:50%}
  .port:hover,.port.snap-hot{border-color:var(--teal);box-shadow:0 0 0 3px rgba(94,224,197,.25),0 0 12px rgba(94,224,197,.35)}
  .asset .port.out{right:-8px;top:50%;transform:translateY(-50%)}
  .shot .port.in{left:-8px;top:50%;transform:translateY(-50%)}
  .shot .port.out{right:-8px;top:50%;transform:translateY(-50%)}
  .zoom{position:absolute;left:188px;bottom:18px;z-index:12;display:flex;align-items:center;gap:8px;
    background:#141416;border:1px solid var(--line);border-radius:12px;padding:4px 8px;color:var(--muted)}
  .zoom button{background:transparent;border:0;color:#ddd;width:24px;height:24px}
  .minimap{position:absolute;left:14px;bottom:18px;z-index:12;width:160px;height:100px;border-radius:10px;
    border:1px solid #2c2c34;background:#121216ee;backdrop-filter:blur(8px);overflow:hidden;cursor:crosshair;
    box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .minimap canvas{display:block;width:100%;height:100%}
  .dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(860px,calc(100vw - 80px));
    z-index:16;background:#16161af2;border:1px solid #34343e;border-radius:20px;padding:12px 14px 12px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);backdrop-filter:blur(18px);display:none}
  .dock.show{display:block}
  .dock.near{transform:none}
  .modes{display:flex;gap:4px;margin-bottom:10px;background:#121216;border:1px solid #2a2a32;border-radius:999px;padding:3px;width:fit-content;max-width:100%;flex-wrap:wrap}
  .modes button{border:0;background:transparent;color:#8b8b94;border-radius:999px;padding:6px 12px;font-size:12px}
  .modes button.on{color:#fff;background:#26262e;box-shadow:inset 0 0 0 1px #3a3a44}
  .modes button.stub{opacity:.7}
  .refs{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .chip-btn,.chip{width:44px;height:44px;border-radius:10px;border:1px solid #2e2e36;background:#1a1a1f;
    display:grid;place-items:center;color:#9a9aa3;font-size:10px;overflow:hidden}
  .chip img{width:100%;height:100%;object-fit:cover}
  .chip.on{border-color:#5ee0c5;box-shadow:0 0 0 1px #5ee0c5}
  .frame-slot{display:flex;align-items:center;gap:8px;flex:1 0 100%;margin:0 0 2px;color:#9a9aa3;font-size:12px}
  .frame-slot img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid #2e2e36}
  .frame-slot.missing{color:#e85d4c}
  .prompt{width:100%;min-height:92px;max-height:160px;resize:vertical;background:#121214;border:1px solid #2a2a30;
    border-radius:12px;padding:10px 12px;color:#e8e8ec}
  .prompt:focus{outline:1px solid #3a3a44}
  .mention{color:var(--teal)}
  .bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .bar select{background:#1a1a1f;border:1px solid #2e2e36;border-radius:999px;padding:6px 10px;min-width:0}
  .bar .grow{flex:1;min-width:8px}
  .send{width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#111;font-size:18px;flex-shrink:0}
  .send:disabled{opacity:.4}
  .msg{margin-top:8px;font-size:12px;color:var(--muted);min-height:1.2em}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--coral)} .msg.warn{color:var(--buzz)}
  .hidden-file{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .picker{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);z-index:18;width:min(520px,90vw);
    background:#16161a;border:1px solid #2c2c34;border-radius:14px;padding:10px;display:none;max-height:240px;overflow:auto}
  .picker.show{display:block}
  .picker button{display:flex;gap:8px;align-items:center;width:100%;background:transparent;border:0;color:#ddd;padding:6px;border-radius:8px}
  .picker button:hover{background:#222}
  .picker img{width:36px;height:36px;object-fit:cover;border-radius:6px}

  .rail{position:absolute;left:14px;top:170px;z-index:12;width:148px;max-height:calc(100% - 230px);overflow:auto;
    display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .rail-h{font-size:11px;color:#8b8b94;padding:0 4px}
  .rail-tabs{display:flex;gap:4px;padding:0 2px}
  .rail-tabs button{flex:1;border:1px solid #2a2a30;background:#141416;color:#8b8b94;border-radius:8px;padding:4px 0;font-size:11px}
  .rail-tabs button.on{color:#fff;border-color:#4a4a54;background:#1c1c22}
  .rail-item{display:flex;align-items:center;gap:6px;width:100%;border:1px solid #2a2a30;background:#141416;
    color:#ddd;border-radius:10px;padding:4px;text-align:left}
  .rail-item img{width:28px;height:28px;object-fit:cover;border-radius:6px;flex-shrink:0}
  .rail-item.on{border-color:#5ee0c5}
  .rail-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;flex:1}
  .rail-item.add{justify-content:center;color:#9a9aa3}
  .rail-item .pin{flex:0 0 auto;width:22px;height:22px;border:0;background:transparent;color:#8b8b94;font-size:12px;padding:0}
  .rail-item .pin:hover{color:#5ee0c5}
  .ghost{position:fixed;pointer-events:none;z-index:40;width:72px;height:72px;border-radius:10px;overflow:hidden;
    border:1px solid #5ee0c5;box-shadow:0 12px 32px rgba(0,0,0,.45);display:none;background:#141416}
  .ghost.show{display:block}
  .ghost img{width:100%;height:100%;object-fit:cover}
  .frame-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #2e2e36;background:#1a1a1f;
    color:#ddd;border-radius:8px;padding:2px 6px 2px 2px;font-size:11px}
  .frame-chip img{width:28px;height:28px;object-fit:cover;border-radius:6px}
  .frame-chip.on{border-color:#5ee0c5;color:#fff}
  .atbox{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);z-index:19;width:min(420px,80vw);
    background:#16161a;border:1px solid #2c2c34;border-radius:12px;padding:8px;display:none;max-height:200px;overflow:auto}
  .atbox.show{display:block}
  .atbox button{display:flex;gap:8px;align-items:center;width:100%;background:transparent;border:0;color:#ddd;padding:6px;border-radius:8px}
  .atbox button:hover{background:#222}
  .atbox img{width:28px;height:28px;object-fit:cover;border-radius:6px}


  .composer-acts{display:flex;gap:6px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
  .act-btn{border:1px solid #2e2e36;background:#1a1a1f;color:#c8c8d0;border-radius:999px;
    padding:6px 12px;font-size:12px;height:30px;line-height:1}
  .act-btn:hover{border-color:#4a4a54;color:#fff}
  .act-btn.on{border-color:#5ee0c5;color:#fff;box-shadow:0 0 0 1px rgba(94,224,197,.25)}
  .skillbox{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);z-index:19;width:min(480px,86vw);
    background:#16161a;border:1px solid #2c2c34;border-radius:14px;padding:0;display:none;max-height:340px;
    overflow:hidden;box-shadow:0 18px 48px rgba(0,0,0,.45)}
  .skillbox.show{display:flex;flex-direction:column}
  .skillbox .sk-hd{display:flex;gap:4px;padding:10px 10px 6px;overflow:auto;border-bottom:1px solid #24242a;flex-shrink:0}
  .skillbox .sk-cat{border:0;background:transparent;color:#8b8b94;border-radius:999px;padding:5px 10px;font-size:11px;white-space:nowrap}
  .skillbox .sk-cat.on{background:#26262e;color:#fff}
  .skillbox .sk-list{overflow:auto;padding:8px;flex:1;min-height:0}
  .skillbox .sk-item{display:flex;flex-direction:column;gap:2px;width:100%;background:transparent;border:0;color:#ddd;
    padding:8px 10px;border-radius:10px;text-align:left}
  .skillbox .sk-item:hover{background:#222}
  .skillbox .sk-item .sk-title{font-size:13px;color:#eee}
  .skillbox .sk-item .sk-preview{font-size:11px;color:#7a7a84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .skillbox .sk-empty{padding:28px 12px;text-align:center;color:#5a5a64;font-size:12px}
  .dur{margin-left:6px;font-size:10px;line-height:1;padding:2px 6px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#c8c8d0}
  .zoom .zpresets{display:flex;gap:2px;margin-left:4px;padding-left:6px;border-left:1px solid #2a2a30}
  .zoom .zpresets button{width:auto;min-width:28px;padding:0 6px;height:22px;border-radius:6px;
    color:#9a9aa3;font-size:10px}
  .zoom .zpresets button.on{color:#fff;background:#26262e}
  .zoom .zpresets button:hover{color:#fff}
  .import-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;padding:24px}
  .import-backdrop.show{display:flex}
  .import-modal{width:min(920px,96vw);max-height:min(720px,88vh);display:flex;flex-direction:column;
    background:#16161a;border:1px solid #2c2c34;border-radius:18px;box-shadow:0 28px 80px rgba(0,0,0,.55);
    overflow:hidden}
  .import-hd{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
  .import-hd h2{margin:0;font-size:15px;font-weight:600;flex:1}
  .import-x{width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:#9a9aa3;font-size:18px}
  .import-x:hover{color:#fff;background:#222}
  .import-tabs{display:flex;gap:18px;padding:4px 18px 0;border-bottom:1px solid #24242a}
  .import-tabs button{border:0;background:transparent;color:#8b8b94;padding:10px 2px 12px;font-size:13px;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .import-tabs button.on{color:#fff;border-bottom-color:#fff}
  .import-filters{display:flex;gap:8px;padding:14px 18px 8px;flex-wrap:wrap;align-items:center}
  .import-filters .pill{border:0;background:transparent;color:#8b8b94;border-radius:999px;padding:5px 12px;font-size:12px}
  .import-filters .pill.on{background:#26262e;color:#fff}
  .import-filters .spacer{flex:1}
  .import-filters .local-up{border:1px solid #2e2e36;background:#1a1a1f;color:#ddd;border-radius:999px;
    padding:5px 12px;font-size:12px}
  .import-filters .local-up:hover{border-color:#4a4a54}
  .import-body{flex:1;min-height:0;overflow:auto;padding:8px 18px 12px}
  .import-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .import-card{position:relative;border:1px solid #2a2a30;background:#121216;border-radius:12px;overflow:hidden;
    cursor:pointer;aspect-ratio:3/4;padding:0;color:inherit;text-align:left}
  .import-card:hover{border-color:#4a4a54}
  .import-card.on{border-color:#5ee0c5;box-shadow:0 0 0 1px #5ee0c5}
  .import-card img,.import-card video{width:100%;height:100%;object-fit:cover;display:block;background:#0f0f12}
  .import-card .ph{width:100%;height:100%;display:grid;place-items:center;color:#5a5a64;font-size:22px;background:#141418}
  .import-card .ibadge{position:absolute;top:8px;left:8px;z-index:2;font-size:10px;line-height:1;padding:4px 7px;
    border-radius:6px;background:rgba(12,12,16,.78);border:1px solid rgba(255,255,255,.12);color:#e8e8ec;
    backdrop-filter:blur(6px);pointer-events:none}
  .import-card .icheck{position:absolute;top:8px;right:8px;width:18px;height:18px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);z-index:2;pointer-events:none}
  .import-card.on .icheck{background:#5ee0c5;border-color:#5ee0c5}
  .import-card.on .icheck::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
    border:solid #0b0b0d;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .import-empty{padding:48px 16px;text-align:center;color:#6a6a74;font-size:13px}
  .import-ft{display:flex;align-items:center;gap:12px;padding:12px 18px 16px;border-top:1px solid #24242a}
  .import-ft label{display:inline-flex;align-items:center;gap:8px;color:#c8c8d0;font-size:12px;cursor:pointer}
  .import-ft .grow{flex:1}
  .import-ft .ghost{border:0;background:transparent;color:#ddd;padding:8px 12px;border-radius:999px}
  .import-ft .ghost:hover{background:#222}
  .import-ft .primary{border:0;background:#2a2a32;color:#fff;padding:8px 16px;border-radius:999px;font-weight:600}
  .import-ft .primary:hover{background:#34343e}
  .import-ft .primary:disabled{opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div class="title" id="projTitle">错位人生：我的扫地机器人同事（副本）</div>
    <nav class="tabs" aria-label="工作流">
      <span class="off" title="本版只做画布，剧本策划入口保留">剧本策划</span>
      <a class="on" href="/storyboard.html" aria-current="page">画布</a>
      <span class="off" title="本版不做剪辑时间线">编辑器</span>
    </nav>
    <div class="mode-mini">
      <a href="/">配方台</a>
      <a href="/litegraph">LiteGraph</a>
      <span class="stamp">v0799-composer-skill</span>
    </div>
  </header>
  <div class="stage">
    <div class="tools">
      <button class="tool" id="btnAdd" title="添加分镜">+</button>
      <button class="tool" id="btnAuto" title="自动布局">▦</button>
      <button class="tool" id="btnFit" title="适配">◎</button>
      <button class="tool" id="btnImport" title="导入分镜素材">⇪</button>
    </div>
    <aside class="rail" id="assetRail" aria-label="资产索引"></aside>
    <div class="atbox" id="atbox"></div>
    <div class="skillbox" id="skillbox" aria-label="Skill 选择"></div>
    <div class="viewport" id="viewport">
      <div class="world" id="world">
        <div class="grid"></div>
        <svg class="wires" id="wires"></svg>
      </div>
    </div>
    <div class="minimap" id="minimap" title="小地图 · 点击平移"><canvas id="minimapCv" width="160" height="100"></canvas></div>
    <div class="zoom">
      <button type="button" id="zOut">−</button>
      <span id="zPct">50%</span>
      <button type="button" id="zIn">+</button>
      <div class="zpresets" id="zPresets" role="group" aria-label="缩放预设">
        <button type="button" data-z="0.25">25%</button>
        <button type="button" data-z="0.5" class="on">50%</button>
        <button type="button" data-z="1">100%</button>
        <button type="button" data-z="fit">Fit</button>
      </div>
    </div>
    <div class="picker" id="picker"></div>
    <aside class="dock" id="dock">
      <div class="modes">
        <button type="button" id="modeText" class="stub" data-mode="text">文本生成</button>
        <button type="button" id="modeImg" data-mode="image">图片生成</button>
        <button type="button" id="modeVid" data-mode="video">视频生成</button>
        <button type="button" id="modeAud" class="stub" data-mode="audio">音频生成</button>
      </div>
      <div class="refs" id="refs"></div>
      <div class="composer-acts" id="composerActs">
        <button type="button" class="act-btn" id="btnSkill" title="输入 / 也可打开">Skill</button>
        <button type="button" class="act-btn" id="btnAttach" title="上传或导入附件">附件</button>
        <button type="button" class="act-btn" id="btnCanvasRef" title="引用画布资产并 @ 提到提示词">画布引用</button>
      </div>
      <textarea class="prompt" id="prompt" placeholder="描述你的想法，输入 / + skill 名称使用 Skill"></textarea>
      <div class="bar">
        <select id="backend">
          <option value="fal">fal</option>
          <option value="nano-gpt">nano-gpt</option>
          <option value="civitai">civitai</option>
          <option value="modelscope-ai">modelscope-ai</option>
          <option value="modelscope-cn">modelscope-cn</option>
          <option value="huggingface">huggingface</option>
        </select>
        <select id="service"></select>
        <select id="duration">
          <option>5s</option><option selected>12s</option><option>16s</option>
        </select>
        <select id="aspect">
          <option>16:9</option><option>9:16</option><option>1:1</option><option>21:9</option>
        </select>
        <select id="res">
          <option>720P</option><option>1080P</option>
        </select>
        <span class="grow"></span>
        <button class="send" id="send" title="生成">↑</button>
      </div>
      <div class="msg" id="msg">点分镜卡编辑提示词。输入 / 使用 Skill；@ 或「画布引用」连接资产。</div>
    </aside>
  </div>
</div>
<input class="hidden-file" id="file" type="file" accept="image/*,video/*,audio/*" />

<div class="import-backdrop" id="importModal" aria-hidden="true">
  <div class="import-modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="import-hd">
      <h2 id="importTitle">请选择要导入的分镜素材</h2>
      <button type="button" class="import-x" id="importClose" aria-label="关闭">×</button>
    </div>
    <div class="import-tabs" id="importTabs">
      <button type="button" data-itab="project" class="on">当前项目</button>
      <button type="button" data-itab="story">故事</button>
      <button type="button" data-itab="avatar">数字人</button>
      <button type="button" data-itab="canvas">画布</button>
    </div>
    <div class="import-filters">
      <button type="button" class="pill on" data-ifilter="all">全部</button>
      <button type="button" class="pill" data-ifilter="video">视频</button>
      <button type="button" class="pill" data-ifilter="image">图片</button>
      <button type="button" class="pill" data-ifilter="audio">音频</button>
      <span class="spacer"></span>
      <button type="button" class="local-up" id="importLocalBtn">本地上传</button>
    </div>
    <div class="import-body" id="importBody"></div>
    <div class="import-ft">
      <label><input type="checkbox" id="importSelectAll" /> 选择全部</label>
      <span class="grow"></span>
      <button type="button" class="ghost" id="importCancel">取消导入</button>
      <button type="button" class="primary" id="importConfirm" disabled>确认导入(0)</button>
    </div>
  </div>
</div>

<div class="ghost" id="ghost" aria-hidden="true"></div>
<script src="/static/storyboard.js"></script>
</body>
</html>
