<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>画布 · Night Lab</title>

<link rel="stylesheet" href="/static/storyboard-ui-base.css?v=o117">
<link rel="stylesheet" href="/static/storyboard-ui.css?v=o117">
<link rel="stylesheet" href="/static/composer-field-adapt.css?v=o117" />
<link rel="stylesheet" href="/static/o76-dock-right.css?v=o117" />
<link rel="stylesheet" href="/static/o97-dock-pin.css?v=o117" />
<link rel="stylesheet" href="/static/storyboard-shell.css?v=o117" />
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div class="title" id="projTitle">未命名画布</div>
    <nav class="tabs" aria-label="工作流">
      <button type="button" data-workspace="script" aria-controls="scriptWorkspace">剧本策划</button>
      <button type="button" class="on" data-workspace="canvas" aria-current="page" aria-controls="viewport">画布</button>
      <button type="button" data-workspace="editor" aria-controls="editorWorkspace">编辑器</button>
    </nav>
    <div class="mode-mini">
      <button class="tool-mini" id="canvasManagerToggle" type="button">项目</button>
      <a href="/index.html">配方台</a>
      <a href="/litegraph">LiteGraph</a>
      <span class="stamp" hidden aria-hidden="true"></span>
    </div>
  </header>
  <div id="canvasManager" class="canvas-manager" aria-label="项目与画布管理"></div>
  <div class="stage">
    <div class="workspace-panel" id="scriptWorkspace" role="region" aria-labelledby="scriptWorkspaceTitle" hidden></div>
    <div class="workspace-panel" id="editorWorkspace" role="region" aria-labelledby="editorWorkspaceTitle" hidden></div>
    <div class="tools canvas-only" aria-label="画布工具">
      <button class="tool" id="btnAdd" title="添加：空白节点或上传本地">+</button>
      <div class="add-pop" id="addPop" hidden>
        <button type="button" data-add="blank">新建空白节点</button>
        <button type="button" data-add="upload">上传本地文件</button>
      </div>
      <button class="tool" id="btnText" title="添加提示词节点">文</button>
      <button class="tool" id="btnRev" title="提示词反推">↻</button>
      <button class="tool" id="btnAuto" title="自动布局">▦</button>
      <button class="tool" id="btnFit" title="适配">◎</button>
      <button class="tool" id="btnImport" title="导入分镜素材">⇪</button>
      <div class="tools-sep node-only" aria-hidden="true"></div>
      <div class="tools-hint node-only">节点</div>
      <button class="tool lbl node-only" id="btnDownload" title="下载成片">下载</button>
      <button class="tool lbl node-only" id="btnEditNode" title="打开 Composer 编辑">编辑</button>
      <button class="tool lbl node-only" id="btnCrop" title="从成片局部摘取">摘取</button>
      <button class="tool lbl node-only" id="btnNine" title="九宫格切分">九宫</button>
      <button class="tool lbl node-only" id="btnStory" title="故事推演 3 秒 / 5 秒">推演</button>
      <button class="tool lbl node-only" id="btnLight" title="打光 · 选预设后匹配图生图">打光</button>
      <button class="tool lbl node-only" id="btnCamera" title="换机位">机位</button>
      <button class="tool lbl node-only" id="btnUpscale" title="超清放大">超清</button>
      <button class="tool lbl node-only" id="btnErase" title="涂抹消除">消除</button>
      <button class="tool lbl node-only" id="btnT2v" title="文生视频 · 不需要首帧">视频</button>
      <button class="tool lbl node-only" id="btnLast" title="给视频接尾帧">尾帧</button>
      <button class="tool lbl node-only" id="btnPano" title="720° 全景">全景</button>
      <div class="tools-sep group-only" aria-hidden="true"></div>
      <div class="tools-hint group-only">分组</div>
      <button class="tool lbl group-only" id="btnGroup" title="成组 · Shift多选后点">成组</button>
      <button class="tool lbl group-only" id="btnUngroup" title="解组">解组</button>
      <button class="tool lbl group-only" id="btnGroupRun" title="整组执行（逐步）" disabled>▶ 整组</button>
    </div>
    <div class="selbar" id="selBar" role="toolbar" aria-label="多选操作">
      <span>已选 <span class="n" id="selCount">0</span> 项</span>
      <button type="button" id="selAuto" title="自动布局">▦ 自动布局</button>
      <button type="button" class="primary" id="selGroup">成组</button>
      <button type="button" id="selUngroup">解组</button>
      <button type="button" id="selGroupRun" disabled>▶ 整组</button>
    </div>
    <aside class="rail canvas-only" id="assetRail" aria-label="主体库"></aside>
    <aside class="chat-rail canvas-only" id="chatRail" aria-label="生成路径">
      <div class="chat-rail-hd">
        <span class="chat-rail-mode" id="chatRailMode">图片生成</span>
        <span class="chat-rail-tag" id="chatRailTag">路径</span>
      </div>
      <ol class="chat-rail-path" id="chatRailPath"></ol>
      <p class="chat-rail-copy" id="chatRailCopy">选择分镜和模型后即可生成</p>
      <div class="chat-rail-acts" id="chatRailActs"></div>
    </aside>
    <div class="atbox canvas-only" id="atbox"></div>
    <div class="skillbox canvas-only" id="skillbox" aria-label="快捷指令" hidden></div>
    <div class="viewport canvas-only" id="viewport">
      <div class="world" id="world">
        <div class="grid"></div>
        <svg class="wires" id="wires"></svg>
      </div>
    </div>
    <div class="minimap canvas-only" id="minimap" title="小地图 · 点击平移"><canvas id="minimapCv" width="160" height="100"></canvas></div>
    <div class="zoom canvas-only">
      <button type="button" id="zOut">−</button>
      <span id="zPct">50%</span>
      <button type="button" id="zIn">+</button>
      <div class="zpresets" id="zPresets" role="group" aria-label="缩放预设">
        <button type="button" data-z="0.25">25%</button>
        <button type="button" data-z="0.5" class="on">50%</button>
        <button type="button" data-z="1">100%</button>
        <button type="button" data-z="fit">Fit</button>
      </div>
    </div>
    <div class="canvas-tip canvas-only show" id="canvasTip" role="note">选分镜→写画面→LoRA→↑</div>
    <button type="button" class="composer-chip canvas-only" id="composerChip" title="重新打开 Composer" hidden><span class="dot" aria-hidden="true"></span>Composer</button>
    <div class="picker canvas-only" id="picker"></div>
    <div class="shot-bar canvas-only" id="shotBar" hidden>
      <button type="button" data-shot-tool="btnPano">全景</button>
      <button type="button" data-shot-tool="btnCamera">多角度</button>
      <button type="button" data-shot-tool="btnNine">九宫格</button>
      <button type="button" data-shot-tool="btnLight">打光</button>
      <button type="button" data-shot-tool="btnStory">故事推演</button>
      <button type="button" data-shot-tool="btnErase">消除笔</button>
      <button type="button" data-shot-tool="btnUpscale">图片超清</button>
      <button type="button" data-shot-tool="btnT2v">合成视频</button>
      <button type="button" data-shot-tool="btnLast">尾帧</button>
      <span class="shot-bar-sep" aria-hidden="true"></span>
      <button type="button" data-shot-act="download">下载</button>
      <button type="button" data-shot-act="edit">编辑</button>
      <button type="button" data-shot-act="crop">摘取</button>
      <button type="button" data-shot-act="more">更多</button>
    </div>
    <aside class="dock canvas-only" id="dock" aria-label="Composer">
      <div class="dock-hd" id="dockHd">
        <button type="button" class="dock-btn primary expand-only" id="dockExpand" title="展开 Composer">展开</button>
        <span class="dock-title" id="dockTitle">Composer</span>
        <span class="dock-hint expand-only" id="dockHint">点击展开编辑提示词</span>
        <span class="grow"></span>
        <button type="button" class="dock-btn collapse-only" id="dockCollapse" title="折叠">▾ 折叠</button>
        <button type="button" class="dock-btn" id="dockClose" title="关闭 Composer">×</button>
        <button type="button" class="send" id="sendCap" title="生成">↑</button>
      </div>
      <div class="dock-body" id="dockBody">
      <div class="dock-scroll" id="dockScroll">
      <div class="modes" id="composerModes">
        <button type="button" id="modeText" class="stub" data-mode="text" title="文本生成">文本</button>
        <button type="button" id="modeImg" class="on" data-mode="image">图片</button>
        <button type="button" id="modeVid" data-mode="video">视频</button>
        <button type="button" id="modeAud" class="stub" data-mode="audio" title="音频生成">音频</button>
      </div>
      <div class="refs" id="refs"></div>
      <div class="composer-acts" id="composerActs">
        <button type="button" class="act-btn" id="btnSkill" title="快捷指令">指令</button>
        <button type="button" class="act-btn" id="btnAttach" title="上传或导入附件">附件</button>
        <button type="button" class="act-btn" id="btnCanvasRef" title="引用画布资产（连线到当前分镜，不写入 @filename）">画布引用</button>
      </div>
      </div>
      <div class="dock-prompt" id="dockPrompt">
      <textarea class="prompt" id="prompt" placeholder="描述你想生成的画面"></textarea>
      <textarea class="prompt neg" id="negative" placeholder="负面提示（不想出现的内容，可空）"></textarea>
      <div class="param-warn" id="paramWarn"></div>
      <div class="param-support-strip" id="paramSupportStrip" hidden aria-live="polite"></div>
      </div>
      <div class="dock-foot" id="dockFoot">
      <div class="lora-block" id="loraBlock" data-sb-lora="1">
        <div class="lora-hd">
          <span class="lbl" id="loraQLbl">LoRA</span>
        </div>
        <div class="lora-hint" id="loraHint"></div>
        <div class="lora-row">
          <input id="loraQ" placeholder="名字 / URL / version id / AIR" autocomplete="off" />
          <button type="button" id="searchLora">搜索</button>
        </div>
        <div class="lora-hits" id="loraHits"></div>
        <div id="loras"></div>
      </div>

      <div class="bar">
        <select id="backend">
          <option value="fal">fal</option>
          <option value="nano-gpt">nano-gpt</option>
          <option value="civitai">civitai</option>
          <option value="modelscope-ai">modelscope-ai</option>
          <option value="modelscope-cn">modelscope-cn</option>
          <option value="huggingface">huggingface</option>
        </select>
        <input id="serviceFilter" type="search" placeholder="搜索模型" autocomplete="off" />
        <select id="service" aria-describedby="catalogHint"></select>
        <div class="catalog-status" id="catalogStatus" hidden>
          <span class="catalog-hint" id="catalogHint" role="status" aria-live="polite"></span>
          <button type="button" id="catalogMore" hidden>加载更多</button>
          <button type="button" id="catalogRetry" hidden>重试本页</button>
        </div>
        <span class="param-group" id="falParams">
          <label class="param-field"><span>时长</span><select id="duration">
            <option selected>5s</option><option>12s</option><option>16s</option>
          </select></label>
          <label class="param-field"><span>比例</span><select id="aspect">
            <option>16:9</option><option>9:16</option><option>2:3</option><option>3:4</option><option>1:1</option><option>21:9</option>
          </select></label>
          <label class="param-field"><span>分辨率</span><select id="res">
            <option>720P</option><option>1080P</option>
          </select></label>
        </span>
        <span class="param-group hidden" id="comfyParams">
          <label class="param-field" for="width"><span>宽</span><input id="width" type="number" min="64" max="2048" step="8" title="宽" placeholder="宽" /></label>
          <label class="param-field" for="height"><span>高</span><input id="height" type="number" min="64" max="2048" step="8" title="高" placeholder="高" /></label>
          <label class="param-field" for="steps"><span>步数</span><input id="steps" type="number" min="1" max="150" title="步数" placeholder="steps" /></label>
          <label class="param-field" for="cfg"><span>CFG</span><input id="cfg" type="number" min="0" max="30" step="0.1" title="CFG" placeholder="cfg" /></label>
          <label class="param-field" for="sampler"><span>采样器</span><select id="sampler" title="采样器"></select></label>
          <label class="param-field" for="scheduler"><span>调度器</span><select id="scheduler" title="调度器"></select></label>
          <label class="param-field param-span" for="seed"><span>种子</span><input id="seed" type="text" title="种子" placeholder="种子" /></label>
        </span>
        <span class="param-group hidden" id="nanoParams">
          <label class="param-field param-span" for="nanoRes"><span>分辨率</span><select id="nanoRes" title="Nano 分辨率 token"></select></label>
        </span>
        <span class="grow"></span>
        <button type="button" class="send" id="send" title="生成">↑</button>
      </div>
      <div class="msg" id="msg">点分镜卡，编辑提示词后即可生成</div>
      </div>
      </div>
      </div>
    </aside>
  </div>
</div>
<input class="hidden-file" id="file" type="file" accept="image/*,video/*,audio/*" multiple />

<div class="import-backdrop" id="importModal" aria-hidden="true">
  <div class="import-modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="import-hd">
      <h2 id="importTitle">请选择要导入的分镜素材</h2>
      <button type="button" class="import-x" id="importClose" aria-label="关闭">×</button>
    </div>
    <div class="import-tabs" id="importTabs">
      <button type="button" data-itab="project" class="on">当前项目</button>
      <button type="button" data-itab="story">故事</button>
      <button type="button" data-itab="avatar">数字人</button>
      <button type="button" data-itab="canvas">画布</button>
    </div>
    <div class="import-filters">
      <button type="button" class="pill on" data-ifilter="all">全部</button>
      <button type="button" class="pill" data-ifilter="video">视频</button>
      <button type="button" class="pill" data-ifilter="image">图片</button>
      <button type="button" class="pill" data-ifilter="audio">音频</button>
      <span class="spacer"></span>
      <button type="button" class="local-up" id="importLocalBtn">本地上传</button>
    </div>
    <div class="import-url-row" id="importUrlRow">
      <input id="importUrl" type="text" placeholder="Civitai 图 id / 链接，如 https://civitai.red/images/134923572" autocomplete="off" />
      <button type="button" class="primary" id="importUrlBtn">导入参数</button>
      <button type="button" id="btnFalLoraFix" class="dev-fixture" hidden title="开发夹具">Fal LoRA夹具</button>
      <button type="button" id="btnHfLoraFix" class="dev-fixture" hidden title="开发夹具">HF LoRA夹具</button>
      <button type="button" id="btnMsLoraFix" class="dev-fixture" hidden title="开发夹具">魔搭模型（不预置 LoRA）</button>
    </div>
    <div class="import-body" id="importBody"></div>
    <div class="import-ft">
      <label><input type="checkbox" id="importSelectAll" /> 选择全部</label>
      <span class="grow"></span>
      <button type="button" class="ghost" id="importCancel">取消导入</button>
      <button type="button" class="primary" id="importConfirm" disabled>确认导入(0)</button>
    </div>
  </div>
</div>

<div class="ghost" id="ghost" aria-hidden="true"></div>

<script src="/static/lora-capability-hints.js?v=o70lora"></script>
<script src="/static/composer-field-adapt.js?v=o117caps"></script>
<script src="/static/o61-group-hide.js?v=o75seko"></script>
<script src="/static/storyboard.js?v=o117"></script>
<script src="/static/o68-capability-hide.js?v=o75caps"></script>
<script src="/static/o75-catalog-busy.js?v=o98busy"></script>
<script src="/static/o76-model-fields.js?v=o76fields"></script>
<script src="/static/o67-human-copy.js?v=o117pin"></script>
<script src="/static/canvas_manager.js?v=o99"></script>
</body>
</html>
