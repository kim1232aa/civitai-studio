<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>画布 · Night Lab</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#121214; --elev:#19191d; --line:#2a2a30;
    --text:#ececec; --muted:#8b8b94; --teal:#5ee0c5; --coral:#e85d4c;
    --ok:#3dd68c; --buzz:#f0c36a; --card:#16161a;
    --wire:#e8e8f0; --port:#a8a8b4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:13px/1.45 "PingFang SC","Noto Sans SC",ui-sans-serif,system-ui,sans-serif;overflow:hidden}
  button,select,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{display:flex;flex-direction:column;height:100%}
  header{height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;
    border-bottom:1px solid #1c1c20;background:#0e0e10;flex-shrink:0;z-index:20}
  .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#5ee0c5,#3aa0ff)}
  .title{font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36vw}
  .tabs{display:flex;gap:6px;background:#16161a;border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 auto}
  .tabs button{color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;font-size:12px;
    border:0;background:transparent;cursor:pointer}
  .tabs .on{background:#222228;color:#fff}
  .mode-mini{display:flex;gap:8px;align-items:center;margin-left:auto}
  .mode-mini a{color:var(--muted);text-decoration:none;font-size:12px}
  .mode-mini a:hover{color:#fff}
  .stamp{font:600 11px ui-monospace,Menlo,monospace;color:var(--buzz)}
  .stage{flex:1;position:relative;min-height:0;background:
    radial-gradient(1200px 600px at 10% -10%, rgba(94,224,197,.04), transparent 50%),
    #0b0b0d}
  .tools{position:absolute;left:14px;top:18px;z-index:13;display:flex;flex-direction:column;gap:8px}
  .tool{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);
    background:#141416;color:#fff;display:grid;place-items:center;font-size:18px}
  .tool:hover{border-color:#4a4a52}
  .viewport{position:absolute;inset:0;overflow:hidden;cursor:grab}
  .viewport.grabbing{cursor:grabbing}
  .world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .grid{position:absolute;inset:-4000px;background-image:radial-gradient(circle, #2a2a32 1px, transparent 1.2px);
    background-size:28px 28px;pointer-events:none;opacity:.55}
  svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:4}
  svg.wires path.edge-glow{fill:none;stroke:rgba(94,224,197,.35);stroke-width:7;opacity:.9;pointer-events:none}
  svg.wires path.edge{fill:none;stroke:#e8edf4;stroke-width:2.6;opacity:.96;pointer-events:stroke;cursor:pointer}
  svg.wires path.edge:hover{stroke:#fff;opacity:1;stroke-width:3.2}
  svg.wires path.live{fill:none;stroke:#fff;stroke-width:2.6;opacity:.95;pointer-events:none}
  svg.wires path.snap{fill:none;stroke:var(--teal);stroke-width:2.8;opacity:1;pointer-events:none}
  .card{position:absolute;border:1px solid #2a2a30;background:var(--card);box-shadow:0 10px 30px rgba(0,0,0,.28);z-index:3}
  .asset{width:132px;border-radius:10px;overflow:visible}
  .asset .thumb,.asset video.thumb{height:176px;background:#0f0f12;display:block;object-fit:cover;width:100%;border-radius:10px 10px 0 0}
  .asset .ph{height:176px;display:grid;place-items:center;color:#5a5a64;font-size:22px;background:#141418;border-radius:10px 10px 0 0}
  .asset .name{padding:7px 8px;font-size:11px;color:#d0d0d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:var(--card);border-radius:0 0 10px 10px;border:1px solid #2a2a30;border-top:0;margin-top:-1px}
  .shot{width:640px;height:360px;border-radius:16px;background:#121214;overflow:visible}
  .shot .label{position:absolute;top:-22px;left:0;font-size:11px;color:#9a9aa3;display:flex;align-items:center;gap:5px}
  .shot .face{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6a6a74;gap:8px;
    border-radius:15px;overflow:hidden}
  .shot .face img,.shot .face video{width:100%;height:100%;object-fit:cover;background:#121214;border-radius:15px}
  .shot .hint{font-size:11px}
  .shot.sel{border-color:#fff;box-shadow:0 0 0 1px #fff, 0 16px 40px rgba(0,0,0,.4)}
  .asset.sel{border-color:#5ee0c5}
  .text{width:320px;height:280px;border-radius:12px;padding:12px 12px 42px;background:#141418;overflow:visible}
  .text .label{position:absolute;top:-34px;left:0;font-size:16px;line-height:22px;color:#b9bbc4;
    max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .text textarea.editor{width:100%;height:calc(100% - 4px);resize:none;border:0;background:transparent;
    color:#e8e8ec;font-size:16px;line-height:1.65;padding:0;outline:none;white-space:pre-wrap;
    overflow:auto;overflow-wrap:anywhere;word-break:break-word}
  .text.sel{border-color:#5ee0c5;box-shadow:0 0 0 1px #5ee0c5, 0 12px 28px rgba(0,0,0,.35)}
  .text .port.in{left:-8px;top:50%;transform:translateY(-50%)}
  .text .port.out{right:-8px;top:50%;transform:translateY(-50%)}
  .text .acts{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:4px;z-index:4}
  .text .acts button{flex:1;border:1px solid #3a3a44;background:#111114cc;color:#eee;border-radius:7px;padding:3px 0;font-size:10px}
  .badge{position:absolute;top:8px;left:8px;z-index:4;font-size:10px;line-height:1;padding:4px 7px;border-radius:6px;
    background:rgba(12,12,16,.78);border:1px solid rgba(255,255,255,.12);color:#e8e8ec;backdrop-filter:blur(6px);pointer-events:none}
  .badge.vid{border-color:rgba(94,224,197,.35);color:#b8f5e6}
  .port{position:absolute;width:16px;height:16px;border-radius:50%;border:2px solid var(--port);
    background:transparent;padding:0;z-index:5;box-shadow:0 0 0 3px rgba(11,11,13,.55)}
  .port::before{content:"";position:absolute;inset:-12px;border-radius:50%}
  .port:hover,.port.snap-hot{border-color:var(--teal);box-shadow:0 0 0 3px rgba(94,224,197,.25),0 0 12px rgba(94,224,197,.35)}
  .asset .port.out{right:-8px;top:50%;transform:translateY(-50%)}
  .shot .port.in{left:-8px;top:50%;transform:translateY(-50%)}
  .shot .port.out{right:-8px;top:50%;transform:translateY(-50%)}
  .zoom{position:absolute;left:188px;bottom:18px;z-index:22;display:flex;align-items:center;gap:8px;
    background:#141416;border:1px solid var(--line);border-radius:12px;padding:4px 8px;color:var(--muted)}
  .zoom button{background:transparent;border:0;color:#ddd;width:24px;height:24px}
  .minimap{position:absolute;left:14px;bottom:18px;z-index:22;width:160px;height:100px;border-radius:10px;
    border:1px solid #2c2c34;background:#121216ee;backdrop-filter:blur(8px);overflow:hidden;cursor:crosshair;
    box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .minimap canvas{display:block;width:100%;height:100%}
  /* v0821o24: capsule dock — width follows content; JS anchors bottom (not mid-float / not full bottom-bar) */
  .dock{position:absolute;left:auto;top:auto;right:auto;bottom:auto;transform:none;width:max-content;min-width:280px;max-width:min(560px,calc(100% - 48px));
    z-index:16;background:#16161af2;border:1px solid #34343e;border-radius:18px;padding:0;
    box-shadow:0 18px 48px rgba(0,0,0,.45);backdrop-filter:blur(18px);display:none;
    flex-direction:column;max-height:58vh;overflow:hidden}
  .dock.show{display:flex}
  .dock.near{box-shadow:0 12px 36px rgba(0,0,0,.5),0 0 0 1px rgba(94,224,197,.18)}
  .dock.collapsed{max-height:none;overflow:visible}
  .dock.collapsed .dock-body{display:flex;flex-direction:column;overflow:visible;padding:8px 12px 10px;min-height:0;flex:0 0 auto}
  .dock.collapsed .dock-scroll{overflow:visible;flex:0 0 auto}
  .dock.collapsed .dock-scroll > :not(.modes):not(.refs){display:none}
  .dock.collapsed .refs.refs-empty{display:none}
  .dock.collapsed .modes{margin-bottom:0}
  /* v0821o19: single ↑ = capsule #send; collapsed keeps dock-foot/#send visible */
  .dock.collapsed .dock-foot{display:flex;flex-direction:column;gap:4px;padding:0 4px 6px;flex:0 0 auto}
  .dock.collapsed .dock-foot .lora-block{display:none}
  .dock.collapsed .dock-foot .bar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-height:36px}
  .dock.collapsed .dock-foot .bar > :not(#send):not(.grow){display:none}
  .dock.collapsed .dock-foot .msg{display:none}
  /* v0821o30: gate/fail must never be silent in capsule */
  .dock.collapsed .dock-foot .msg.bad,
  .dock.collapsed .dock-foot .msg.warn{display:block!important;max-height:4.8em;margin:4px 6px 2px}
  .dock.show{z-index:26}
  .dock-foot .send-toast{display:none;margin:0 6px 4px;padding:6px 10px;border-radius:10px;
    font-size:12px;line-height:1.35;background:#2a1a18;border:1px solid #6a3a34;color:#ffd0ca;
    position:relative;z-index:8;pointer-events:none;overflow-wrap:anywhere;word-break:break-word}
  .dock-foot .send-toast:not([hidden]){display:block!important}
  .dock-foot .send-toast.warn{background:#2a2618;border-color:#6a5a34;color:#f0e0a8}
  .dock-foot .send-toast.ok{background:#182a24;border-color:#346a5a;color:#b8f5e6}
  .dock.collapsed .dock-foot .bar{display:flex!important;justify-content:flex-end;align-items:center;position:relative;z-index:7}
  .dock.collapsed .dock-foot .bar #send{position:relative;z-index:8;pointer-events:auto!important}
  .dock.expanded{max-height:58vh}
  .dock.expanded .dock-body{display:flex;flex-direction:column;overflow:hidden;padding:10px 14px 12px;min-height:0;flex:1}
  /* ONE scroll owner for the whole body */
  .dock-scroll{flex:1 1 auto;min-height:0;overflow:auto}
  .dock.expanded .dock-scroll{min-height:0}
  .param-field{display:flex;flex-direction:column;gap:3px;min-width:0}
  .param-field > span{font-size:10px;line-height:1;color:#8b8b94;padding-left:2px}
  /* foot is not a second scroller */
  .dock-foot{flex:0 0 auto;max-height:none;overflow:visible;position:static;background:#16161af2;padding-top:2px;z-index:3;pointer-events:auto}
  /* LoRA list may scroll internally without a full-panel twin bar */
  .dock.expanded .lora-block{max-height:140px;overflow:auto}
  .dock-hd{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-shrink:0;
    border-bottom:1px solid transparent;cursor:default}
  .dock.expanded .dock-hd{border-bottom-color:#2a2a32}
  .dock.collapsed .dock-hd{border-bottom-color:transparent;cursor:pointer}
  .dock-hd .dock-title{font-size:12px;font-weight:600;color:#e8e8ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  .dock-hd .dock-hint{font-size:11px;color:#7a7a84}
  .dock-hd .grow{flex:1;min-width:8px}
  .dock-btn{border:1px solid #2e2e36;background:#1a1a1f;color:#c8c8d0;border-radius:8px;
    height:28px;min-width:28px;padding:0 8px;font-size:12px;line-height:1;flex-shrink:0}
  .dock-btn:hover{border-color:#4a4a54;color:#fff}
  .dock-btn.primary{border-color:rgba(94,224,197,.45);color:#b8f5e6;background:rgba(94,224,197,.10)}
  .dock.collapsed .collapse-only,
  .dock.expanded .expand-only{display:none}
  /* v0821o24: capsule modes — full labels, width follows content (no 图…/视… ellipsis) */
  .modes{display:flex;gap:4px;margin-bottom:8px;background:#121216;border:1px solid #2a2a32;border-radius:12px;padding:4px;width:max-content;max-width:100%;flex-wrap:nowrap;align-items:center;flex:0 0 auto}
  .modes button{border:0;background:transparent;color:#d2d2d8;border-radius:10px;padding:6px 12px;font-size:12px;line-height:1.2;white-space:nowrap;flex:0 0 auto;min-width:max-content;text-align:center;overflow:visible;text-overflow:clip}
  .modes button.on{color:#fff;background:#3a3a44;box-shadow:inset 0 0 0 1px #5ee0c5;font-weight:600}
  .modes button.stub{flex:0 0 auto;min-width:max-content;padding:4px 8px;font-size:11px;opacity:.72;color:#9a9aa3;background:transparent}
  .modes button .mode-tag{display:inline-flex;align-items:center;margin:0 0 0 4px;padding:0 6px;height:16px;border-radius:999px;border:1px solid #2e2e36;background:#1a1a20;font-size:10px;font-weight:400;color:#8b8b94;line-height:1}
  .modes button.on .mode-tag{color:#b8f5e6}
  .refs{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .chip-btn,.chip{width:44px;height:44px;border-radius:10px;border:1px solid #2e2e36;background:#1a1a1f;
    display:grid;place-items:center;color:#9a9aa3;font-size:10px;overflow:hidden}
  .chip img{width:100%;height:100%;object-fit:cover}
  .chip.on{border-color:#5ee0c5;box-shadow:0 0 0 1px #5ee0c5}
  .ref-cap-hint{width:auto;min-width:0;height:auto;padding:6px 10px;border-radius:999px;border:1px solid #2e2e36;background:#1a1a1f;color:#9a9aa3;font-size:11px;display:inline-flex;align-items:center;white-space:nowrap}
  .frame-slot{display:flex;align-items:center;gap:8px;flex:1 0 100%;margin:0 0 2px;color:#9a9aa3;font-size:12px}
  .frame-slot img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid #2e2e36}
  .frame-slot.missing{color:#e85d4c;flex-wrap:wrap}
  .frame-slot.missing .chip-btn{width:auto;min-width:44px;padding:0 10px;height:32px}
  .prompt{width:100%;min-height:120px;max-height:180px;resize:vertical;background:#121214;border:1px solid #2a2a30;
    border-radius:12px;padding:10px 12px;color:#e8e8ec}
  #prompt{position:sticky;top:0;z-index:4;background:#121214}
  .prompt:focus{outline:1px solid #3a3a44}
  .prompt.neg{min-height:56px;max-height:96px;margin-top:8px;position:static}
  .prompt.is-over{border-color:#e85d4c;outline:1px solid rgba(232,93,76,.45)}
  .param-warn{margin-top:6px;font-size:11px;color:var(--buzz);min-height:1.1em}
  .param-warn.bad{color:var(--coral)}
  .mention{color:var(--teal)}
  .bar{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;position:relative;z-index:2}
  .bar select,.bar input[type=number],.bar input[type=text],.bar input[type=search]{background:#1a1a1f;border:1px solid #2e2e36;border-radius:999px;padding:6px 10px;min-width:0;color:#e8e8ec}
  .bar input[type=number],.bar input[type=text]{width:72px}
  .bar input#serviceFilter{width:110px;flex:0 0 110px}
  .bar input#serviceFilter::-webkit-search-cancel-button{cursor:pointer}
  .catalog-status{display:flex;align-items:center;gap:6px;flex:1 0 100%;min-width:0;color:var(--muted);font-size:11px;line-height:1.35}
  .catalog-status .catalog-hint{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catalog-status button{border:1px solid #2e2e36;background:#1a1a1f;color:#c8c8d0;border-radius:999px;padding:4px 9px;font-size:11px;white-space:nowrap}
  .catalog-status button:hover{border-color:#4a4a54;color:#fff}
  .catalog-status button:disabled{opacity:.55;cursor:wait}
  .bar #seed{width:auto;min-width:168px;flex:1 1 168px;max-width:240px}
  .bar #sampler,.bar #scheduler,.bar #nanoRes{max-width:140px}
  .bar .param-group{display:contents}
  .bar .param-field{display:flex;flex-direction:column;gap:3px;min-width:0}
  .bar .param-field>span{font-size:11px;color:#9a9aa3;line-height:1.2}
  .bar .param-field.param-span{grid-column:1/-1;flex:1 1 100%}
  .bar .param-field:has(.hidden){display:none}
  .bar .param-group.hidden{display:none}
  .bar .hidden,.prompt.hidden{display:none !important}
  .bar input.is-over, .bar select.is-over{border-color:#e85d4c;box-shadow:0 0 0 1px rgba(232,93,76,.45)}
  .bar .grow{flex:1;min-width:8px}
  .send{width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:#111;font-size:20px;flex-shrink:0;cursor:pointer;
    position:relative;z-index:5;pointer-events:auto;touch-action:manipulation;margin:2px}
  .send::before{content:"";position:absolute;inset:-14px;border-radius:50%}
  .send:disabled,.send.is-blocked,.send[aria-disabled="true"]{background:#3a3a44;color:#8b8b94;opacity:1;cursor:not-allowed;box-shadow:none}
  .msg{margin-top:8px;font-size:12px;color:var(--muted);min-height:1.2em;max-height:6.5em;overflow:auto;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;line-height:1.5}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--coral)} .msg.warn{color:var(--buzz)}
  .msg .msg-main{display:block}
  .msg .msg-more{margin-top:2px}
  .msg .msg-more summary{cursor:pointer;color:inherit}
  .msg .msg-excerpt{margin:4px 0 0;font:11px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:3.6em;overflow:auto}
  .shot .result-error{width:100%;height:100%;max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:24px;color:#ffd0ca;background:rgba(120,31,25,.18);overflow:auto}
  .shot .result-error strong{color:var(--coral);font-size:16px;flex-shrink:0}
  .shot .result-error span{color:#f0aaa2;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-height:8em;overflow:auto}
  .shot .result-error-more{font-size:12px;color:#f0aaa2}
  .shot .result-error-more pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:6em;overflow:auto;margin:6px 0 0}
  .hidden-file{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .picker{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);z-index:18;width:min(520px,90vw);
    background:#16161a;border:1px solid #2c2c34;border-radius:14px;padding:10px;display:none;max-height:240px;overflow:auto}
  .picker.show{display:block}
  .picker button{display:flex;gap:8px;align-items:center;width:100%;background:transparent;border:0;color:#ddd;padding:6px;border-radius:8px}
  .picker button:hover{background:#222}
  .picker img{width:36px;height:36px;object-fit:cover;border-radius:6px}

  .rail{position:absolute;left:14px;top:360px;z-index:11;width:148px;max-height:calc(100% - 420px);overflow:auto;
    display:flex;flex-direction:column;gap:6px;padding-right:2px}
  .rail-h{font-size:11px;color:#8b8b94;padding:0 4px}
  .rail-tabs{display:flex;gap:4px;padding:0 2px}
  .rail-tabs button{flex:1;border:1px solid #2a2a30;background:#141416;color:#8b8b94;border-radius:8px;padding:4px 0;font-size:11px}
  .rail-tabs button.on{color:#fff;border-color:#4a4a54;background:#1c1c22}
  .rail-item{display:flex;align-items:center;gap:6px;width:100%;border:1px solid #2a2a30;background:#141416;
    color:#ddd;border-radius:10px;padding:4px;text-align:left}
  .rail-item img,.rail-item video{width:28px;height:28px;object-fit:cover;border-radius:6px;flex-shrink:0}
  .rail-item.on{border-color:#5ee0c5}
  .rail-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;flex:1;min-width:0}
  .rail-item.add{justify-content:center;color:#9a9aa3}
  .rail-item .pin{flex:0 0 auto;width:22px;height:22px;border:0;background:transparent;color:#8b8b94;font-size:12px;padding:0}
  .rail-item .pin:hover{color:#5ee0c5}
  .ghost{position:fixed;pointer-events:none;z-index:40;width:72px;height:72px;border-radius:10px;overflow:hidden;
    border:1px solid #5ee0c5;box-shadow:0 12px 32px rgba(0,0,0,.45);display:none;background:#141416}
  .ghost.show{display:block}
  .ghost img{width:100%;height:100%;object-fit:cover}
  .frame-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #2e2e36;background:#1a1a1f;
    color:#ddd;border-radius:8px;padding:2px 6px 2px 2px;font-size:11px}
  .frame-chip img{width:28px;height:28px;object-fit:cover;border-radius:6px}
  .frame-chip.on{border-color:#5ee0c5;color:#fff}
  .atbox{position:absolute;left:50%;bottom:250px;transform:translateX(-50%);z-index:19;width:min(420px,80vw);
    background:#16161a;border:1px solid #2c2c34;border-radius:12px;padding:8px;display:none;max-height:200px;overflow:auto}
  .atbox.show{display:block}
  .atbox button{display:flex;gap:8px;align-items:center;width:100%;background:transparent;border:0;color:#ddd;padding:6px;border-radius:8px}
  .atbox button:hover{background:#222}
  .atbox img{width:28px;height:28px;object-fit:cover;border-radius:6px}

        </div>
        <div class="lora-hits" id="loraHits"></div>
        <div id="loras"></div>
      </div>

      <div class="bar">
        <select id="backend">
          <option value="fal">fal</option>
          <option value="nano-gpt">nano-gpt</option>
          <option value="civitai">civitai</option>
          <option value="modelscope-ai">modelscope-ai</option>
          <option value="modelscope-cn">modelscope-cn</option>
          <option value="huggingface">huggingface</option>
        </select>
        <input id="serviceFilter" type="search" placeholder="搜索模型" autocomplete="off" />
        <select id="service" aria-describedby="catalogHint"></select>
        <div class="catalog-status" id="catalogStatus" hidden>
          <span class="catalog-hint" id="catalogHint" role="status" aria-live="polite"></span>
          <button type="button" id="catalogMore" hidden>加载更多</button>
          <button type="button" id="catalogRetry" hidden>重试本页</button>
        </div>
        <span class="param-group" id="falParams">
          <label class="param-field"><span>时长</span><select id="duration">
            <option selected>5s</option><option>12s</option><option>16s</option>
          </select></label>
          <label class="param-field"><span>比例</span><select id="aspect">
            <option>16:9</option><option>9:16</option><option>1:1</option><option>21:9</option>
          </select></label>
          <label class="param-field"><span>分辨率</span><select id="res">
            <option>720P</option><option>1080P</option>
          </select></label>
        </span>
        <span class="param-group hidden" id="comfyParams">
          <label class="param-field" for="width"><span>宽</span><input id="width" type="number" min="64" max="2048" step="8" title="宽" placeholder="宽" /></label>
          <label class="param-field" for="height"><span>高</span><input id="height" type="number" min="64" max="2048" step="8" title="高" placeholder="高" /></label>
          <label class="param-field" for="steps"><span>步数</span><input id="steps" type="number" min="1" max="150" title="步数" placeholder="steps" /></label>
          <label class="param-field" for="cfg"><span>CFG</span><input id="cfg" type="number" min="0" max="30" step="0.1" title="CFG" placeholder="cfg" /></label>
          <label class="param-field" for="sampler"><span>采样器</span><select id="sampler" title="采样器"></select></label>
          <label class="param-field" for="scheduler"><span>调度器</span><select id="scheduler" title="调度器"></select></label>
          <label class="param-field param-span" for="seed"><span>种子</span><input id="seed" type="text" title="种子" placeholder="种子" /></label>
        </span>
        <span class="param-group hidden" id="nanoParams">
          <label class="param-field param-span" for="nanoRes"><span>分辨率</span><select id="nanoRes" title="Nano 分辨率 token"></select></label>
        </span>
        <span class="grow"></span>
        <button type="button" class="send" id="send" data-testid="composer-send" title="生成">↑</button>
      </div>
      <div class="msg" id="msg">点分镜卡编辑提示词。输入 / 使用 Skill；「画布引用」只连线，不写 @filename；手动 @ 可选。</div>
      </div>
      </div>
    </aside>
  </div>
</div>
<input class="hidden-file" id="file" type="file" accept="image/*,video/*,audio/*" multiple />

<div class="import-backdrop" id="importModal" aria-hidden="true">
  <div class="import-modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <div class="import-hd">
      <h2 id="importTitle">请选择要导入的分镜素材</h2>
      <button type="button" class="import-x" id="importClose" aria-label="关闭">×</button>
    </div>
    <div class="import-tabs" id="importTabs">
      <button type="button" data-itab="project" class="on">当前项目</button>
      <button type="button" data-itab="story">故事</button>
      <button type="button" data-itab="avatar">数字人</button>
      <button type="button" data-itab="canvas">画布</button>
    </div>
    <div class="import-filters">
      <button type="button" class="pill on" data-ifilter="all">全部</button>
      <button type="button" class="pill" data-ifilter="video">视频</button>
      <button type="button" class="pill" data-ifilter="image">图片</button>
      <button type="button" class="pill" data-ifilter="audio">音频</button>
      <span class="spacer"></span>
      <button type="button" class="local-up" id="importLocalBtn">本地上传</button>
    </div>
    <div class="import-url-row" id="importUrlRow">
      <input id="importUrl" type="text" placeholder="Civitai 图 id / 链接，如 https://civitai.red/images/134923572" autocomplete="off" />
      <button type="button" class="primary" id="importUrlBtn">导入参数</button>
      <button type="button" id="btnFalLoraFix" class="dev-fixture" hidden title="开发夹具">Fal LoRA夹具</button>
      <button type="button" id="btnHfLoraFix" class="dev-fixture" hidden title="开发夹具">HF LoRA夹具</button>
      <button type="button" id="btnMsLoraFix" class="dev-fixture" hidden title="开发夹具">魔搭模型（不预置 LoRA）</button>
    </div>
    <div class="import-body" id="importBody"></div>
    <div class="import-ft">
      <label><input type="checkbox" id="importSelectAll" /> 选择全部</label>
      <span class="grow"></span>
      <button type="button" class="ghost" id="importCancel">取消导入</button>
      <button type="button" class="primary" id="importConfirm" disabled>确认导入(0)</button>
    </div>
  </div>
</div>

<div class="ghost" id="ghost" aria-hidden="true"></div>
<script src="/static/composer-field-adapt.js?v=20260910-o31hflora"></script>
<script src="/static/storyboard.js?v=20260910-o31hflora"></script>
</body>
</html>
