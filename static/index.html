<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civitai Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --panel: #111114;
    --elev: #18181f;
    --line: #2a2a33;
    --text: #f4f1ea;
    --muted: #8b8796;
    --accent: #ff4d3d;
    --buzz: #f0c36a;
    --ok: #5dcaa0;
    --nsfw: #ff5c8a;
    --radius: 10px;
    --radius-sm: 8px;
    --font: "Outfit", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  html { color-scheme: dark; }
  body {
    display: grid;
    grid-template-columns: 440px 1fr;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--font);
  }
  body::before {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(1100px 520px at 8% -12%, rgba(240,195,106,.08), transparent 58%),
      radial-gradient(780px 480px at 100% 108%, rgba(255,77,61,.06), transparent 52%);
  }
  aside, main { position: relative; z-index: 1; }

  aside {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px 12px;
    flex-shrink: 0;
  }
  .wordmark { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .wordmark h1 {
    font-family: Outfit, var(--font);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .18em;
    margin: 0;
    white-space: nowrap;
    color: var(--text);
  }
  .buzz-ico { flex-shrink: 0; display: block; filter: drop-shadow(0 0 6px rgba(240,195,106,.45)); }

  .nsfw {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .1em;
    flex-shrink: 0;
  }
  .nsfw input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }
  .nsfw .switch {
    width: 32px;
    height: 18px;
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: 99px;
    position: relative;
    display: inline-block;
    transition: border-color .15s, background .15s;
  }
  .nsfw .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform .15s, background .15s;
  }
  .nsfw input:checked + .switch {
    background: color-mix(in srgb, var(--nsfw) 32%, var(--elev));
    border-color: var(--nsfw);
  }
  .nsfw input:checked + .switch::after {
    transform: translateX(14px);
    background: var(--nsfw);
  }
  .nsfw:focus-within .switch { outline: 1px solid var(--buzz); outline-offset: 1px; }

  .recipes {
    display: flex;
    gap: 4px;
    margin: 0 18px 14px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    flex-shrink: 0;
  }
  .recipes button {
    flex: 1;
    min-width: 0;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 8px 6px;
    font: 500 13px/1.2 var(--font);
    cursor: pointer;
  }
  .recipes button:hover { color: var(--text); }
  .recipes button.on {
    background: var(--elev);
    color: var(--buzz);
    border-color: color-mix(in srgb, var(--buzz) 45%, var(--line));
    box-shadow: 0 0 0 1px rgba(240,195,106,.08);
  }
  .recipes button:focus-visible { outline: 1px solid var(--buzz); outline-offset: 1px; }

  .form {
    overflow: auto;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 18px 20px;
  }
  .form::-webkit-scrollbar,
  main::-webkit-scrollbar { width: 8px; }
  .form::-webkit-scrollbar-thumb,
  main::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 99px;
  }

  .block { margin-bottom: 16px; }
  .block-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .block-title::before {
    content: "";
    width: 12px;
    height: 2px;
    background: var(--buzz);
    border-radius: 2px;
    opacity: .85;
  }

  .lbl {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin: 10px 0 5px;
    letter-spacing: .06em;
  }
  .block > .lbl:first-child,
  .adv > .lbl:first-child { margin-top: 0; }

  textarea, input, select {
    width: 100%;
    background: var(--elev);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font: 13px/1.45 var(--font);
  }
  textarea { min-height: 132px; resize: vertical; padding: 10px 12px; font-size: 14px; }
  #prompt { min-height: 176px; }
  textarea.neg { min-height: 64px; font-size: 13px; }
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238b8796' d='M1 1.5 6 6.5 11 1.5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px;
  }
  textarea:hover, input:hover, select:hover { border-color: color-mix(in srgb, var(--buzz) 35%, var(--line)); }
  textarea:focus, input:focus, select:focus {
    outline: 1px solid var(--buzz);
    outline-offset: 1px;
    border-color: var(--buzz);
  }
  #svcFilter:focus {
    outline: none;
    outline-offset: 0;
    border-color: color-mix(in srgb, var(--buzz) 28%, var(--line));
    box-shadow: none;
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .import-row { display: flex; gap: 8px; }
  .import-row input { flex: 1; min-width: 0; }
  .import-row button { flex: 0 0 auto; }

  button {
    border: 0;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font: 500 13px/1.2 var(--font);
    cursor: pointer;
  }
  .ghost {
    background: var(--elev);
    color: var(--text);
    border: 1px solid var(--line);
  }
  .ghost:hover { border-color: var(--buzz); color: var(--buzz); }
  .ghost:focus-visible, .primary:focus-visible {
    outline: 1px solid var(--buzz);
    outline-offset: 1px;
  }

  .adv {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    padding: 0 10px 10px;
  }
  .adv summary {
    cursor: pointer;
    list-style: none;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .08em;
    padding: 10px 2px;
    user-select: none;
  }
  .adv summary::-webkit-details-marker { display: none; }
  .adv summary::before {
    content: "▸";
    color: var(--buzz);
    display: inline-block;
    width: 1em;
    margin-right: 4px;
  }
  .adv[open] summary::before { content: "▾"; }
  .adv summary:hover { color: var(--text); }

  .dropzone { display: flex; flex-direction: column; gap: 8px; }
  .dz-hit {
    position: relative;
    min-height: 92px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    overflow: hidden;
  }
  .dz-hit:hover, .dz-hit:focus-within { border-color: var(--buzz); }
  #firstFile, #sourceFile, #refs {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    z-index: 2;
    border: 0;
    padding: 0;
    background: transparent;
    border-radius: 0;
  }
  .dz-ui {
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 92px;
    color: var(--muted);
    font-size: 12px;
  }
  .dz-ico {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    color: var(--buzz);
    font-size: 16px;
    line-height: 1;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .check input {
    width: 15px;
    height: 15px;
    accent-color: var(--buzz);
    cursor: pointer;
  }

  .ckpt, .ckpt-face {
    color: var(--text);
    font-size: 13px;
    margin-top: 0;
    min-height: 1.2em;
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ckpt-face:empty::before { content: "未选底模"; color: var(--muted); }

  .lora {
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 8px;
  }
  .lora .top { display: flex; gap: 8px; align-items: center; }
  .lora-info { flex: 1; min-width: 0; }
  .lora-name { font-size: 13px; font-weight: 500; }
  .lora-air { font-size: 11px; color: var(--muted); margin: 2px 0 0; word-break: break-all; }
  .lora-str { width: 72px !important; flex-shrink: 0; }
  .lora-del {
    padding: 6px 8px;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .lora-del:hover { color: var(--accent); border-color: var(--accent); }

  .hits { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hits div {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    margin-top: 6px;
    cursor: pointer;
    background: var(--elev);
  }
  .hits div:hover { border-color: var(--buzz); color: var(--text); }

  .dock {
    flex-shrink: 0;
    min-width: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 18px 16px;
    box-shadow: 0 -16px 28px rgba(9,9,11,.45);
  }
  .cost {
    color: var(--buzz);
    font-size: 12px;
    letter-spacing: .04em;
    min-height: 1.2em;
    margin-bottom: 8px;
  }
  .btns { display: flex; gap: 8px; align-items: stretch; }
  .btns .ghost { flex: 0 0 88px; }
  .qty-dock {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 70px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }
  .qty-dock input {
    width: 48px;
    text-align: center;
    padding: 12px 4px;
    font-size: 14px;
  }
  .primary {
    background: var(--accent);
    color: #fff;
    flex: 1;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 12px;
    border-radius: var(--radius);
    letter-spacing: .12em;
    box-shadow: 0 8px 22px rgba(255,77,61,.22);
  }
  .primary:hover:not(:disabled) { filter: brightness(1.06); }
  .primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  #dockStatus {
    color: var(--muted);
    font-size: 12px;
    min-height: 1.3em;
    margin-top: 8px;
    max-width: 100%;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  main {
    padding: 18px 22px 24px;
    overflow: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .status {
    color: var(--muted);
    min-height: 1.3em;
    margin-bottom: 14px;
    word-break: break-all;
    font-size: 13px;
  }
  .ok { color: var(--ok) !important; }
  .bad { color: var(--accent) !important; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 180px;
    color: var(--muted);
    text-align: center;
    padding: 48px 24px 24px;
  }
  .empty-frame {
    width: 76px;
    height: 76px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    margin-bottom: 16px;
    position: relative;
    background: var(--panel);
  }
  .empty-frame::before {
    content: "";
    position: absolute;
    inset: 22px 18px 26px;
    border: 1px solid color-mix(in srgb, var(--buzz) 40%, var(--line));
    border-radius: 4px;
    opacity: .7;
  }
  .empty-frame::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--buzz);
    top: 16px;
    right: 16px;
    box-shadow: 0 0 10px rgba(240,195,106,.5);
  }
  .empty-title { margin: 0 0 6px; font-size: 15px; color: var(--text); font-weight: 600; }
  .empty-hint { margin: 0; font-size: 12px; max-width: 280px; line-height: 1.6; }


  .gal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .gal-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .gal-count { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .gal-filters { display: flex; gap: 4px; }
  .gal-filters button {
    background: var(--elev);
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 6px 10px;
    font-size: 12px;
  }
  .gal-filters button.on { color: var(--buzz); border-color: color-mix(in srgb, var(--buzz) 45%, var(--line)); }
  .card-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
  }
  .card-bar .meta { padding: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-acts { display: flex; gap: 6px; flex-shrink: 0; }
  .card-acts .ghost, .card-acts a.ghost {
    padding: 6px 8px;
    font-size: 11px;
    text-decoration: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--buzz) 40%, var(--line)); }
  .card img, .card video { width: 100%; display: block; background: #000; }
  .card .meta { padding: 8px 10px; color: var(--muted); font-size: 12px; }


  .ghost:disabled { opacity: .55; cursor: wait; }
  .wait-pane {
    margin: 0 0 10px;
    padding: 12px;
    background: color-mix(in srgb, var(--buzz) 10%, var(--elev));
    border: 1px solid color-mix(in srgb, var(--buzz) 60%, var(--line));
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .wait-pane.hidden { display: none !important; }
  .wait-head { display: flex; align-items: center; gap: 10px; }
  .wait-spin {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 2px solid var(--line);
    border-top-color: var(--buzz);
    border-radius: 50%;
    animation: waitspin .7s linear infinite;
  }
  .wait-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .wait-bar {
    height: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 99px;
    overflow: hidden;
  }
  .wait-bar > i {
    display: block;
    height: 100%;
    width: 28%;
    background: var(--buzz);
    border-radius: 99px;
  }
  .wait-bar > i.indet { animation: waitslide 1.35s ease-in-out infinite; }
  .wait-meta { font-size: 12px; color: var(--buzz); letter-spacing: .02em; }
  @keyframes waitspin { to { transform: rotate(360deg); } }
  @keyframes waitslide {
    0% { transform: translateX(-120%); width: 32%; }
    100% { transform: translateX(340%); width: 32%; }
  }

  .hidden { display: none !important; }

  .svc-list {
    flex: 0 1 34vh;
    min-height: 0;
    height: auto;
    max-height: 34vh;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  .svc-list::-webkit-scrollbar { width: 8px; }
  .svc-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  .svc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    font: 500 13px/1.25 var(--font);
  }
  .svc-row:hover { background: var(--elev); color: var(--text); }
  .svc-row.on {
    background: var(--elev);
    color: var(--buzz);
    border-color: color-mix(in srgb, var(--buzz) 45%, var(--line));
    box-shadow: 0 0 0 1px rgba(240,195,106,.08);
  }
  .svc-row:focus-visible { outline: 1px solid var(--buzz); outline-offset: 1px; }
  .svc-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .svc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .svc-meta {
    font-size: 10px;
    font-weight: 400;
    color: #5a5663;
    letter-spacing: .02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge-deg {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--buzz);
    border: 1px solid color-mix(in srgb, var(--buzz) 50%, var(--line));
    background: color-mix(in srgb, var(--buzz) 14%, transparent);
    border-radius: 99px;
    padding: 1px 6px;
  }
  .svc-other {
    margin-top: 4px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }
  .svc-other > summary {
    cursor: pointer;
    list-style: none;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .08em;
    padding: 8px 10px;
    user-select: none;
  }
  .svc-other > summary::-webkit-details-marker { display: none; }
  .svc-other[open] > summary { border-bottom: 1px solid var(--line); }
  .svc-empty { color: var(--muted); font-size: 12px; padding: 10px 8px; }

  .wf-air {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
  }
  .wf-air .air-row {
    padding: 4px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    word-break: break-all;
  }
  .wf-air .air-ok { color: var(--ok); }
  .wf-air .air-bad { color: var(--accent); }
  .wf-air .air-warn {
    margin-top: 8px;
    color: var(--buzz);
  }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    aside, main { height: auto; min-height: 100vh; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<!-- civitai-studio night-lab ui -->
<aside>
  <header class="brand">
    <div class="wordmark">
      <svg class="buzz-ico" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <path fill="#f0c36a" d="M9.4.5 3 8.7h4.2L5.5 15.5 13.6 6.8H9.2L9.4.5z"/>
      </svg>
      <h1>Civitai Studio</h1>
    </div>
    <label class="nsfw" title="允许成人内容（Yellow Buzz）">
      <span>成人</span>
      <input id="mature" type="checkbox" checked>
      <span class="switch"></span>
    </label>
  </header>

  <nav class="recipes" role="tablist" aria-label="配方">

<script>
const $ = (id) => document.getElementById(id);
let loras = [];
let kind = 'image';
let recipe = 'image';
let catalog = [];
let backend = 'civitai';
let selected = null;
let picked = { serviceId: null, engine: null, operation: null, ecosystem: null, model: null, version: null, provider: null };
let refUrls = [];
const STATUS_RANK = { available: 0, degraded: 1, unknown: 2, unavailable: 3 };
const TABS = { image: 'tabImage', video: 'tabVideo', upscale: 'tabUpscale', bg: 'tabBg', '3d': 'tab3d', audio: 'tabAudio', workflow: 'tabWorkflow' };

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function opt(sel, arr, cur) {
  sel.innerHTML = arr.map(v => `<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('');
}
function paramSrc(item) {
  return Object.assign({}, item || {}, (item && item.parameters) || {});
}
function paramOf(item, key) {
  if (!item) return null;
  const src = paramSrc(item);
  return src[key] != null ? src[key] : null;
}
function opOf(item) {
  return String(paramOf(item, 'operation') || '');
}
function isVideoGen(it) {
  if (it) return it.step === 'videoGen';
  return recipe === 'video';
}
function needsFirstFrame(it) {
  if (it && it.needsFirstFrame) return true;
  if (!it) return false;
  return /^(imageToVideo|image-to-video|firstLastFrameToVideo)$/i.test(opOf(it));
}
function needsRefs(it) {
  if (!it) return false;
  const op = opOf(it);
  const name = String(it.name || '');
  return /referenceToVideo|reference-to-video|^reference$/i.test(op) || /reference/i.test(op) || name.includes('参考');
}
function needsSource(it) {
  if (it && it.needsSource) return true;
  if (!it) return false;
  const op = opOf(it);
  if (/^(editImage|createVariant|proEditImage|image-to-image)$/i.test(op)) return true;
  if (needsFirstFrame(it) || needsRefs(it)) return false;
  const mods = ((it.modalities || {}).input) || [];
  if (mods.includes('image') && !(mods.length === 1 && mods[0] === 'text')) return true;
  return false;
}
function matchRecipe(it, r) {
  if (!it) return false;
  if (r === 'workflow') return false;
  if (backend !== 'civitai' || it.backend) return (it.category || '') === r;
  if (r === 'image') return it.category === 'image' && it.step === 'imageGen';
  if (r === 'video') return it.category === 'video' && it.step === 'videoGen';
  if (r === 'upscale') {
    const tags = it.tags || [];
    const blob = ((it.id || '') + ' ' + (it.name || '')).toLowerCase();
    return tags.includes('upscaling') || blob.includes('upscaler') || it.step === 'imageUpscaler' || it.step === 'videoUpscaler';
  }
  if (r === 'bg') return (it.tags || []).includes('background-removal') || it.step === 'imageBackgroundRemoval' || it.step === 'videoBackgroundRemoval';
  if (r === '3d') return it.category === '3d' || (it.step || '').toLowerCase().includes('3d') || (it.id || '').includes('3d');
  if (r === 'audio') return it.category === 'audio' || ['aceStepAudio','miniMaxMusic3','textToSpeech'].includes(it.step);
  return false;
}
function recipeFor(it) {
  if (matchRecipe(it, 'upscale')) return 'upscale';
  if (matchRecipe(it, 'bg')) return 'bg';
  if (matchRecipe(it, 'video')) return 'video';
  if (matchRecipe(it, 'image')) return 'image';
  return it && it.category === 'video' ? 'video' : 'image';
}
function copyPicked(it) {
  const src = paramSrc(it);
  picked = {
    serviceId: it ? (it.id || it.serviceId || null) : null,
    engine: src.engine != null ? src.engine : null,
    operation: src.operation != null ? src.operation : null,
    ecosystem: src.ecosystem != null ? src.ecosystem : null,
    model: src.model != null ? src.model : null,
    version: src.version != null ? src.version : null,
    provider: src.provider != null ? src.provider : null,
  };
}
function syncVPreset(it) {
  const vp = $('vPreset');
  if (!vp) return;
  const id = it && it.id ? String(it.id) : '';
  vp.innerHTML = id ? `<option value="${esc(id)}" selected></option>` : '';
  vp.value = id;
}
function currentKind() {
  if (selected && selected.category === 'video') return 'video';
  if (recipe === 'video') return 'video';
  return 'image';
}
let goBusy = false;
let noToken = false;
let wfState = null;
function needsPrompt() {
  if (recipe === 'workflow') return false;
  const step = selected && selected.step;
  return step === 'imageGen' || step === 'videoGen' || !step;
}
function currentServiceId() {
  return (picked && picked.serviceId) || (selected && (selected.id || selected.serviceId)) || '';
}
function setDock(msg, cls) {
  setStatus(msg, cls || '');
  const d = $('dockStatus');
  if (d) { d.className = cls || ''; d.textContent = msg; }
}
function syncGo() {
  const go = $('go');
  if (!go) return;
  go.disabled = !!goBusy;
}
function durationRange(it) {
  const eng = (it && it.engine) || '';
  if (eng === 'kling' || eng === 'kling-v3') return [5, 10];
  if (eng.indexOf('minimax') === 0) return [4, 15];
  if (eng === 'happyHorse') return [3, 15];
  return [1, 30];
}
function updateFields() {
  kind = currentKind();
  const vid = isVideoGen(selected);
  const util = recipe === 'upscale' || recipe === 'bg';
  $('imageFields').classList.toggle('hidden', vid || util);
  $('videoFields').classList.toggle('hidden', !vid);
  $('sourceFields').classList.toggle('hidden', !needsSource(selected));
  $('refFields').classList.toggle('hidden', !needsRefs(selected));
  const hideAir = util || !usesCivitaiAir();
  const mb = $('modelBlock'); if (mb) mb.classList.toggle('hidden', hideAir);
  const lb = $('loraBlock'); if (lb) lb.classList.toggle('hidden', hideAir);
  const ff = $('firstFrameBlock');
  const lf = $('lastFrameBlock');
  if (ff) ff.classList.toggle('hidden', !(vid && needsFirstFrame(selected)));
  if (lf) lf.classList.toggle('hidden', !(vid && /firstLastFrameToVideo/i.test(opOf(selected))));
  const dur = $('duration');
  if (dur && vid) {
    const [lo, hi] = durationRange(selected);
    dur.min = lo; dur.max = hi;
    const n = +dur.value || 5;
    if (n < lo) dur.value = lo;
    if (n > hi) dur.value = hi;
  }
  syncGo();
}
function renderRefs() {
  const box = $('refList');
  if (!box) return;
  box.innerHTML = refUrls.map((u, i) => {
    const label = String(u).startsWith('data:') ? ('参考 ' + (i + 1)) : esc(u).slice(0, 48);
    return `<div data-i="${i}">${label} · 点此删除</div>`;
  }).join('');
  [...box.children].forEach(el => {
    el.onclick = () => { refUrls.splice(+el.getAttribute('data-i'), 1); renderRefs(); };
  });
}
function updateTabClasses() {
  Object.entries(TABS).forEach(([r, id]) => {
    const el = $(id);
    if (!el) return;
    const on = r === recipe;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
  });
}
function svcDisambigTags(list) {
  const groups = {};
  (list || []).forEach(it => {
    const n = it.name || it.id || '';
    (groups[n] || (groups[n] = [])).push(it);
  });
  const out = {};
  Object.keys(groups).forEach(n => {
    const g = groups[n];
    if (g.length < 2) return;
    const parts = g.map(it => String(it.id || '').split('/').filter(Boolean));
    const tags = g.map(() => []);
    const maxLen = Math.max(0, ...parts.map(p => p.length));
    for (let i = 0; i < maxLen; i++) {
      const col = parts.map(p => p[i] || '');
      if (new Set(col).size <= 1) continue;
      col.forEach((v, idx) => { if (v) tags[idx].push(v); });
      const joined = tags.map(t => t.join('/'));
      if (new Set(joined).size === g.length) break;
    }
    g.forEach((it, idx) => {
      let tag = tags[idx].join(' · ');
      if (!tag) {
        const src = paramSrc(it);
        tag = src.engine || src.operation || '';
      }
      if (tag) out[it.id] = tag;
    });
  });
  return out;
}
function svcRow(it, tags) {
  const src = paramSrc(it);
  let name = it.name || it.id || '未命名';
  const extra = tags && tags[it.id];
  if (extra) name = name + ' · ' + extra;
  const meta = [src.engine, src.operation, src.provider || src.version].filter(Boolean).join(' · ');
  const on = selected && selected.id === it.id;
  const badge = it.status === 'degraded' ? '<span class="badge-deg">降级</span>' : '';
  const tip = [name, meta, it.id].filter(Boolean).join(' · ');
  return `<button type="button" class="svc-row${on ? ' on' : ''}" data-id="${esc(it.id)}" title="${esc(tip)}">
    <span class="svc-main"><span class="svc-name">${esc(name)}</span></span>${badge}
  </button>`;
}
function bindRows(root) {
  [...root.querySelectorAll('.svc-row')].forEach(el => {
    el.onclick = () => {
      const it = catalog.find(x => x.id === el.getAttribute('data-id'));
      if (it) selectService(it);
    };
  });
}
function alnum(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]/g, '');
}
function renderServiceList(opts) {
  const pickDefault = !opts || opts.pickDefault !== false;
  const qf = (($('svcFilter') && $('svcFilter').value) || '').toLowerCase();
  const qn = alnum(qf);
  const list = catalog.filter(it => matchRecipe(it, recipe)).filter(it => {
    if (!qn) return true;
    const blob = alnum((it.name||'')+' '+(it.id||'')+' '+(it.engine||'')+' '+(it.operation||'')+' '+((it.tags||[]).join(' ')));
    return blob.includes(qn);
  }).sort((a, b) => {
    const ra = STATUS_RANK[a.status] ?? 9;
    const rb = STATUS_RANK[b.status] ?? 9;
    if (ra !== rb) return ra - rb;
    return String(a.name || a.id).localeCompare(String(b.name || b.id), 'zh');
  });
  const live = list.filter(x => x.status === 'available' || x.status === 'degraded');
  const other = list.filter(x => x.status !== 'available' && x.status !== 'degraded');
  const tags = svcDisambigTags(list);
  let html = live.map(it => svcRow(it, tags)).join('');
  if (other.length) {
    html += `<details class="svc-other"><summary>其它 / 未上线</summary>${other.map(it => svcRow(it, tags)).join('')}</details>`;
  }
  if (!list.length) html = '<div class="svc-empty">这个配方下还没有服务</div>';
  $('serviceList').innerHTML = html;
  bindRows($('serviceList'));
  let pick = selected && list.some(x => x.id === selected.id) ? selected : null;
  if (pickDefault || !pick) {
    pick = list.find(x => x.status === 'available') || list.find(x => x.status === 'degraded') || null;
  }
  selected = pick;
  copyPicked(pick);
  syncVPreset(pick);
  [...$('serviceList').querySelectorAll('.svc-row')].forEach(el => {
    el.classList.toggle('on', !!(pick && el.getAttribute('data-id') === pick.id));
  });
  updateFields();
}
function selectService(it) {
  selected = it || null;
  copyPicked(it);
  syncVPreset(it);
  [...$('serviceList').querySelectorAll('.svc-row')].forEach(el => {
    el.classList.toggle('on', !!(it && el.getAttribute('data-id') === it.id));
  });
  updateFields();
}
function setRecipe(r) {
  recipe = r;
  kind = r === 'video' ? 'video' : 'image';
  updateTabClasses();
  selected = null;
  const wf = r === 'workflow';
  if ($('serviceList')) $('serviceList').hidden = wf;
  if ($('svcFilter')) $('svcFilter').hidden = wf;
  if ($('wfPanel')) $('wfPanel').hidden = !wf;
  if (wf) loadWorkflows();
  else renderServiceList({ pickDefault: true });
}
function setKind(k) {
  if (k === 'image' || k === 'video') setRecipe(k);
}
function usesCivitaiAir() { return backend === 'civitai'; }
function setCheckpoint(name, air) {
  if ($('diffusion')) $('diffusion').value = air || '';
  const el = $('ckptName');
  if (!el) return;
  const n = (name || '').trim();
  const a = (air || '').trim();
  el.textContent = n;
  el.title = a;
}
function clearCivitaiFields() {
  setCheckpoint('', '');
  loras = [];
  if ($('loras')) renderLoras();
  if ($('hits')) $('hits').innerHTML = '';
}
function syncBackendChrome() {
  const air = usesCivitaiAir();
  if ($('modelBlock')) $('modelBlock').classList.toggle('hidden', !air);
  if ($('loraBlock')) $('loraBlock').classList.toggle('hidden', !air);
  const f = $('svcFilter');
  if (f) f.placeholder = backend === 'civitai' ? '筛选服务' : '搜索模型';
}
function renderLoras() {
  $('loras').innerHTML = loras.map((l, i) => `
    <div class="lora"><div class="top">
      <div class="lora-info"><div class="lora-name">${esc(l.name||'LoRA')}</div><div class="lora-air">${esc(l.air)}</div></div>
      <input class="lora-str" type="number" step="0.05" min="0" max="2" value="${l.strength}" onchange="loras[${i}].strength=parseFloat(this.value)">
      <button type="button" class="lora-del" onclick="loras.splice(${i},1);renderLoras()">删</button>
    </div></div>`).join('');

  if (q.startsWith('urn:air:') || q.includes(':lora:')) { addLora({ air: q, name: q.split(':').pop(), strength: 0.8 }); return; }
  try {
    const j = await api('/api/search?type=LORA&q=' + encodeURIComponent(q));
    if (!j.items.length) { $('hits').textContent = '没有结果'; return; }
    $('hits').innerHTML = j.items.map(it => {
      const v = (it.versions || [])[0];
      return `<div data-vid="${v && v.id}"><b>${esc(it.name)}</b> ${v ? ('· ' + esc(v.name) + ' · ' + esc(v.baseModel)) : ''}</div>`;
    }).join('');
    [...$('hits').children].forEach(el => el.onclick = async () => {
      const vid = el.getAttribute('data-vid'); if (!vid) return;
      addLora(await api('/api/model-version/' + vid));
    });
  } catch (e) { $('hits').textContent = '搜索失败'; }
};
function addLora(v) {
  if (!v.air) return;
  loras.push({ air: v.air, strength: 0.8, name: (v.model || v.name || 'LoRA') });
  renderLoras(); $('hits').innerHTML = '';
}
window.addLora = addLora;
window.onerror = (m) => setStatus('页面出错: ' + m, 'bad');

if ($('galFilters')) {
  [...$('galFilters').querySelectorAll('button')].forEach(b => {
    b.onclick = () => {
      galFilter = b.getAttribute('data-kind') || 'all';
      [...$('galFilters').querySelectorAll('button')].forEach(x => x.classList.toggle('on', x === b));
      renderGallery();
    };
  });
}
loadGallery();
renderGallery();

(async () => {
  let tokenMsg = '';
  try {
    const j = await api('/api/defaults');
    opt($('sampler'), j.samplers || [], (j.defaults || {}).sampler);
    opt($('scheduler'), j.schedulers || [], (j.defaults || {}).scheduler);
    const d = j.defaults || {};
    if (d.width) $('width').value = d.width;
    if (d.height) $('height').value = d.height;
    if (d.steps) $('steps').value = d.steps;
    if (d.cfgScale != null) $('cfg').value = d.cfgScale;
    if (d.quantity) $('qty').value = d.quantity;
    if (d.model) $('model').value = d.model;
    if (backend === 'civitai') setCheckpoint(d.checkpointName || '', d.diffusionModel || '');
    else clearCivitaiFields();
    syncBackendChrome();
    if ('allowMatureContent' in d) $('mature').checked = !!d.allowMatureContent;
    else $('mature').checked = true;
    loras = (d.loras || []).map(x => Object.assign({}, x)); renderLoras();
    window._hasKeys = j.hasKeys || {};
    if (j.hasToken === false) {
      tokenMsg = '还没有 Civitai API Key';
      noToken = true;
    }
  } catch (e) {
    tokenMsg = '默认参数加载失败';
  }
  if ($('diffusion')) $('diffusion').addEventListener('input', () => {
    const el = $('ckptName');
    if (el) el.title = $('diffusion').value.trim();
  });
  if ($('svcFilter')) $('svcFilter').oninput = onSvcFilter;
  if ($('prompt')) $('prompt').addEventListener('input', syncGo);
  syncGo();
  async function loadCatalog(q) {
    if (q == null) q = (($('svcFilter') && $('svcFilter').value) || '').trim();
    let url = '/api/catalog?backend=' + encodeURIComponent(backend);
    if (q) url += '&q=' + encodeURIComponent(q);
    const cat = await api(url);
    catalog = cat.items || [];
    setRecipe(recipe || 'image');
    const n = catalog.length;
    const label = (window._providerLabel && window._providerLabel[backend]) || backend;
    if (!n) setStatus(label + ' 目录为空', 'bad');
    else setStatus(label + ' 已加载 ' + n + ' 个模型。自己点生成。' + (tokenMsg ? ' ' + tokenMsg : ''));
  }
  let hubSearchTimer = null;
  function onSvcFilter() {
    const live = backend === 'modelscope' || backend === 'huggingface' || backend === 'fal';
    if (live) {
      clearTimeout(hubSearchTimer);
      hubSearchTimer = setTimeout(async () => {
        try {
          await loadCatalog();
        } catch (e) {
          setStatus('搜索失败', 'bad');
        }
      }, 280);
      return;
    }
    renderServiceList({ pickDefault: false });
  }
  async function loadProviders() {
    const box = $('backendSwitch');
    if (!box) return;
    let items = [];
    try {
      const r = await api('/api/providers');
      items = r.items || [];
    } catch (e) {
      items = [{id:'civitai',label:'Civitai'},{id:'fal',label:'Fal'}];
    }
    window._providerLabel = {};
    box.innerHTML = '';
    items.forEach((p, i) => {
      window._providerLabel[p.id] = p.label || p.id;
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.backend = p.id;
      b.textContent = p.label || p.id;
      if ((p.id === backend) || (!backend && i === 0)) b.classList.add('on');
      b.onclick = async () => {
        backend = p.id;
        box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        clearCivitaiFields();
        syncBackendChrome();
        setStatus('正在加载 ' + (p.label || p.id) + '…');
        try { await loadCatalog(); } catch (e) { setStatus((p.label || p.id) + ' 目录失败', 'bad'); }
      };
      box.appendChild(b);
    });
  }
  async function loadOuts() {
    try {
      const r = await api('/api/outs');
      const items = r.items || [];
      const diskKeys = new Set();
      items.forEach(s => {
        const a = cardUrlKey(s.url);
        const b = cardUrlKey(s.file);
        if (a) diskKeys.add(a);
        if (b) diskKeys.add(b);
      });
      galleryItems = galleryItems.filter(it => {
        if (itemKeys(it).some(k => diskKeys.has(k))) return false;
        if (isOutRef(it && it.url) || isOutRef(it && it.meta)) return false;
        return true;
      });
      items.forEach(s => {
        const key = cardUrlKey(s.file || s.url);
        if (!key) return;
        galleryItems.push({
          id: 'out:' + key,
          url: s.url || ('/out/' + (s.file || key)),
          kind: s.kind === 'video' ? 'video' : 'image',
          meta: s.file || key,
          ts: 0,
        });
      });
      saveGallery();
      renderGallery();
    } catch (e) {}
  }
  try {
    await loadProviders();
    await loadCatalog();
    await loadOuts();
  } catch (e) {
    catalog = [];
    setRecipe('image');
    setStatus('无法加载服务目录，请刷新', 'bad');
  }
})();
</script>
</body>
</html>
