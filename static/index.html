<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civitai Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --panel: #111114;
    --elev: #18181f;
    --line: #2a2a33;
    --text: #f4f1ea;
    --muted: #8b8796;
    --accent: #ff4d3d;
    --buzz: #f0c36a;
    --ok: #5dcaa0;
    --nsfw: #ff5c8a;
    --radius: 10px;
    --radius-sm: 8px;
    --font: "Outfit", "Noto Sans SC", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  html { color-scheme: dark; }
  body {
    display: grid;
    grid-template-columns: 440px 1fr;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 var(--font);
  }
  body::before {
    content: "";
    pointer-events: none;
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(1100px 520px at 8% -12%, rgba(240,195,106,.08), transparent 58%),
      radial-gradient(780px 480px at 100% 108%, rgba(255,77,61,.06), transparent 52%);
  }
  aside, main { position: relative; z-index: 1; }

  aside {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px 12px;
    flex-shrink: 0;
  }
  .wordmark { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .wordmark h1 {
    font-family: Outfit, var(--font);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .18em;
    margin: 0;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .buzz-ico { flex-shrink: 0; display: block; filter: drop-shadow(0 0 6px rgba(240,195,106,.45)); }

  .nsfw {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .1em;
    flex-shrink: 0;
  }
  .nsfw input {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
  }
  .nsfw .switch {
    width: 32px;
    height: 18px;
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: 99px;
    position: relative;
    display: inline-block;
    transition: border-color .15s, background .15s;
  }
  .nsfw .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    background: var(--muted);
    border-radius: 50%;
    transition: transform .15s, background .15s;
  }
  .nsfw input:checked + .switch {
    background: color-mix(in srgb, var(--nsfw) 32%, var(--elev));
    border-color: var(--nsfw);
  }
  .nsfw input:checked + .switch::after {
    transform: translateX(14px);
    background: var(--nsfw);
  }
  .nsfw:focus-within .switch { outline: 1px solid var(--buzz); outline-offset: 1px; }

  .recipes {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 0 18px 14px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    flex-shrink: 0;
  }
  .recipes button {
    flex: 1 1 3.2em;
    min-width: 0;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 8px 6px;
    font: 500 13px/1.2 var(--font);
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .recipes button:hover { color: var(--text); }
  .recipes button.on {
    background: var(--elev);
    color: var(--buzz);
    border-color: color-mix(in srgb, var(--buzz) 45%, var(--line));
    box-shadow: 0 0 0 1px rgba(240,195,106,.08);
  }
  .recipes button:focus-visible { outline: 1px solid var(--buzz); outline-offset: 1px; }

  .form {
    overflow: auto;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 18px 20px;
  }
  .form::-webkit-scrollbar,
  main::-webkit-scrollbar { width: 8px; }
  .form::-webkit-scrollbar-thumb,
  main::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 99px;
  }

  .block { margin-bottom: 16px; }
  .block-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .14em;
    color: var(--muted);
  }
  .block-title::before {
    content: "";
    width: 12px;
    height: 2px;
    background: var(--buzz);
    border-radius: 2px;
    opacity: .85;
  }

  .lbl {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin: 10px 0 5px;
    letter-spacing: .06em;
  }
  .block > .lbl:first-child,
  .adv > .lbl:first-child { margin-top: 0; }

  textarea, input, select {
    width: 100%;
    background: var(--elev);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    font: 13px/1.45 var(--font);
  }
  textarea { min-height: 132px; resize: vertical; padding: 10px 12px; font-size: 14px; }
  #prompt { min-height: 176px; }
  #prompt.need-prompt {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  textarea.neg { min-height: 64px; font-size: 13px; }
  select {
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238b8796' d='M1 1.5 6 6.5 11 1.5'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 28px;
  }
  textarea:hover, input:hover, select:hover { border-color: color-mix(in srgb, var(--buzz) 35%, var(--line)); }
  textarea:focus, input:focus, select:focus {
    outline: 1px solid var(--buzz);
    outline-offset: 1px;
    border-color: var(--buzz);
  }
  #svcFilter:focus {
    outline: none;
    outline-offset: 0;
    border-color: color-mix(in srgb, var(--buzz) 28%, var(--line));
    box-shadow: none;
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .import-row { display: flex; gap: 8px; }
  .import-row input { flex: 1; min-width: 0; }
  .import-row button { flex: 0 0 auto; }

  button {
    border: 0;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font: 500 13px/1.2 var(--font);
    cursor: pointer;
  }
  .ghost {
    background: var(--elev);
    color: var(--text);
    border: 1px solid var(--line);
  }
  .ghost:hover { border-color: var(--buzz); color: var(--buzz); }
  .ghost:focus-visible, .primary:focus-visible {
    outline: 1px solid var(--buzz);
    outline-offset: 1px;
  }

  .adv {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    padding: 0 10px 10px;
  }
  .adv summary {
    cursor: pointer;
    list-style: none;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .08em;
    padding: 10px 2px;
    user-select: none;
  }
  .adv summary::-webkit-details-marker { display: none; }
  .adv summary::before {
    content: "▸";
    color: var(--buzz);
    display: inline-block;
    width: 1em;
    margin-right: 4px;
  }
  .adv[open] summary::before { content: "▾"; }
  .adv summary:hover { color: var(--text); }

  .dropzone { display: flex; flex-direction: column; gap: 8px; }
  .dz-hit {
    position: relative;
    min-height: 92px;
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    overflow: hidden;
  }
  .dz-hit:hover, .dz-hit:focus-within { border-color: var(--buzz); }
  #firstFile, #sourceFile, #refs, #lastFile {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    z-index: 2;
    border: 0;
    padding: 0;
    background: transparent;
    border-radius: 0;
  }
  .dz-ui {
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 92px;
    color: var(--muted);
    font-size: 12px;
  }
  .dz-ico {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    color: var(--buzz);
    font-size: 16px;
    line-height: 1;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .check input {
    width: 15px;
    height: 15px;
    accent-color: var(--buzz);
    cursor: pointer;
  }

  .ckpt, .ckpt-face {
    color: var(--text);
    font-size: 13px;
    margin-top: 0;
    min-height: 1.2em;
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ckpt-face:empty::before { content: "未选底模"; color: var(--muted); }

  .lora {
    background: var(--elev);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 8px;
  }
  .lora .top { display: flex; gap: 8px; align-items: center; }
  .lora-info { flex: 1; min-width: 0; }
  .lora-name { font-size: 13px; font-weight: 500; }
  .lora-air { font-size: 11px; color: var(--muted); margin: 2px 0 0; word-break: break-all; }
  .lora-status { font-size: 11px; color: var(--buzz); margin: 2px 0 0; }
  .lora.need-url { border-color: var(--accent); }
  .lora-status.bad, .lora.need-url .lora-status { color: var(--accent) !important; }
  .lora-miss-chip {
    display: inline-block;
    margin-left: 6px;
    vertical-align: middle;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .03em;
    padding: 1px 7px;
    border-radius: 999px;
    color: var(--accent);
    background: rgba(255, 77, 61, .14);
    border: 1px solid rgba(255, 77, 61, .55);
  }
  .lora-str { width: 72px !important; flex-shrink: 0; }
  .lora-del {
    padding: 6px 8px;
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
  }
  .lora-del:hover { color: var(--accent); border-color: var(--accent); }

  .hits { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hits div {
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    margin-top: 6px;
    cursor: pointer;
    background: var(--elev);
  }
  .hits div:hover { border-color: var(--buzz); color: var(--text); }

  .dock {
    flex-shrink: 0;
    min-width: 0;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 12px 18px 16px;
    box-shadow: 0 -16px 28px rgba(9,9,11,.45);
  }
  .cost {
    color: var(--buzz);
    font-size: 12px;
    letter-spacing: .04em;
    min-height: 1.2em;
    margin-bottom: 8px;
  }
  .dock { position: relative; z-index: 40; }
  .btns { display: flex; gap: 8px; align-items: stretch; position: relative; z-index: 50; }
  #go { position: relative; z-index: 60; pointer-events: auto; touch-action: manipulation; }
  .btns .ghost { flex: 0 0 88px; }
  .qty-dock {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 0 0 70px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }
  .qty-dock input {
    width: 48px;
    text-align: center;
    padding: 12px 4px;
    font-size: 14px;
  }
  .primary {
    background: var(--accent);
    color: #fff;
    flex: 1;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 12px;
    border-radius: var(--radius);
    letter-spacing: .12em;
    box-shadow: 0 8px 22px rgba(255,77,61,.22);
  }
  .primary:hover:not(:disabled) { filter: brightness(1.06); }
  .primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
  #dockStatus {
    color: var(--muted);
    font-size: 12px;
    min-height: 1.3em;
    margin-top: 8px;
    max-width: 100%;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  main {
    padding: 18px 22px 24px;
    overflow: auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .status {
    color: var(--muted);
    min-height: 1.3em;
    margin-bottom: 14px;
    word-break: break-all;
    font-size: 13px;
  }
  .ok { color: var(--ok) !important; }
  .bad { color: var(--accent) !important; }
  .warn { color: #d4a017 !important; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 180px;
    color: var(--muted);
    text-align: center;
    padding: 48px 24px 24px;
  }
  .empty-frame {
    width: 76px;
    height: 76px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    margin-bottom: 16px;
    position: relative;
    background: var(--panel);
  }
  .empty-frame::before {
    content: "";
    position: absolute;
    inset: 22px 18px 26px;
    border: 1px solid color-mix(in srgb, var(--buzz) 40%, var(--line));
    border-radius: 4px;
    opacity: .7;
  }
  .empty-frame::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--buzz);
    top: 16px;
    right: 16px;
    box-shadow: 0 0 10px rgba(240,195,106,.5);
  }
  .empty-title { margin: 0 0 6px; font-size: 15px; color: var(--text); font-weight: 600; }
  .empty-hint { margin: 0; font-size: 12px; max-width: 280px; line-height: 1.6; }


  .gal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .gal-head h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .gal-count { color: var(--muted); font-size: 12px; margin-left: 8px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .gal-act { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #galRefresh { padding: 6px 10px; font-size: 12px; }
  .gal-filters { display: flex; gap: 4px; }
  .gal-filters button {
    background: var(--elev);
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 6px 10px;
    font-size: 12px;
  }
  .gal-filters button.on { color: var(--buzz); border-color: color-mix(in srgb, var(--buzz) 45%, var(--line)); }
  .card-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
  }
  .card-bar .meta { padding: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-acts { display: flex; gap: 6px; flex-shrink: 0; }
  .card-acts .ghost, .card-acts a.ghost {
    padding: 6px 8px;
    font-size: 11px;
    text-decoration: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .15s;
  }
  .card:hover { border-color: color-mix(in srgb, var(--buzz) 40%, var(--line)); }
  .card img, .card video { width: 100%; max-height: 420px; object-fit: contain; display: block; background: #000; }
  .card .meta { padding: 8px 10px; color: var(--muted); font-size: 12px; }


  .ghost:disabled { opacity: .55; cursor: wait; }
  .wait-pane {
    margin: 0 0 10px;
    padding: 12px;
    background: color-mix(in srgb, var(--buzz) 10%, var(--elev));
    border: 1px solid color-mix(in srgb, var(--buzz) 60%, var(--line));
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .wait-pane.hidden { display: none !important; }
  .wait-head { display: flex; align-items: center; gap: 10px; }
  .wait-spin {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 2px solid var(--line);
    border-top-color: var(--buzz);
    border-radius: 50%;
    animation: waitspin .7s linear infinite;
  }
  .wait-title { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
  .wait-cancel { margin-left: auto; flex-shrink: 0; font-size: 12px; padding: 4px 10px; }
  .wait-cancel:disabled { opacity: .55; cursor: wait; }
  .wait-bar {
    height: 8px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 99px;
    overflow: hidden;
  }
  .wait-bar > i {
    display: block;
    height: 100%;
    width: 28%;
    background: var(--buzz);
    border-radius: 99px;
  }
  .wait-bar > i.indet { animation: waitslide 1.35s ease-in-out infinite; }
  .wait-meta { font-size: 12px; color: var(--buzz); letter-spacing: .02em; }
  @keyframes waitspin { to { transform: rotate(360deg); } }
  @keyframes waitslide {
    0% { transform: translateX(-120%); width: 32%; }
    100% { transform: translateX(340%); width: 32%; }
  }

  .hidden { display: none !important; }

  .svc-picked {
    margin-top: 6px;
    font-size: 12px;
    color: var(--buzz);
    background: var(--elev);
    border: 1px solid color-mix(in srgb, var(--buzz) 35%, var(--line));
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .svc-picked.is-empty { color: var(--muted); border-color: var(--line); }
  .svc-list {
    flex: 0 1 34vh;
    min-height: 0;
    height: auto;
    max-height: 34vh;
    overflow: auto;
    position: relative;
    z-index: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }
  #importBlock {
    position: relative;
    z-index: 1;
  }
  .svc-list::-webkit-scrollbar { width: 8px; }
  .svc-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 99px; }
  .svc-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    padding: 7px 10px;
    font: 500 13px/1.25 var(--font);
  }
  .svc-row:hover { background: var(--elev); color: var(--text); }
  .svc-row.on {
    background: var(--elev);
    color: var(--buzz);
    border-color: color-mix(in srgb, var(--buzz) 45%, var(--line));
    box-shadow: 0 0 0 1px rgba(240,195,106,.08);
  }
  .svc-row:focus-visible { outline: 1px solid var(--buzz); outline-offset: 1px; }
  .svc-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .svc-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .svc-meta {
    font-size: 10px;
    font-weight: 400;
    color: #5a5663;
    letter-spacing: .02em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge-deg {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--buzz);
    border: 1px solid color-mix(in srgb, var(--buzz) 50%, var(--line));
    background: color-mix(in srgb, var(--buzz) 14%, transparent);
    border-radius: 99px;
    padding: 1px 6px;
  }
  .svc-other {
    margin-top: 4px;

<script>

async function poll(id) {
  waitJobId = id;
  waitCanceled = false;
  const btn = $('waitCancel');
  if (btn) btn.disabled = false;
  for (let i = 0; i < 180; i++) {
    if (waitCanceled) {
      stopWait();
      return;
    }
    const j = await api('/api/jobs/' + encodeURIComponent(id));
    const st = (j.status || '').toLowerCase();
    const w = j.wait || {};
    const job = (((j.steps || [])[0] || {}).jobs || [])[0] || {};
    const q = job.queuePosition || {};
    const ahead = (w.precedingJobs != null) ? w.precedingJobs : (q.precedingJobs != null ? q.precedingJobs : j.queue_position);
    let extra = (st || '');
    if (ahead != null && ahead !== '') extra += Number(ahead) ? (' · 前面还有 ' + ahead) : ' · 轮到了';
    const eta = w.etaSeconds;
    if (eta != null && eta !== '' && Number(eta) > 0) extra += ' · 大约还要 ' + fmtWait(Number(eta));
    if (w.log) extra += ' · ' + String(w.log).slice(0, 80);
    let pct = null;
    const rate = w.progress;
    if (rate != null && rate !== '') {
      const n = Number(rate);
      if (!Number.isNaN(n)) pct = Math.round((n <= 1 ? n * 100 : n));
    }
    setStatus('任务 ' + extra);
    updateWait(st === 'processing' || st === 'preparing' ? '生成中' : '排队中', extra, pct);
    if (st === 'succeeded') {
      const saved = j.saved || [];
      if (!saved.length) {
        const msg = '成功但没拿到文件' + (j.saveError ? (' · ' + j.saveError) : '');
        setStatus(msg, 'bad');
        setDock(msg, 'bad');
        stopWait();
        return;
      }
      saved.forEach(s => addCard(s.url, id, s.kind === 'video' || (s.file || '').endsWith('.mp4')));
      updateWait('完成', null, 100);
      if (j.warning) syncSeedAfterGenerate(j, '好了 · ' + j.warning, 'warn');
      else syncSeedAfterGenerate(j, '好了', 'ok');
      stopWait();
      return;
    }
    if (['failed', 'canceled', 'cancelled', 'expired'].includes(st)) {
      const msg = st + ' ' + JSON.stringify(j).slice(0, 240);
      setStatus(msg, 'bad');
      setDock(msg, 'bad');
      stopWait();
      return;
    }
    await new Promise(r => setTimeout(r, 3000));
  }
  {
    const msg = '等太久了，任务还在队列：' + id;
    setStatus(msg, 'bad');
    setDock(msg, 'bad');
  }
  stopWait();
}

function exactRepoNamedIn(text, repo) {
  // Exact repo token only — "Qwen/Qwen-Image" must not hit inside "Qwen/Qwen-Image-2512".
  const t = String(text || '');
  const r = String(repo || '');
  if (!t || !r) return false;
  let from = 0;
  while (true) {
    const i = t.indexOf(r, from);
    if (i < 0) return false;
    const after = t[i + r.length] || '';
    if (!after || !/[A-Za-z0-9._\-\/]/.test(after)) return true;
    from = i + 1;
  }
}

    if (seq !== catalogSeq || backend !== want) return;
    catalog = cat.items || [];
    updateTabClasses();
    // v0766: while goBusy/generateLockId — never pickForBackend / never steal selection.
    if (goBusy || generateLockId) {
      const lock = generateLockId || userPickedId || '';
      renderServiceList({ pickDefault: false });
      if (lock) {
        const keep = findCatalogItem(lock);
        if (keep) {
          selected = keep;
          copyPicked(keep);
          showPickedChip();
        }
        // Do NOT setDock「不在当前目录」mid-generate — lockId is authoritative until POST completes.
      }
      return;
    }
    // Catalog must not rewrite hash; only re-select userPickedId when set.
    renderServiceList({ pickDefault: !userPickedId && !selectionLocked() });
    if (backend === 'civitai' && lastImport && lastImport.serviceId && !userPickedId && !selectionLocked()) {
      selectServiceById(lastImport.serviceId);
      if (lastImport.checkpointName || lastImport.diffusionModel) {
        setCheckpoint(lastImport.checkpointName || '', lastImport.diffusionModel || '');
      }
    } else if (userPickedId) {
      const keep = findCatalogItem(userPickedId);
      if (keep) selectService(keep);
      else setDock('已选模型不在当前目录：' + userPickedId + '（请重新点选确切 id）', 'bad');
    } else if (backend !== 'civitai' && !selectionLocked() && !lastImport) {
      // never auto remap via pickForBackend (MusePublic/2512).
      pickForBackend();
    }
    const n = catalog.length;
    const label = (window._providerLabel && window._providerLabel[backend]) || backend;
    const matched = catalog.filter(it => matchRecipe(it, recipe));
    if (dockHold()) return;
    if (!n) setDock(label + ' 目录为空', 'bad');
    else if (!matched.length) setDock('当前配方无匹配模型，请搜索或切换供应商', 'warn');
    else setStatus(label + ' 已加载 ' + n + ' 个模型。自己点生成。' + (tokenMsg ? ' ' + tokenMsg : ''));
  }
  window.loadCatalog = loadCatalog;
  let hubSearchTimer = null;
  function onSvcFilter() {
    if (isModelscope() || backend === 'huggingface') {
      clearTimeout(hubSearchTimer);
      hubSearchTimer = setTimeout(async () => {
        try {
          await loadCatalog();
        } catch (e) {
          setStatus('搜索失败', 'bad');
        }
      }, 280);
      return;
    }
    renderServiceList({ pickDefault: false });
  }
  async function loadProviders() {
    const box = $('backendSwitch');
    if (!box) return;
    let items = [];
    try {
      const r = await api('/api/providers');
      items = r.items || [];
    } catch (e) {
      items = [{id:'civitai',label:'Civitai'},{id:'fal',label:'Fal'}];
    }
    window._providerLabel = {};
    box.innerHTML = '';
    items.forEach((p, i) => {
      window._providerLabel[p.id] = p.label || p.id;
      window._hasKeys = window._hasKeys || {};
      if ('hasKey' in p) window._hasKeys[p.id] = !!p.hasKey;
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.backend = p.id;
      const short = { huggingface: 'HF', 'modelscope-ai': '魔搭 AI', 'modelscope-cn': '魔搭 CN', 'nano-gpt': 'Nano' }[p.id];
      b.textContent = short || p.label || p.id;
      b.title = p.label || p.id;
      if ((p.id === backend) || (!backend && i === 0)) b.classList.add('on');
      b.onclick = async () => {
        lastBackendClickAt = Date.now();
        lastBackendClickId = p.id;
        backend = p.id;
        persistBackend(p.id);
        try { stopWait(); } catch (e) {}
        waitJobId = '';
        setDock('已切到 ' + (short || p.label || p.id) + ' · 选模型后点生成', '');
        userPickedId = null;
        selected = null;
        box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        if ($('svcFilter')) $('svcFilter').value = '';
        const keepLoras = loras.slice();
        clearCivitaiFields();
        if (p.id !== 'civitai') {
          if (keepLoras.length) loras = keepLoras;
          else if (lastImport && Array.isArray(lastImport.loras) && lastImport.loras.length) loras = lastImport.loras.map(normalizeLora);
          renderLoras();
        } else if (lastImport && Array.isArray(lastImport.loras)) {
          loras = lastImport.loras.map(normalizeLora);
          if (lastImport.checkpointName || lastImport.diffusionModel) {
            setCheckpoint(lastImport.checkpointName || '', lastImport.diffusionModel || '');
          }
          renderLoras();
        }
        syncBackendChrome();
        syncImportChrome();
        setDock('正在加载 ' + (p.label || p.id) + '…');
        try {
          await loadCatalog();
          // v0766: never pickForBackend on a post-import auto path that could freeze cousins.
          if (backend !== 'civitai' && !userPickedId && !lastImport) {
            pickForBackend();
            resolveLorasForBackend();
          } else if (backend !== 'civitai' && userPickedId) {
            resolveLorasForBackend();
          }
          updateFields();
          // v0772: switching to Nano with a long prompt → dock warn (no silent truncate)
          if (isNanogpt() && nanoPromptLen() > NANO_PROMPT_MAX) {
            syncNanoPromptHint({ warnDock: true });
          } else {
            syncNanoPromptHint();
          }
        } catch (e) { setDock((p.label || p.id) + ' 目录失败', 'bad'); }
      };
      box.appendChild(b);
    });
  }
  try {
    await loadProviders();
    syncImportChrome();
    await loadCatalog();
    await loadOuts();
    let wantWf = false;
    try { wantWf = /recipe=workflow/.test(location.hash || ""); } catch (e) {}
    if (wantWf) {
      setRecipe('workflow');
      try {
        const bag = JSON.parse(sessionStorage.getItem('civitai-studio-wf') || '');
        if (bag && bag.state && bag.state.workflowApi) {
          wfState = bag.state;
          wfState.resources = bag.state.resources || (bag.state.airMap && bag.state.airMap.resources) || [];
          const meta = bag.state.meta || {};
          if ($('wfMeta')) $('wfMeta').textContent = (meta.name||'工作流') + ' · ' + (bag.state.nodes||0) + ' 节点' + (bag.state.warning ? ' · ' + bag.state.warning : '');
          renderAirMap(bag.state);
          const prompts = bag.state.prompts || [];
          if ($('wfPrompts')) $('wfPrompts').innerHTML = prompts.map((pr,i) => '<label class="lbl">'+esc(pr.title||pr.type||('提示 '+i))+'</label><textarea class="wfPrompt" data-id="'+esc(pr.id)+'">'+esc(pr.text||'')+'</textarea>').join('');
          picked.serviceId = 'utility/customComfy';
          picked.engine = 'comfy';
        }
      } catch (e2) {}
    }
  } catch (e) {
    catalog = [];
    setRecipe('image');
    setDock('无法加载服务目录，请刷新', 'bad');
  }
  // v0764: Generate is html onclick=__studioGo only (no capture duplicate).
  const go = $('go');
  ['width', 'height'].forEach(id => {
    const el = $(id);
    if (el) el.addEventListener('change', () => { if (isNanogpt()) syncNanoResSelect(); });
    if (el) el.addEventListener('input', () => { if (isNanogpt()) syncNanoResSelect(); });
  });
  if ($('nanoRes')) $('nanoRes').addEventListener('change', () => {
    const hint = $('nanoResHint');
    if (!hint) return;
    const iw = +($('width') && $('width').value) || 0;
    const ih = +($('height') && $('height').value) || 0;
    let line = '将提交 resolution=' + ($('nanoRes').value || '?');
    if (iw && ih) line += ' · 导入尺寸 ' + iw + '×' + ih + ' 仅参考，不进 POST';
    hint.textContent = line;
  });
  window.addEventListener('hashchange', () => {
    try {
      const h = (location.hash || '').replace(/^#/, '').split('&')[0];
      if (!isKnownBackend(h)) {
        persistBackend(backend);
        return;
      }
      if (h === backend) return;
      // Stale fal (or other) hash must not overwrite a recent user click on 魔搭.
      if (backendClickLocked(h)) {
        persistBackend(lastBackendClickId || backend);
        return;
      }
      // Real navigation (back/forward).
      backend = h;
      persistBackend(h);
      try { stopWait(); } catch (e) {}
      waitJobId = '';
      setDock('已切后端 · 选模型后点生成', '');
      const box = $('backendSwitch');
      if (box) box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.backend === h));
      userPickedId = null;
      selected = null;
      if ($('svcFilter')) $('svcFilter').value = '';
      syncBackendChrome();
      syncImportChrome();
      loadCatalog().catch(() => setDock(((window._providerLabel || {})[h] || h) + ' 目录失败', 'bad'));
    } catch (e) {}
  });
})();
</script>
</body>
</html>
